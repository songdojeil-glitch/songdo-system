<style>
:root{--bg:#f7f8fa;--card:#fff;--text:#1a202c;--text3:#718096;--border:#d4dae3;--accent:#0e7490}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
body{display:flex;flex-direction:column;min-height:100vh}
.tl-hd{background:var(--card);border-bottom:1px solid var(--border)}
.tl-hd-in{max-width:2560px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tl-logo{font-size:18px;font-weight:800;color:#364fc7;display:flex;align-items:baseline;gap:7px}
.tl-logo span{font-size:11px;font-weight:600;color:var(--text3)}
.tl-me{margin-left:auto;font-size:11.5px;color:var(--text3);display:flex;gap:8px;align-items:center}
.tl-me b{color:var(--text)}
.tl-me .rl{padding:1px 7px;border-radius:8px;background:#fff3bf;color:#a06800;font-size:10px;font-weight:700}
.tl-logo small{font-size:10px;font-weight:400;color:var(--text3)}
.tl-tabs{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.tl-tabs-in{max-width:2560px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tl-tab{padding:11px 16px;border:none;border-bottom:3px solid transparent;background:none;font-size:13.5px;font-weight:600;color:#4a5568;cursor:pointer;white-space:nowrap;font-family:inherit}
.tl-tab:hover{color:#364fc7}
.tl-tab.on{color:#364fc7;border-bottom-color:#4c6ef5}
.tl-wrap{flex:1 1 auto;position:relative;min-height:0}
#tool-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#tl-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--text3);font-size:13px;background:var(--bg);z-index:2}
#tl-load .sp{width:30px;height:30px;border:3px solid #dbe4ff;border-top-color:#4c6ef5;border-radius:50%;animation:tlsp .8s linear infinite}
@keyframes tlsp{to{transform:rotate(360deg)}}
@media(max-width:700px){ .tl-hd-in,.tl-tabs-in{padding-left:12px;padding-right:12px} .tl-tab{padding:10px 11px;font-size:12.5px} }
</style>

<script>
(function(){
  'use strict';
  var SD_VER = '2026.10.02-1';
  var TABS = [
    [20, '🧰 전체 도구'],
    [26, '🤝 직방 가격 제안'],
    [27, '🔎 공시가격 조회'],
    [24, '🏗️ 건축물대장'],
    [25, '🔑 추출기 열쇠']
  ];
  var LKEY = 'sd_tool_tab', CUR = 0;
  var fr = document.getElementById('tool-frame'), ld = document.getElementById('tl-load');
  var ver = document.getElementById('tl-ver'); if(ver) ver.textContent = 'v' + SD_VER;
  window.SD_VERSION = SD_VER;
  //  로그인한 사람 — 데이터관리와 같은 기록(sd_auth_session)을 읽는다. 로그아웃은 허브에서
  try{
    var se = JSON.parse(localStorage.getItem('sd_auth_session') || '{}') || {}, me = document.getElementById('tl-me');
    var RL = { master:'마스터', admin:'관리자', staff:'직원', user:'직원' };
    if(me && se.name) me.innerHTML = '<b>' + String(se.name).replace(/[<>&"]/g, '') + '</b>' + (se.role ? '<span class="rl">' + (RL[se.role] || String(se.role).replace(/[<>&"]/g, '')) + '</span>' : '') + '<a href="sd_hub.html" style="color:#3b5bdb;text-decoration:none">허브</a>';
  }catch(e){}
  function ok(n){ return TABS.some(function(t){ return t[0] === n; }); }
  function paint(){
    document.getElementById('tl-tabs').innerHTML = TABS.map(function(t){
      return '<button type="button" class="tl-tab' + (t[0] === CUR ? ' on' : '') + '" onclick="sdToolGo(' + t[0] + ')">' + t[1] + '</button>';
    }).join('');
    var t = TABS.filter(function(x){ return x[0] === CUR; })[0];
    document.title = (t ? t[1].replace(/^\S+\s/, '') + ' · ' : '') + '도구 - SJRWS';
  }
  //  도구 화면 안에서 탭이 바뀌면(전체 도구 카드를 누른 경우 등) 여기도 따라 바꾼다
  window.sdToolTab = function(n){
    if(!ok(n)) return;
    CUR = n; paint();
    try{ localStorage.setItem(LKEY, String(n)); }catch(e){}
    try{ history.replaceState(null, '', location.pathname + '?tab=' + n); }catch(e){}
  };
  window.sdToolGo = function(n){
    if(!ok(n)) return;
    var w = null; try{ w = fr.contentWindow; }catch(e){}
    if(w && typeof w.sw === 'function' && w.document && w.document.getElementById('tc' + n)){ w.sw(n); window.sdToolTab(n); try{ w.scrollTo(0, 0); }catch(e){} return; }
    window.sdToolTab(n);
    ld.style.display = 'flex';
    fr.src = 'sd_data.html?mode=tool&tab=' + n;
  };
  var q = 0; try{ q = parseInt(new URLSearchParams(location.search).get('tab'), 10); }catch(e){}
  if(!ok(q)){ try{ q = parseInt(localStorage.getItem(LKEY), 10); }catch(e){} }
  if(!ok(q)) q = 20;
  CUR = q; paint(); window.sdToolTab(q);
  fr.addEventListener('load', function(){ setTimeout(function(){ ld.style.display = 'none'; }, 300); });
  fr.src = 'sd_data.html?mode=tool&tab=' + q;
})();
</script>
