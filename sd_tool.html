       그래서 코드를 두 벌 두지 않고, 아래 칸에 데이터관리를 「도구 모드」(sd_data.html?mode=tool&tab=N)로 띄운다.
       도구 모드에서는 데이터관리의 머리줄·메뉴가 숨고 도구 화면만 보인다.
     · 🧮 부동산 계산기(tab=calc)는 데이터관리를 띄우지 않고 이 파일 안에서 바로 그린다 (아래 sdCalc 모듈)
       sd_tool.html?tab=calc&c=acq|cgt|hold|fee|yield|loan|conv|etc
     · 주소: sd_tool.html?tab=26 처럼 바로 열 수 있다. 마지막에 본 도구는 이 컴퓨터가 기억한다.
     · 도구 안에서 데이터관리 화면(예: S실거래가)으로 가는 단추는 바깥 창을 데이터관리로 옮긴다.
     ═════════════════════════════════════════════════════════════════ -->
<style>
:root{--ui-scale:1;--bg:#f7f8fa;--card:#fff;--text:#1a202c;--text3:#718096;--border:#d4dae3;--accent:#0e7490}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
body{display:flex;flex-direction:column;min-height:100vh}
.tl-hd{background:var(--card);border-bottom:1px solid var(--border)}
.tl-hd-in{max-width:2560px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tl-logo{font-size:18px;font-weight:800;color:#364fc7;display:flex;align-items:baseline;gap:7px}
.tl-logo span{font-size:11px;font-weight:600;color:var(--text3)}
.tl-me{margin-left:auto;font-size:11.5px;color:var(--text3);display:flex;gap:8px;align-items:center}
.tl-me b{color:var(--text)}
.tl-me .rl{padding:1px 7px;border-radius:8px;background:#fff3bf;color:#a06800;font-size:10px;font-weight:700}
.tl-logo small{font-size:10px;font-weight:400;color:var(--text3)}
.tl-tabs{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.tl-tabs-in{max-width:2560px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tl-tab{padding:11px 16px;border:none;border-bottom:3px solid transparent;background:none;font-size:13.5px;font-weight:600;color:#4a5568;cursor:pointer;white-space:nowrap;font-family:inherit}
.tl-tab:hover{color:#364fc7}
.tl-tab.on{color:#364fc7;border-bottom-color:#4c6ef5}
.tl-wrap{flex:1 1 auto;position:relative;min-height:0}
#calc-wrap{flex:1 1 auto;min-height:0;overflow:auto;display:none;scrollbar-gutter:stable both-edges}
body.calc-on .tl-wrap{display:none}
body.calc-on #calc-wrap{display:block}
#tool-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#tl-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--text3);font-size:13px;background:var(--bg);z-index:2}
#tl-load .sp{width:30px;height:30px;border:3px solid #dbe4ff;border-top-color:#4c6ef5;border-radius:50%;animation:tlsp .8s linear infinite}
@keyframes tlsp{to{transform:rotate(360deg)}}
@media(max-width:700px){ .tl-hd-in,.tl-tabs-in{padding-left:12px;padding-right:12px} .tl-tab{padding:10px 11px;font-size:12.5px} }
</style>
<!-- ═════════════════════════════════════════════════════════════════
     SJRWS 공통 머리줄 · 프로그램 단추 (sjb)  2026-10-03 — 11개 화면에 똑같이 들어간다
     · 머리줄: 「아이콘 프로그램명 (영문) · SJRWS 송도제일부동산업무시스템 · SongdoJeil Realestate Work System」
       프로그램명은 허브·매물·고객·계약·현장·일정·마케팅·블로그·상가·데이터·도구 (「관리 시스템」·기능 설명 없음)
     · 🎬 촬영모드 단추는 머리줄 맨 오른쪽 — 화면 오른쪽 위에 떠 있는 사용자 막대(#_sda_b)와 겹치지 않게
       그 막대 폭만큼 비켜 선다(.sjb-reserve)
     · 프로그램 단추(.sjb-btn): 왼쪽(허브)부터 오른쪽(도구)까지 색상(--h)이 조금씩 바뀌고,
       몇 초마다 빛이 왼쪽에서 오른쪽으로 훑고 지나간다(--i 순서만큼 늦게). 지금 화면 단추는 진하게
     · 움직임 줄이기(prefers-reduced-motion)·인쇄에서는 빛 효과를 끈다
     · 공통 띠(2026-10-03 ③): 머리줄(.sjb-top>.sjb-band.sjb-head)·프로그램 단추 줄(.sjb-navbar>.sjb-band.sjb-nav)·
       본문(.sjb-band)이 모두 같은 띠 — 최대 2560px 가운데, 좌우 여백 20px. 화면을 옮겨도 제목·단추 자리가 같다.
       머리줄 높이 58px·단추 줄 44px 고정, 스크롤바 자리는 늘 비워 둔다(scrollbar-gutter) — 옆으로 밀리지 않게
       띠 폭을 바꾸려면 아래 2560 을 모두 같은 숫자로
     · 배율: 화면마다 본문 배율(--ui-scale — 🔍 100/115/130%, 허브는 글자 크기 설정)이 달라도 머리줄·단추 줄은
       공통 배율(--sjb-scale = 🔍 설정 sd_ui_scale, 기본 115%)로 맞춘다 → --sjb-k = 공통 배율 ÷ 이 화면 배율
       (본문 띠도 같은 비율로 폭·여백을 맞춰 왼쪽 선이 머리줄과 같다)
     · 입력·글쓰기 탭(등록·작성 화면)은 화면마다 따로 둔 <style id="sjb-form"> 에서 1600px 에 멈춘다(왼쪽 정렬)
     · 이 블록을 고칠 때는 11개 파일을 함께 고칠 것 (sd_hub·props·custs·contracts·field·schedule·marketing·blog·sangga·data·tool)
     ═════════════════════════════════════════════════════════════════ -->
<style id="sjb-style">

.sjb-top{background:#fff!important;border-bottom:1px solid #e3e7ee!important;padding-left:0!important;padding-right:0!important;margin:0!important;flex:0 0 auto}

.sjb-tabbar{padding-left:0!important;padding-right:0!important}

.hdr-right button,.sjb-r button{white-space:nowrap}

<script>
(function(){
  'use strict';
  var SD_VER = '2026.10.04-1';
  var TABS = [
    [20, '🧰 전체 도구'],
    ['calc', '🧮 부동산 계산기'],
    ['video', '🎬 영상 만들기'],
    [26, '🤝 직방 가격 제안'],
    [27, '🔎 공시가격 조회'],
    [24, '🏗️ 건축물대장'],
    [25, '🔑 추출기 열쇠']
  ];
  var LKEY = 'sd_tool_tab', CUR = 0, FRAME_N = 0;
  var fr = document.getElementById('tool-frame'), ld = document.getElementById('tl-load');
  var ver = document.getElementById('tl-ver'); if(ver) ver.textContent = 'v' + SD_VER;
  window.SD_VERSION = SD_VER;
  //  로그인한 사람 — 데이터관리와 같은 기록(sd_auth_session)을 읽는다. 로그아웃은 허브에서
  try{
    var se = JSON.parse(localStorage.getItem('sd_auth_session') || '{}') || {}, me = document.getElementById('tl-me');
    var RL = { master:'마스터', admin:'관리자', staff:'직원', user:'직원' };
    if(me && se.name) me.innerHTML = '<b>' + String(se.name).replace(/[<>&"]/g, '') + '</b>' + (se.role ? '<span class="rl">' + (RL[se.role] || String(se.role).replace(/[<>&"]/g, '')) + '</span>' : '') + '<a href="sd_hub.html" style="color:#3b5bdb;text-decoration:none">허브</a>';
  }catch(e){}
  //  탭 열쇠: 숫자(데이터관리 도구 모드 탭) 또는 'calc'(이 파일 안의 부동산 계산기)
  function key(n){ if(n === 'calc' || n === 'video') return n; var k = parseInt(n, 10); return isNaN(k) ? null : k; }
  function ok(n){ n = key(n); return TABS.some(function(t){ return t[0] === n; }); }
  function paint(){
    document.getElementById('tl-tabs').innerHTML = TABS.map(function(t){
      return '<button type="button" class="tl-tab' + (t[0] === CUR ? ' on' : '') + '" data-tab="' + t[0] + '" onclick="sdToolGo(\'' + t[0] + '\')">' + t[1] + '</button>';
    }).join('');
    var t = TABS.filter(function(x){ return x[0] === CUR; })[0];
    document.title = (t ? t[1].replace(/^\S+\s/, '') + ' · ' : '') + '도구 (tool) - SJRWS';
    document.body.classList.toggle('calc-on', CUR === 'calc');
  }
  //  도구 화면 안에서 탭이 바뀌면(전체 도구 카드를 누른 경우 등) 여기도 따라 바꾼다
  window.sdToolTab = function(n, extra){
    if(!ok(n)) return;
    CUR = key(n); paint();
    try{ localStorage.setItem(LKEY, String(CUR)); }catch(e){}
    try{ history.replaceState(null, '', location.pathname + '?tab=' + CUR + (extra || '')); }catch(e){}
  };
  //  🎬 영상 만들기는 따로 만든 화면(sd_video.html)을 같은 칸에 띄운다 (embed=1 → 머리줄·단추 줄 숨김)
  function loadFrame(n){ FRAME_N = n; ld.style.display = 'flex'; fr.src = n === 'video' ? 'sd_video.html?embed=1' : 'sd_data.html?mode=tool&tab=' + n; }
  window.sdToolGo = function(n, c){
    if(!ok(n)) return;
    n = key(n);
    if(n === 'calc'){
      window.sdToolTab('calc');
      if(window.sdCalc) window.sdCalc.go(c || (function(){ try{ return localStorage.getItem('sd_calc_last') || 'home'; }catch(e){ return 'home'; } })());
      return;
    }
    if(n === 'video'){ window.sdToolTab('video'); if(FRAME_N !== 'video') loadFrame('video'); return; }
    var w = null; try{ w = fr.contentWindow; }catch(e){}
    if(FRAME_N && w && typeof w.sw === 'function' && w.document && w.document.getElementById('tc' + n)){ window.sdToolTab(n); w.sw(n); try{ w.scrollTo(0, 0); }catch(e){} return; }
    window.sdToolTab(n);
    loadFrame(n);
  };
  fr.addEventListener('load', function(){ setTimeout(function(){ ld.style.display = 'none'; }, 300); });
  var sp = new URLSearchParams(location.search), q = key(sp.get('tab'));
  if(!ok(q)){ try{ q = key(localStorage.getItem(LKEY)); }catch(e){} }
  if(!ok(q)) q = 20;
  CUR = q; paint();
  //  계산기는 아래 모듈이 다 읽힌 뒤에 그린다. 데이터관리(무거움)는 숫자 탭을 처음 열 때만 띄운다
  window.__sdToolStart = function(){
    if(q === 'calc'){ var c = sp.get('c'); window.sdToolTab('calc', c ? '&c=' + encodeURIComponent(c) : ''); window.sdCalc && window.sdCalc.go(c || 'home', true); }
    else { window.sdToolTab(q); loadFrame(q); }
  };
})();

  var STD = '2026.08 세법·대출규제 기준';

  // ── 숫자 ──────────────────────────────────────────────
  function N(v){ var n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; }
  function won(n){ n = Math.round(n || 0); return (n < 0 ? '-' : '') + Math.abs(n).toLocaleString() + '원'; }
  function kor(n){                 // 523000000 → 「5억 2,300만원」
    n = Math.round(n || 0); var s = n < 0 ? '-' : ''; n = Math.abs(n);
    var e = Math.floor(n / 1e8), m = Math.floor((n % 1e8) / 1e4), r = n % 1e4;
    var t = (e ? e + '억' : '') + (m ? (e ? ' ' : '') + m.toLocaleString() + '만' : '');
    if(!t) t = r.toLocaleString(); return s + t + '원';
  }
  function pct(x, d){ return (Math.round(x * Math.pow(10, d == null ? 2 : d)) / Math.pow(10, d == null ? 2 : d)).toLocaleString(undefined, { maximumFractionDigits: d == null ? 2 : d }) + '%'; }
  function cut10(x){ return Math.floor(x / 10) * 10; }        // 지방세 10원 미만 절사
  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function $(id){ return document.getElementById(id); }

  function seg(id, label, opts, def, hint){

      + opts.map(function(o){ return '<button type="button" data-v="' + o[0] + '" class="' + (String(o[0]) === String(def) ? 'on' : '') + '" onclick="sdCalc.seg(this)">' + o[1] + '</button>'; }).join('') + '</div></div>';

  function V(id){
    var e = $(id); if(!e) return null;

  // ① 취득세

  function acqRate(P){ if(P <= 6e8) return 1; if(P <= 9e8) return Math.round((P * 2 / 3e8 - 3) * 100) / 100; return 3; }
  function inji(P){ if(P <= 1e8) return 0; if(P <= 1e9) return 150000; return 350000; }   // 주택 매매 계약서 인지세(1억 이하 비과세)
  function acqCalc(o){
    // o: P, cause(buy|gift|inherit), kind(house|non), n, adj, corp, big85, temp2, low, relief
    var r, edu, rural, heavy = 0, why = [];
    if(o.kind === 'non'){ r = 4; edu = 0.4; rural = 0.2; why.push('주택 외 유상취득 4%'); }
    else if(o.cause === 'inherit'){ r = 2.8; edu = 0.16; rural = o.big85 ? 0.2 : 0; why.push('상속 2.8%'); }
    else if(o.cause === 'gift'){
      if(o.adj && o.P >= 3e8 && !o.low){ r = 12; edu = 0.4; rural = o.big85 ? 1.0 : 0; heavy = 12; why.push('조정대상지역 3억 이상 증여 중과 12%'); }
      else { r = 3.5; edu = 0.3; rural = o.big85 ? 0.2 : 0; why.push('증여 3.5%'); }
    } else if(o.corp){ r = 12; edu = 0.4; rural = o.big85 ? 1.0 : 0; heavy = 12; why.push('법인 주택 취득 12%'); }
    else {
      if(!o.low){
        if(o.n === 2 && o.adj && !o.temp2) heavy = 8;
        else if(o.n === 3) heavy = o.adj ? 12 : 8;
        else if(o.n >= 4) heavy = 12;
      }
      if(heavy){ r = heavy; edu = 0.4; rural = o.big85 ? (heavy === 8 ? 0.6 : 1.0) : 0; why.push(o.n + '주택' + (o.adj ? '(조정)' : '(비조정)') + ' 중과 ' + heavy + '%'); }
      else { r = acqRate(o.P); edu = Math.round(r * 0.1 * 10000) / 10000; rural = o.big85 ? 0.2 : 0; why.push('가격 기준 일반세율 ' + r + '%' + (o.n === 2 && o.adj && o.temp2 ? ' (일시적 2주택)' : '')); }
    }
    var tax = cut10(o.P * r / 100), et = cut10(o.P * edu / 100), rt = cut10(o.P * rural / 100), rel = 0;
    if(o.relief && o.relief !== 'none' && o.kind === 'house' && o.cause === 'buy' && !o.corp && !heavy && o.n === 1 && o.P <= 12e8){
      var cap = o.relief === 'first' ? 2e6 : o.relief === 'small' ? 3e6 : 5e6;
      rel = Math.min(tax, cap);
    }
    return { r:r, edu:edu, rural:rural, heavy:heavy, tax:tax, et:et, rt:rt, rel:rel, sum:tax - rel + et + rt, why:why };
  }
  var ACQ = {
    id:'acq', ic:'취', name:'취득세', desc:'매매·증여·상속 취득세, 자금계획까지',

        + seg('a-rel', '감면 대상', [['none','해당 없음'],['first','생애최초'],['small','생애최초(소형·인구감소)'],['birth','출산가구']], 'none', '(12억 이하 · 1주택)');

      var res = out({
        label:'총 납부세액', big:won(c.sum), sub:kor(c.sum) + ' · 실효세율 <b>' + pct(P ? c.sum / P * 100 : 0) + '</b>',

              ['지방교육세 <small>' + c.edu + '%</small>', won(c.et)], ['농어촌특별세 <small>' + c.rural + '%</small>', won(c.rt)], ['합계', won(c.sum), 'tot']],
        chips:c.why.concat([o.big85 ? '85㎡ 초과' : '85㎡ 이하 농특세 비과세']),
        note:'취득시기는 <b>잔금일</b>(그 전 등기 시 등기일). 신고·납부는 취득일부터 <b>60일 이내</b>(상속은 6개월). 발코니 확장·유상옵션이 과세표준에 들어가면 6억·9억 구간이 바뀔 수 있습니다. 생애최초 등 감면 시 지방교육세·농특세 처리는 신고 때 확인하세요.'
      });
      // 자금 계획

        + rows([['매매가', won(P)], ['취득세 합계', won(c.sum)], ['중개보수 (VAT 포함, 상한)', won(fee)],
               ['법무·등기 <small>(인지세 ' + kor(inji(P)) + ' + 어림 50만 — 고치세요)</small>', '<input class="cx-in sm" id="a-reg" data-money="1" data-auto="' + (pe ? pe.getAttribute('data-auto') : '1') + '" style="width:120px;display:inline-block" value="' + Math.round(reg).toLocaleString() + '" oninput="this.setAttribute(\'data-auto\',\'0\');sdCalc.fmt(this)">'],
               ['총 필요자금', won(need) + '<div style="font-size:11px;color:var(--text3);font-weight:400">' + kor(need) + '</div>', 'tot']])
        + '<div style="background:#f8f9fa;border-radius:10px;padding:10px 12px;margin-top:8px">'
        + '<div class="cx-f" style="margin:0"><label>대출 비율 (LTV) <em id="a-ltv-v">' + ltv + '%</em></label><input class="cx-rg" type="range" id="a-ltv" min="0" max="80" step="5" value="' + ltv + '" data-unit="%" oninput="sdCalc.run()"></div>'
        + (ltv ? rows([['대출금', won(loan)], ['필요 자기자금', won(need - loan), 'tot']]) : '') + '</div>'
        + '<details class="cx-dt"><summary>주택 취득세율표 보기</summary><table class="cx-tbl"><tr><th>구분</th><th class="n">취득세</th><th class="n">지방교육세</th><th class="n">농특세(85㎡↑)</th></tr>'

        + '<tr><td>9억 초과</td><td class="n">3%</td><td class="n">0.3%</td><td class="n">0.2%</td></tr><tr><td>2주택 조정 · 3주택 비조정</td><td class="n">8%</td><td class="n">0.4%</td><td class="n">0.6%</td></tr>'
        + '<tr><td>3주택 조정 · 4주택+ · 법인</td><td class="n">12%</td><td class="n">0.4%</td><td class="n">1.0%</td></tr><tr><td>증여 (조정 3억↑ 12%)</td><td class="n">3.5%</td><td class="n">0.3%</td><td class="n">0.2%</td></tr>'
        + '<tr><td>상속</td><td class="n">2.8%</td><td class="n">0.16%</td><td class="n">0.2%</td></tr><tr><td>주택 외(상가·오피스텔·토지)</td><td class="n">4%</td><td class="n">0.4%</td><td class="n">0.2%</td></tr></table>'
        + '<div class="cx-note">지방세법 제11조·제13조의2·제151조, 농특세법 — 2026-08 확인. 2022년 발표된 중과 완화는 입법되지 않아 현행 그대로입니다.</div></details>';
      LAST = { title:'취득세 — ' + kor(P) + ' ' + ({ buy:'매매', gift:'증여', inherit:'상속' })[o.cause] + ' · ' + (o.kind === 'house' ? o.n + '주택' : '주택 외'),
               lines:['총 납부세액 ' + won(c.sum) + ' (실효 ' + pct(P ? c.sum / P * 100 : 0) + ')', '· 취득세 ' + won(c.tax - c.rel) + (c.rel ? ' (감면 ' + won(c.rel) + ' 반영)' : ''), '· 지방교육세 ' + won(c.et), '· 농어촌특별세 ' + won(c.rt), '총 필요자금(중개보수·등기 포함) ' + kor(need)] };
      return { res:res, plan:plan };
    }
  };

  // ═════════════════════════════════════════════════════
  // ② 양도소득세 — 양도일 기준 · 현행법 / 9.3 국회 제출 개편안 / 둘 다 비교
  // ═════════════════════════════════════════════════════
  //  양도일(잔금일)을 넣으면 그날 적용될 세법으로 계산한다.
  //   · 현행법: 조정대상지역 다주택 중과는 2026-05-10 양도분부터 (+20%p·+30%p, 장특 배제) — 그 전 양도는 중과 유예
  //   · 개편안 = 2026-09-03 국회 제출 정부안 (8-03 기재부 발표안 기준, 양도세 항목은 제출안에서 바뀐 것 없음 — 2027-01-01 이후 양도분):
  //     - 주택 장기보유특별공제 → 「장기거주 소득공제」로 재편 (보유보다 거주 중심)
  //     - 1세대1주택 장기보유특별공제 거주 중심 개편 — 2027 현행 유지 / 2028 보유 연2%(최대20%)+거주 연6%(최대60%) / 2029~ 거주 연8%(최대80%)만
  //     - 조정대상지역 다주택 중과 한시 완화 — 2주택 +20%p → 2027 +5 · 2028 +10 · 2029~ +20(복귀) / 3주택+ +30%p → +10 · +15 · +30
  //       (중과 대상의 장기보유특별공제 배제는 그대로 둔다고 가정)
  //     - 1세대1주택 기본공제 250만 → 2,500만원 (10년 이상 거주 + 양도가액 30억 이하)
  //     - 주택 장특 「공제액」 한도 신설(9-03 제출안 원안 유지) — 2027 없음 / 2028 20억 / 2029~ 10억

<script>
(function(){
  'use strict';
  if(window.__sjbOn) return; window.__sjbOn = true;
  //  화면 오른쪽 위에 떠 있는 사용자 막대(#_sda_b — 이름·허브·로그아웃)와 겹치는 머리줄은 그 폭만큼 비켜 선다
  function fit(){
    var bar = document.getElementById('_sda_b'), root = document.documentElement;
    var rs = document.querySelectorAll('.sjb-reserve');
    if(!bar || getComputedStyle(bar).display === 'none'){ Array.prototype.forEach.call(rs, function(e){ e.classList.remove('sjb-under'); }); return; }
    var b = bar.getBoundingClientRect();
    root.style.setProperty('--sjb-barw', Math.ceil(b.width) + 'px');
    Array.prototype.forEach.call(rs, function(e){
      var r = e.getBoundingClientRect();
      //  막대가 이 줄 위쪽에 걸치면 비킨다 (스크롤해서 내려간 뒤에도 처음 자리 기준)
      var top = r.top + (window.scrollY || 0);
      //  위아래로 걸치고, 좌우로도 걸칠 때만 (5120 넓은 화면에서 가운데 띠는 막대와 안 겹친다)
      e.classList.toggle('sjb-under', top < b.bottom + 2 && b.left < r.right - 4);
    });
  }
  //  공통 배율 = 🔍 화면 배율 설정(sd_ui_scale, 기본 115%) — 화면마다 본문 배율이 달라도 머리줄은 이 배율
  function scale(){
    var v = 1.15; try{ var x = parseFloat(localStorage.getItem('sd_ui_scale')); if([1, 1.15, 1.3].indexOf(x) >= 0) v = x; }catch(e){}
    if(document.documentElement.style.getPropertyValue('--sjb-scale') !== String(v)) document.documentElement.style.setProperty('--sjb-scale', String(v));
  }
  scale();
  try{ new MutationObserver(function(){ scale(); setTimeout(fit, 50); }).observe(document.documentElement, { attributes:true, attributeFilter:['style'] }); }catch(e){}
  window.addEventListener('storage', function(e){ if(e.key === 'sd_ui_scale'){ scale(); fit(); } });
  var n = 0;
  (function t(){ fit(); if(n++ < 40) setTimeout(t, 500); })();
  window.addEventListener('resize', fit);
  try{ new MutationObserver(function(){ fit(); }).observe(document.body, { childList:true }); }catch(e){}
  window.sdBrand = { fit:fit, scale:scale };
})();

<!-- ═══════════════════════════════════════════════════════
     버전 표시 모듈 (도구용)  v1.0  (2026-10-02)
     - 다른 화면처럼 왼쪽 아래에 이 파일의 버전을 작게 띄운다 (머리줄 제목 옆에도 표시)
     - 도구는 Firebase 를 싣지 않으므로, 눌렀을 때 전체 프로그램 버전은 서버의 version.json 에서 읽는다
     - version.json 의 sd_tool.html 이 지금 열린 버전보다 높으면 ⚠ 빨간색 + 「새로고침」 단추
     ═══════════════════════════════════════════════════════ -->
<script>
(function(){
  'use strict';
  if(document.getElementById('sd-ver-badge')) return;
  var FILE = 'sd_tool.html', NAME = '도구';
  var NAMES = { 'sd_hub.html':'허브', 'sd_props.html':'매물관리', 'sd_custs.html':'고객관리', 'sd_contracts.html':'계약관리', 'sd_schedule.html':'일정관리',
    'sd_field.html':'현장업무실', 'sd_marketing.html':'마케팅', 'sd_blog.html':'블로그 스튜디오', 'sd_sangga.html':'상가관리', 'sd_data.html':'실거래가', 'sd_tool.html':'도구', 'sd_video.html':'영상 만들기' };
  var SRV = null;
  function mine(){ return window.SD_VERSION || ''; }
  function esc(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function verKey(v){ var m = String(v || '').match(/(\d{4})\.(\d{2})\.(\d{2})-(\d+)/); return m ? (m[1] + m[2] + m[3] + String(m[4]).padStart(3, '0')) : '0'; }
  var st = document.createElement('style'); st.id = 'sd-ver-css';
  st.textContent = '#sd-ver-badge{position:fixed;left:10px;bottom:8px;z-index:9000;background:rgba(26,39,68,.62);color:#fff;border:none;border-radius:8px;padding:3px 8px;'
    + 'font-size:10px;letter-spacing:.2px;cursor:pointer;opacity:.45;transition:opacity .15s;font-family:inherit;line-height:1.3;white-space:nowrap}'
    + '#sd-ver-badge:hover,#sd-ver-badge.old{opacity:1}#sd-ver-badge.old{background:rgba(198,40,40,.85)}'
    + '#sd-ver-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10090;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}'
    + '#sd-ver-ov .vbox{background:#fff;border-radius:14px;max-width:460px;width:100%;margin:auto;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.25)}'
    + '#sd-ver-ov table{width:100%;border-collapse:collapse;font-size:12.5px}#sd-ver-ov td{padding:7px 6px;border-bottom:.5px solid #f0f0f0}'
    + '#tl-ver{color:#868e96!important;font-weight:600!important;margin-left:2px}'
    + '@media(max-width:560px){#sd-ver-badge{left:6px;bottom:6px}}@media print{#sd-ver-badge{display:none}}';
  document.head.appendChild(st);
  var b = document.createElement('button'); b.id = 'sd-ver-badge'; b.type = 'button';
  b.textContent = 'v' + mine(); b.title = NAME + ' · ' + FILE + '\n전체 프로그램 버전 보기';
  b.onclick = function(e){ e.stopPropagation(); open(); };
  document.body.appendChild(b);
  function paint(){
    var s = SRV && SRV[FILE];
    if(s && verKey(s) > verKey(mine())){
      b.textContent = 'v' + mine() + ' ⚠'; b.classList.add('old');
      b.title = NAME + ' · 서버에 새 버전 v' + s + ' 이 있습니다 — 눌러서 새로고침';
    }
  }
  function load(cb){
    fetch('version.json?t=' + Date.now(), { cache:'no-store' }).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ SRV = j || {}; paint(); if(cb) cb(); }, function(){ SRV = SRV || {}; if(cb) cb(); });
  }
  function open(){
    var old = document.getElementById('sd-ver-ov'); if(old) old.remove();
    var ov = document.createElement('div'); ov.id = 'sd-ver-ov';
    ov.onclick = function(e){ if(e.target === ov) ov.remove(); };
    var draw = function(){
      var keys = Object.keys(NAMES), newer = SRV && SRV[FILE] && verKey(SRV[FILE]) > verKey(mine());
      var rows = keys.map(function(f){
        var v = SRV && SRV[f], me = f === FILE;
        return '<tr><td>' + esc(NAMES[f]) + (me ? ' <span style="font-size:10px;color:#1565c0">◀ 지금 화면</span>' : '') + '<div style="font-size:10px;color:#bbb">' + esc(f) + '</div></td>'
          + '<td style="text-align:right;white-space:nowrap;color:' + (v ? '#2e7d32' : '#bbb') + '">' + (v ? 'v' + esc(v) : '확인 안 됨')
          + (me ? '<div style="font-size:10px;color:' + (newer ? '#c62828' : '#868e96') + '">열린 버전 v' + esc(mine()) + (newer ? ' — 옛 버전' : '') + '</div>' : '') + '</td></tr>';
      }).join('');
      ov.innerHTML = '<div class="vbox"><div style="background:#1a2744;color:#fff;padding:13px 18px;display:flex;justify-content:space-between;align-items:center">'
        + '<span style="font-size:14px;font-weight:700">🏷️ 프로그램 버전</span><button type="button" id="sd-ver-x" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer">✕ 닫기</button></div>'
        + '<div style="padding:10px 16px 4px;font-size:11.5px;color:#868e96">서버(GitHub)에 올라가 있는 버전 — version.json 기준</div>'
        + '<div style="padding:0 12px 6px">' + (SRV && Object.keys(SRV).length ? '<table>' + rows + '</table>' : '<div style="padding:16px;color:#868e96;font-size:12.5px">version.json 을 읽지 못했습니다 (오프라인이거나 아직 올리지 않음). 이 화면 버전: v' + esc(mine()) + '</div>') + '</div>'
        + '<div style="padding:10px 16px 14px;display:flex;gap:8px;justify-content:flex-end">'
        + (newer ? '<span style="flex:1;font-size:11.5px;color:#c62828;align-self:center">새 버전 v' + esc(SRV[FILE]) + ' 이 있습니다.</span>' : '')
        + '<button type="button" id="sd-ver-re" style="background:#1565c0;color:#fff;border:0;border-radius:8px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer">🔄 새로고침 (최신으로)</button></div></div>';
      document.getElementById('sd-ver-x').onclick = function(){ ov.remove(); };
      document.getElementById('sd-ver-re').onclick = function(){
        var p = new URLSearchParams(location.search); p.set('_v', (SRV && SRV[FILE]) || Date.now());
        var url = location.pathname.replace(/^.*\//, '') + '?' + p.toString() + location.hash, gone = false, nav = function(){ if(!gone){ gone = true; location.replace(url); } };
        fetch(location.pathname, { cache:'reload' }).then(nav, nav); setTimeout(nav, 2500);
      };
    };
    document.body.appendChild(ov);
    ov.innerHTML = '<div class="vbox" style="padding:24px;text-align:center;color:#868e96;font-size:13px">버전 확인 중…</div>';
    load(draw);
  }
  //  ?_v= 로 다시 열렸으면 주소를 깨끗이
  try{ var q = new URLSearchParams(location.search); if(q.has('_v')){ q.delete('_v'); history.replaceState(history.state, '', location.pathname.replace(/^.*\//, '') + (q.toString() ? '?' + q.toString() : '') + location.hash); } }catch(e){}
  load();
  window.sdVerPanel = open;
})();
</script>
</body>
</html>
