<style>
:root{--ui-scale:1;--bg:#f7f8fa;--card:#fff;--text:#1a202c;--text3:#718096;--border:#d4dae3;--accent:#0e7490}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
body{display:flex;flex-direction:column;min-height:100vh}
.tl-hd{background:var(--card);border-bottom:1px solid var(--border)}
.tl-hd-in{max-width:2560px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tl-logo{font-size:18px;font-weight:800;color:#364fc7;display:flex;align-items:baseline;gap:7px}
.tl-logo span{font-size:11px;font-weight:600;color:var(--text3)}
.tl-me{margin-left:auto;font-size:11.5px;color:var(--text3);display:flex;gap:8px;align-items:center}
.tl-me b{color:var(--text)}
.tl-me .rl{padding:1px 7px;border-radius:8px;background:#fff3bf;color:#a06800;font-size:10px;font-weight:700}
.tl-logo small{font-size:10px;font-weight:400;color:var(--text3)}
.tl-tabs{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.tl-tabs-in{max-width:2560px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tl-tab{padding:11px 16px;border:none;border-bottom:3px solid transparent;background:none;font-size:13.5px;font-weight:600;color:#4a5568;cursor:pointer;white-space:nowrap;font-family:inherit}
.tl-tab:hover{color:#364fc7}
.tl-tab.on{color:#364fc7;border-bottom-color:#4c6ef5}
.tl-wrap{flex:1 1 auto;position:relative;min-height:0}
#calc-wrap{flex:1 1 auto;min-height:0;overflow:auto;display:none;scrollbar-gutter:stable both-edges}
body.calc-on .tl-wrap{display:none}
body.calc-on #calc-wrap{display:block}
#tool-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#tl-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--text3);font-size:13px;background:var(--bg);z-index:2}
#tl-load .sp{width:30px;height:30px;border:3px solid #dbe4ff;border-top-color:#4c6ef5;border-radius:50%;animation:tlsp .8s linear infinite}
@keyframes tlsp{to{transform:rotate(360deg)}}
@media(max-width:700px){ .tl-hd-in,.tl-tabs-in{padding-left:12px;padding-right:12px} .tl-tab{padding:10px 11px;font-size:12.5px} }
</style>

     SJRWS 공통 머리줄 · 프로그램 단추 (sjb)  2026-10-03 — 12개 화면에 똑같이 들어간다
     · 머리줄: 「아이콘 프로그램명 (영문) · SJRWS 송도제일부동산업무시스템 · SongdoJeil Realestate Work System」

     · 🎬 촬영모드 단추는 머리줄 맨 오른쪽 — 화면 오른쪽 위에 떠 있는 사용자 막대(#_sda_b)와 겹치지 않게
       그 막대 폭만큼 비켜 선다(.sjb-reserve)
     · 프로그램 단추(.sjb-btn): 왼쪽(허브)부터 오른쪽(도구)까지 색상(--h)이 조금씩 바뀌고,
       몇 초마다 빛이 왼쪽에서 오른쪽으로 훑고 지나간다(--i 순서만큼 늦게). 지금 화면 단추는 진하게

     · 공통 띠(2026-10-03 ③): 머리줄(.sjb-top>.sjb-band.sjb-head)·프로그램 단추 줄(.sjb-navbar>.sjb-band.sjb-nav)·
       본문(.sjb-band)이 모두 같은 띠 — 최대 2560px 가운데, 좌우 여백 20px. 화면을 옮겨도 제목·단추 자리가 같다.
       머리줄 높이 58px·단추 줄 44px 고정, 스크롤바 자리는 늘 비워 둔다(scrollbar-gutter) — 옆으로 밀리지 않게
       띠 폭을 바꾸려면 아래 2560 을 모두 같은 숫자로

       공통 배율(--sjb-scale = 🔍 설정 sd_ui_scale, 기본 115%)로 맞춘다 → --sjb-k = 공통 배율 ÷ 이 화면 배율
       (본문 띠도 같은 비율로 폭·여백을 맞춰 왼쪽 선이 머리줄과 같다)
     · 입력·글쓰기 탭(등록·작성 화면)은 화면마다 따로 둔 <style id="sjb-form"> 에서 1600px 에 멈춘다(왼쪽 정렬)

/* ───────── 작업 저장 (IndexedDB) ───────── */
var DB = null;
function idb(){
  if(DB) return Promise.resolve(DB);
  return new Promise(function(res, rej){
    var r = indexedDB.open('sd_video', 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore('projects', { keyPath:'id' }); };
    r.onsuccess = function(){ DB = r.result; res(DB); };
    r.onerror = function(){ rej(r.error); };
  });
}
function idbDo(mode, fn){ return idb().then(function(db){ return new Promise(function(res, rej){ var tx = db.transaction('projects', mode), st = tx.objectStore('projects'), q = fn(st); tx.oncomplete = function(){ res(q && q.result); }; tx.onerror = function(){ rej(tx.error); }; }); }); }
function idbAll(){ return idbDo('readonly', function(s){ return s.getAll(); }).then(function(a){ return a || []; }); }
function idbPut(p){ return idbDo('readwrite', function(s){ return s.put(p); }); }
function idbDel(id){ return idbDo('readwrite', function(s){ return s.delete(id); }); }

var P = null, LIST = [], saveT = 0;
function newProject(){ return { id:'v' + uid(), title:'', src:'', fmt:'9:16', len:'short', scenes:[], step:'src', createdAt:Date.now(), updatedAt:Date.now() }; }
function touch(now){
  if(!P) return; P.updatedAt = Date.now(); clearTimeout(saveT);
  if(LSX.get('sdv.cur', '') !== P.id) LSX.set('sdv.cur', P.id);   // 다시 열면 이 작업부터
  var go = function(){ idbPut(P).then(refreshList, function(e){ toast('작업을 저장하지 못했습니다: ' + e.message, true); }); };
  if(now) go(); else saveT = setTimeout(go, 700);
}
function refreshList(){
  return idbAll().then(function(a){ LIST = a.sort(function(x, y){ return (y.updatedAt || 0) - (x.updatedAt || 0); }); paintList(); });
}

  if(!P) return false;
  if(k === 'src') return nchar(P.src) > 20;
  if(k === 'script') return P.scenes.length > 0;
  if(k === 'pics') return P.scenes.length > 0 && P.scenes.every(function(s){ return !!s.pic; });

function parseJSON(txt){
  var s = String(txt).trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
  try{ return JSON.parse(s); }catch(e){}
  var a = s.indexOf('{'), b = s.lastIndexOf('}');
  if(a >= 0 && b > a){ try{ return JSON.parse(s.slice(a, b + 1)); }catch(e){} }
  if(a >= 0){ var f = repairCutJSON(s.slice(a)); if(f){ try{ return JSON.parse(f); }catch(e){} } }
  throw new Error('AI 응답을 읽지 못했습니다. 한 번 더 눌러 주세요.');
}
function repairCutJSON(s){
  var st = [], inS = false, es = false, cut = -1, snap = null;
  for(var i = 0; i < s.length; i++){
    var ch = s[i];
    if(inS){ if(es) es = false; else if(ch === '\\') es = true; else if(ch === '"') inS = false; continue; }
    if(ch === '"') inS = true;
    else if(ch === '{' || ch === '[') st.push(ch);
    else if(ch === '}' || ch === ']'){ st.pop(); cut = i + 1; snap = st.slice(); if(!st.length) return s.slice(0, cut); }
  }
  if(cut < 0) return '';
  var body = s.slice(0, cut).replace(/,\s*$/, '');
  for(var j = snap.length - 1; j >= 0; j--) body += snap[j] === '{' ? '}' : ']';
  return body;
}
function hint(status, msg){
  msg = msg || '';
  if(status === 404 || /not found|no longer available|not supported/i.test(msg)) return '\n모델 이름을 구글이 받지 않습니다 — 블로그 스튜디오 [엔진 설정]에서 「사용 가능한 모델 불러오기」로 바꿔 주세요.';
  if(/credit|prepay|billing/i.test(msg)) return '\n구글 제미나이 크레딧이 떨어졌습니다 (ai.studio/projects 에서 결제 수단·크레딧 확인).';
  if(status === 429 || /quota|exceeded/i.test(msg)) return '\n잠시 요청이 몰렸습니다. 1~2분 뒤에 다시 해 주세요.';
  return '';
}
async function aiText(prompt){

  var s = settings(), keys = keysOf(e), last;
  for(var i = 0; i < keys.length; i++){
    try{

/* ───────── MP4 만들기 (WebCodecs + mp4-muxer) ───────── */
var MUXER_URL = 'https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.js';
function loadMuxer(){
  if(window.Mp4Muxer) return Promise.resolve(window.Mp4Muxer);
  return new Promise(function(res, rej){ var s = document.createElement('script'); s.src = MUXER_URL; s.onload = function(){ window.Mp4Muxer ? res(window.Mp4Muxer) : rej(new Error('영상 도구를 읽지 못했습니다')); }; s.onerror = function(){ rej(new Error('영상 도구(mp4-muxer)를 내려받지 못했습니다 — 인터넷 연결을 확인해 주세요')); }; document.head.appendChild(s); });
}
async function pickCodecs(W, H, total){

    try{ var r = await VideoEncoder.isConfigSupported(cfg); if(r.supported) v = { cfg:cfg, mux:vlist[i][1] }; }catch(e){}

    for(var j = 0; j < alist.length && !a; j++){

      try{ var r2 = await AudioEncoder.isConfigSupported(ac2); if(r2.supported) a = { cfg:ac2, mux:alist[j][1] }; }catch(e){}
    }
  }
  return { v:v, a:a };
}
var ENC = { busy:false, stop:false };
async function encode(){

  ENC.busy = true; ENC.stop = false; btn.disabled = true; OUT = null;

  try{

    var M = await loadMuxer(), cd = await pickCodecs(W, H, tl.total);
    if(document.fonts && document.fonts.load){ try{ await Promise.all(['900', '800', '700', '400'].map(function(w){ return document.fonts.load(w + ' 48px "Noto Sans KR"'); })); }catch(e){} }
    await loadImgs();
    bar(0.02, '소리 섞는 중…');
    var mix = await mixAudio(tl), err = null;
    /* 긴 영상도 메모리를 두 배로 쓰지 않게 — 조각(8MB)으로 받아 두었다가 마지막에 한 파일로 */

    /* 소리 — 화면과 번갈아 1초씩 넣는다 (파일 안에서 시간 순서대로 섞이게) */
    var aenc = null, SR = 48000, aPos = 0, L = mix.getChannelData(0), R = mix.numberOfChannels > 1 ? mix.getChannelData(1) : L, N = Math.min(L.length, Math.ceil(tl.total * SR));

    var audioTo = async function(sec){
      if(!aenc) return; var end = Math.min(N, Math.ceil(sec * SR));
      while(aPos < end){
        var n = Math.min(4800, end - aPos), data = new Float32Array(n * 2); data.set(L.subarray(aPos, aPos + n), 0); data.set(R.subarray(aPos, aPos + n), n);

    };

    var cv = document.createElement('canvas'); cv.width = W; cv.height = H; var cx = cv.getContext('2d', { alpha:false });
    var venc = new VideoEncoder({ output:function(ch, meta){ mux.addVideoChunk(ch, meta); }, error:function(e){ err = e; } });

      if(ENC.stop) throw new Error('중지했습니다');
      if(err) throw err;
      if(f % FPS === 0) await audioTo(f / FPS + 1);
      drawFrame(cx, f / FPS, W, H, tl);
      var vf = new VideoFrame(cv, { timestamp:Math.round(f * 1e6 / FPS), duration:Math.round(1e6 / FPS) });

        var el2 = (performance.now() - t0) / 1000, left = f ? el2 / f * (frames - f) : 0;
        bar(0.05 + 0.93 * f / frames, '화면 만드는 중 · ' + fmtT(f / FPS) + ' / ' + fmtT(tl.total) + (f > 30 ? ' · 남은 시간 약 ' + fmtT(left) : ''));

      }
    }

    out.innerHTML = '';
    render();

  }catch(e){
    out.innerHTML = '<div class="sv-err">' + esc(e.message || String(e)) + '</div>';

  var cur = pos;
  cov.forEach(function(c){ if(c[0] > cur) list.push({ pos:cur, d:d.slice(cur - pos, c[0] - pos) }); cur = Math.max(cur, c[1]); });

  var lines = [], start = 0, i = 0, lastSp = -1;

}
function drawRich(ctx, r, rng, x, y, size, color, ac, stroke, align){
  var s = r.t.slice(rng[0], rng[1]).replace(/^\s+|\s+$/g, ''), off = rng[0] + r.t.slice(rng[0], rng[1]).search(/\S|$/);

    if(stroke){ ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.16; ctx.strokeStyle = stroke; ctx.strokeText(run.t, cx, y); }

}

function thumbBlob(kind){

    LSX.set('sdbs.settings', s2); m.remove(); render(); toast('열쇠를 저장했습니다');
  };
}
$('#svKeyBtn').onclick = function(){ openKeys(); };

<script>
(function(){
  'use strict';
  if(window.__sjbOn) return; window.__sjbOn = true;
  //  화면 오른쪽 위에 떠 있는 사용자 막대(#_sda_b — 이름·허브·로그아웃)와 겹치는 머리줄은 그 폭만큼 비켜 선다
  function fit(){
    var bar = document.getElementById('_sda_b'), root = document.documentElement;
    var rs = document.querySelectorAll('.sjb-reserve');
    if(!bar || getComputedStyle(bar).display === 'none'){ Array.prototype.forEach.call(rs, function(e){ e.classList.remove('sjb-under'); }); return; }
    var b = bar.getBoundingClientRect();
    root.style.setProperty('--sjb-barw', Math.ceil(b.width) + 'px');
    Array.prototype.forEach.call(rs, function(e){
      var r = e.getBoundingClientRect();
      //  막대가 이 줄 위쪽에 걸치면 비킨다 (스크롤해서 내려간 뒤에도 처음 자리 기준)
      var top = r.top + (window.scrollY || 0);
      //  위아래로 걸치고, 좌우로도 걸칠 때만 (5120 넓은 화면에서 가운데 띠는 막대와 안 겹친다)
      e.classList.toggle('sjb-under', top < b.bottom + 2 && b.left < r.right - 4);
    });
  }
  //  공통 배율 = 🔍 화면 배율 설정(sd_ui_scale, 기본 115%) — 화면마다 본문 배율이 달라도 머리줄은 이 배율
  function scale(){
    var v = 1.15; try{ var x = parseFloat(localStorage.getItem('sd_ui_scale')); if([1, 1.15, 1.3].indexOf(x) >= 0) v = x; }catch(e){}
    if(document.documentElement.style.getPropertyValue('--sjb-scale') !== String(v)) document.documentElement.style.setProperty('--sjb-scale', String(v));
  }
  scale();
  try{ new MutationObserver(function(){ scale(); setTimeout(fit, 50); }).observe(document.documentElement, { attributes:true, attributeFilter:['style'] }); }catch(e){}
  window.addEventListener('storage', function(e){ if(e.key === 'sd_ui_scale'){ scale(); fit(); } });
  var n = 0;
  (function t(){ fit(); if(n++ < 40) setTimeout(t, 500); })();
  window.addEventListener('resize', fit);
  try{ new MutationObserver(function(){ fit(); }).observe(document.body, { childList:true }); }catch(e){}
  window.sdBrand = { fit:fit, scale:scale };
})();
</script>
<!-- ═══════════════════════════════════════════════════════
     버전 표시 모듈 (영상 만들기용 — 도구용과 같음)  v1.0  (2026-10-02)
     - 다른 화면처럼 왼쪽 아래에 이 파일의 버전을 작게 띄운다 (머리줄 제목 옆에도 표시)
     - 도구는 Firebase 를 싣지 않으므로, 눌렀을 때 전체 프로그램 버전은 서버의 version.json 에서 읽는다
     - version.json 의 sd_tool.html 이 지금 열린 버전보다 높으면 ⚠ 빨간색 + 「새로고침」 단추
     ═══════════════════════════════════════════════════════ -->
<script>
(function(){
  'use strict';
  if(document.getElementById('sd-ver-badge')) return;
  var FILE = 'sd_video.html', NAME = '비디오 스튜디오';
  var NAMES = { 'sd_hub.html':'허브', 'sd_props.html':'매물관리', 'sd_custs.html':'고객관리', 'sd_contracts.html':'계약관리', 'sd_schedule.html':'일정관리',
    'sd_field.html':'현장업무실', 'sd_marketing.html':'마케팅', 'sd_blog.html':'블로그 스튜디오', 'sd_sangga.html':'상가관리', 'sd_data.html':'실거래가', 'sd_tool.html':'도구', 'sd_video.html':'비디오 스튜디오' };
  var SRV = null;
  function mine(){ return window.SD_VERSION || ''; }
  function esc(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function verKey(v){ var m = String(v || '').match(/(\d{4})\.(\d{2})\.(\d{2})-(\d+)/); return m ? (m[1] + m[2] + m[3] + String(m[4]).padStart(3, '0')) : '0'; }
  var st = document.createElement('style'); st.id = 'sd-ver-css';
  st.textContent = '#sd-ver-badge{position:fixed;left:10px;bottom:8px;z-index:9000;background:rgba(26,39,68,.62);color:#fff;border:none;border-radius:8px;padding:3px 8px;'
    + 'font-size:10px;letter-spacing:.2px;cursor:pointer;opacity:.45;transition:opacity .15s;font-family:inherit;line-height:1.3;white-space:nowrap}'
    + '#sd-ver-badge:hover,#sd-ver-badge.old{opacity:1}#sd-ver-badge.old{background:rgba(198,40,40,.85)}'
    + '#sd-ver-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10090;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}'
    + '#sd-ver-ov .vbox{background:#fff;border-radius:14px;max-width:460px;width:100%;margin:auto;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.25)}'
    + '#sd-ver-ov table{width:100%;border-collapse:collapse;font-size:12.5px}#sd-ver-ov td{padding:7px 6px;border-bottom:.5px solid #f0f0f0}'
    + '#tl-ver{color:#868e96!important;font-weight:600!important;margin-left:2px}'
    + '@media(max-width:560px){#sd-ver-badge{left:6px;bottom:6px}}@media print{#sd-ver-badge{display:none}}';
  document.head.appendChild(st);
  var b = document.createElement('button'); b.id = 'sd-ver-badge'; b.type = 'button';
  b.textContent = 'v' + mine(); b.title = NAME + ' · ' + FILE + '\n전체 프로그램 버전 보기';
  b.onclick = function(e){ e.stopPropagation(); open(); };
  document.body.appendChild(b);
  function paint(){
    var s = SRV && SRV[FILE];
    if(s && verKey(s) > verKey(mine())){
      b.textContent = 'v' + mine() + ' ⚠'; b.classList.add('old');
      b.title = NAME + ' · 서버에 새 버전 v' + s + ' 이 있습니다 — 눌러서 새로고침';
    }
  }
  function load(cb){
    fetch('version.json?t=' + Date.now(), { cache:'no-store' }).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ SRV = j || {}; paint(); if(cb) cb(); }, function(){ SRV = SRV || {}; if(cb) cb(); });
  }
  function open(){
    var old = document.getElementById('sd-ver-ov'); if(old) old.remove();
    var ov = document.createElement('div'); ov.id = 'sd-ver-ov';
    ov.onclick = function(e){ if(e.target === ov) ov.remove(); };
    var draw = function(){
      var keys = Object.keys(NAMES), newer = SRV && SRV[FILE] && verKey(SRV[FILE]) > verKey(mine());
      var rows = keys.map(function(f){
        var v = SRV && SRV[f], me = f === FILE;
        return '<tr><td>' + esc(NAMES[f]) + (me ? ' <span style="font-size:10px;color:#1565c0">◀ 지금 화면</span>' : '') + '<div style="font-size:10px;color:#bbb">' + esc(f) + '</div></td>'
          + '<td style="text-align:right;white-space:nowrap;color:' + (v ? '#2e7d32' : '#bbb') + '">' + (v ? 'v' + esc(v) : '확인 안 됨')
          + (me ? '<div style="font-size:10px;color:' + (newer ? '#c62828' : '#868e96') + '">열린 버전 v' + esc(mine()) + (newer ? ' — 옛 버전' : '') + '</div>' : '') + '</td></tr>';
      }).join('');
      ov.innerHTML = '<div class="vbox"><div style="background:#1a2744;color:#fff;padding:13px 18px;display:flex;justify-content:space-between;align-items:center">'
        + '<span style="font-size:14px;font-weight:700">🏷️ 프로그램 버전</span><button type="button" id="sd-ver-x" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer">✕ 닫기</button></div>'
        + '<div style="padding:10px 16px 4px;font-size:11.5px;color:#868e96">서버(GitHub)에 올라가 있는 버전 — version.json 기준</div>'
        + '<div style="padding:0 12px 6px">' + (SRV && Object.keys(SRV).length ? '<table>' + rows + '</table>' : '<div style="padding:16px;color:#868e96;font-size:12.5px">version.json 을 읽지 못했습니다 (오프라인이거나 아직 올리지 않음). 이 화면 버전: v' + esc(mine()) + '</div>') + '</div>'
        + '<div style="padding:10px 16px 14px;display:flex;gap:8px;justify-content:flex-end">'
        + (newer ? '<span style="flex:1;font-size:11.5px;color:#c62828;align-self:center">새 버전 v' + esc(SRV[FILE]) + ' 이 있습니다.</span>' : '')
        + '<button type="button" id="sd-ver-re" style="background:#1565c0;color:#fff;border:0;border-radius:8px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer">🔄 새로고침 (최신으로)</button></div></div>';
      document.getElementById('sd-ver-x').onclick = function(){ ov.remove(); };
      document.getElementById('sd-ver-re').onclick = function(){
        var p = new URLSearchParams(location.search); p.set('_v', (SRV && SRV[FILE]) || Date.now());
        var url = location.pathname.replace(/^.*\//, '') + '?' + p.toString() + location.hash, gone = false, nav = function(){ if(!gone){ gone = true; location.replace(url); } };
        fetch(location.pathname, { cache:'reload' }).then(nav, nav); setTimeout(nav, 2500);
      };
    };
    document.body.appendChild(ov);
    ov.innerHTML = '<div class="vbox" style="padding:24px;text-align:center;color:#868e96;font-size:13px">버전 확인 중…</div>';
    load(draw);
  }
  //  ?_v= 로 다시 열렸으면 주소를 깨끗이
  try{ var q = new URLSearchParams(location.search); if(q.has('_v')){ q.delete('_v'); history.replaceState(history.state, '', location.pathname.replace(/^.*\//, '') + (q.toString() ? '?' + q.toString() : '') + location.hash); } }catch(e){}
  load();
  window.sdVerPanel = open;
})();
</script>
