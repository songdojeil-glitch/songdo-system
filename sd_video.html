<script>
/* ═════════════════════════════════════════════════════════════════
   🎬 영상 만들기 (sd_video.html)  1차 — 2026-10-04
   원고 → 대본(장면) → 화면(AI 그림·내 사진·글자 카드) → 음성(제미나이 TTS) → 자막 → MP4
   · 모든 처리는 이 브라우저 안에서 — 서버 없음. 영상은 WebCodecs(H.264/AAC, 안 되면 VP9/Opus) + mp4-muxer 로 .mp4
   · 열쇠는 블로그 스튜디오와 같은 기록(localStorage sdbs.settings — 같은 주소라 함께 씀). Firebase 에는 올리지 않음
   · 작업은 이 브라우저의 IndexedDB(sd_video/projects)에 — 「작업 파일」로 내려받아 다른 PC 로 옮김
   · 자막 시간: 장면마다 음성을 따로 만들고, 소리의 쉬는 곳을 찾아 문장(조각) 경계를 맞춘다
   · 2차: 일레븐랩스·Fish 목소리, 설명글·썸네일 / 3차: 유튜브 올리기
   ═════════════════════════════════════════════════════════════════ */
(function(){
'use strict';
var SD_VER = '2026.10.10-10';
window.SD_VERSION = SD_VER;
var EMBED = /[?&]embed=1\b/.test(location.search);
if(EMBED) document.documentElement.classList.add('sv-embed');
(function(){ var v = document.getElementById('tl-ver'); if(v) v.textContent = 'v' + SD_VER; })();
try{
  var se = JSON.parse(localStorage.getItem('sd_auth_session') || '{}') || {}, me = document.getElementById('tl-me');
  var RL = { master:'마스터', admin:'관리자', staff:'직원', user:'직원' };
  if(me && se.name) me.innerHTML = '<b>' + String(se.name).replace(/[<>&"]/g, '') + '</b>' + (se.role ? '<span class="rl">' + (RL[se.role] || '') + '</span>' : '');
}catch(e){}

/* ───────── 작은 도구 ───────── */
function $(s, r){ return (r || document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(s){ return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
var toastT = 0;
function toast(m, bad){ var t = $('#sv-toast'); t.textContent = m; t.className = 'on' + (bad ? ' bad' : ''); clearTimeout(toastT); toastT = setTimeout(function(){ t.className = ''; }, bad ? 5200 : 2800); }
var LSX = {
  get: function(k, d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set: function(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function fmtT(s){ s = Math.max(0, s || 0); var m = Math.floor(s / 60), x = Math.floor(s % 60); return m + ':' + (x < 10 ? '0' : '') + x; }
function nchar(s){ return String(s || '').replace(/\s+/g, '').length; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

/* ───────── 열쇠 · 작성자 (블로그 스튜디오와 같은 기록) ───────── */
function settings(){ return Object.assign({ engine:'gemini', geminiModel:'gemini-3.6-flash', geminiImageModel:'gemini-3.6-flash-image', claudeModel:'claude-sonnet-4-5', openaiModel:'gpt-4.1-mini' }, LSX.get('sdbs.settings', {}) || {}); }
function keysOf(e){ var s = settings(); var raw = e === 'claude' ? s.claudeKeys : e === 'openai' ? s.openaiKeys : e === 'eleven' ? s.elevenKeys : e === 'grok' ? s.grokKeys : s.geminiKeys; return String(raw || '').split(/[\n,]/).map(function(x){ return x.trim(); }).filter(Boolean); }
function author(){ return Object.assign({ name:'문형은', title:'공인중개사', office:'송도제일공인중개사사무소', area:'인천 송도국제도시', phone:'032-851-6688' }, LSX.get('sdbs.author', {}) || {}); }
function textEngine(){ var o = OPT.scriptEngine; if(o && keysOf(o).length) return o; var e = settings().engine; if(keysOf(e).length) return e; if(keysOf('gemini').length) return 'gemini'; if(keysOf('claude').length) return 'claude'; if(keysOf('openai').length) return 'openai'; return ''; }
var ENG_N = { gemini:'제미나이', claude:'클로드', openai:'챗GPT' };
function engModel(e){ var s = settings(); return e === 'claude' ? (s.claudeModel || 'claude-sonnet-4-5') : e === 'openai' ? (s.openaiModel || 'gpt-4.1-mini') : (s.geminiModel || 'gemini-3.6-flash'); }

/* 영상 설정 — 이 브라우저에 */
var OPT_DEF = { subPos:'bottom', subStyle:'box', kara:false, karaColor:'yellow', micFill:'', micDev:'', scriptEngine:'', ttsEngine:'google', elVoice:'', elVoiceName:'', elModel:'eleven_multilingual_v2', elStab:0.5, elSpeed:1, fishRef:'', fishName:'', fishModel:'s2.1-pro', fishSpeed:1, voice:'Kore', ttsModel:'gemini-3.1-flash-tts-preview', speed:'normal', tone:'calm', style:'clean', imgStyle:'photo', sub:true, subSize:'m', motion:true, intro:true, outro:true, bgmVol:0.12 };
var OPT = Object.assign({}, OPT_DEF, LSX.get('sdv.opt', {}) || {});
function saveOpt(){ LSX.set('sdv.opt', OPT); }

/* ───────── 작업 저장 (IndexedDB) ───────── */
var DB = null;
function idb(){
  if(DB) return Promise.resolve(DB);
  return new Promise(function(res, rej){
    var r = indexedDB.open('sd_video', 1);
    r.onupgradeneeded = function(){ r.result.createObjectStore('projects', { keyPath:'id' }); };
    r.onsuccess = function(){ DB = r.result; res(DB); };
    r.onerror = function(){ rej(r.error); };
  });
}
function idbDo(mode, fn){ return idb().then(function(db){ return new Promise(function(res, rej){ var tx = db.transaction('projects', mode), st = tx.objectStore('projects'), q = fn(st); tx.oncomplete = function(){ res(q && q.result); }; tx.onerror = function(){ rej(tx.error); }; }); }); }
function idbAll(){ return idbDo('readonly', function(s){ return s.getAll(); }).then(function(a){ return a || []; }); }
function idbPut(p){ return idbDo('readwrite', function(s){ return s.put(p); }); }
function idbDel(id){ return idbDo('readwrite', function(s){ return s.delete(id); }); }

var P = null, LIST = [], LIST_ALL = [], saveT = 0;
function newProject(kind){ if((kind || SECTOR) === 'loc') return newLocProject(); if((kind || SECTOR) === 'photo') return newPhotoProject(); if((kind || SECTOR) === 'clip') return newClipProject(); return { id:'v' + uid(), title:'', src:'', fmt:'9:16', len:'short', scenes:[], step:'src', createdAt:Date.now(), updatedAt:Date.now() }; }
function touch(now){
  if(!P) return; P.updatedAt = Date.now(); clearTimeout(saveT);
  if(LSX.get('sdv.cur', '') !== P.id) LSX.set('sdv.cur', P.id);   // 다시 열면 이 작업부터
  var go = function(){ idbPut(P).then(refreshList, function(e){ toast('작업을 저장하지 못했습니다: ' + e.message, true); }); };
  if(now) go(); else saveT = setTimeout(go, 700);
}
function refreshList(){
  return idbAll().then(function(a){ LIST = LIST_ALL = a.sort(function(x, y){ return (y.updatedAt || 0) - (x.updatedAt || 0); }); paintList(); });
}
function paintList(){
  var el = $('#svList'), LIST = LIST_ALL.filter(function(p){ return kindOf(p) === SECTOR; });
  var lh = $('#svListH'); if(lh && lh.firstChild) lh.firstChild.nodeValue = SECTOR === 'loc' ? '🗺 입지 영상 작업' : SECTOR === 'photo' ? '📸 사진 영상 작업' : SECTOR === 'clip' ? '🎥 영상 편집 작업' : '📝 대본 영상 작업';
  if(!LIST.length){ el.innerHTML = '<div class="sv-empty">아직 저장된 작업이 없습니다.<br>제목을 적으면 여기에 남습니다.</div>'; return; }
  el.innerHTML = LIST.map(function(p){
    var d = new Date(p.updatedAt || 0);
    return '<div class="sv-pi' + (P && P.id === p.id ? ' on' : '') + '" data-open="' + esc(p.id) + '"><div class="t"><b>' + (p.kind === 'loc' ? '🗺 ' : p.kind === 'photo' ? (p.cmode === 'gen' ? '🖼 ' : '📸 ') : p.kind === 'clip' ? (p.cmode === 'gen' ? '🎬 ' : '🎥 ') : '') + esc(p.title || '제목 없음') + '</b><small>' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ' · ' + (p.fmt === '16:9' ? '가로' : '세로') + ' · ' + (p.kind === 'loc' ? '포인트 ' + (((p.L || {}).pois || []).length) : p.kind === 'photo' ? '사진 ' + ((p.photos || []).length) : p.kind === 'clip' ? '영상 ' + ((p.clips || []).length) : '장면 ' + ((p.scenes || []).length)) + '</small></div><button class="x" title="지우기" data-del="' + esc(p.id) + '">🗑</button></div>';
  }).join('');
  $$('[data-open]', el).forEach(function(n){ n.onclick = function(e){ if(e.target.closest('[data-del]')) return; openProject(n.dataset.open); }; });
  $$('[data-del]', el).forEach(function(b){ b.onclick = function(){
    var p = LIST_ALL.find(function(x){ return x.id === b.dataset.del; }); if(!p) return;

function parseJSON(txt){
  var s = String(txt).trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
  try{ return JSON.parse(s); }catch(e){}
  var a = s.indexOf('{'), b = s.lastIndexOf('}');
  if(a >= 0 && b > a){ try{ return JSON.parse(s.slice(a, b + 1)); }catch(e){} }
  if(a >= 0){ var f = repairCutJSON(s.slice(a)); if(f){ try{ return JSON.parse(f); }catch(e){} } }
  throw new Error('AI 응답을 읽지 못했습니다. 한 번 더 눌러 주세요.');
}
function repairCutJSON(s){
  var st = [], inS = false, es = false, cut = -1, snap = null;
  for(var i = 0; i < s.length; i++){
    var ch = s[i];
    if(inS){ if(es) es = false; else if(ch === '\\') es = true; else if(ch === '"') inS = false; continue; }
    if(ch === '"') inS = true;
    else if(ch === '{' || ch === '[') st.push(ch);
    else if(ch === '}' || ch === ']'){ st.pop(); cut = i + 1; snap = st.slice(); if(!st.length) return s.slice(0, cut); }
  }
  if(cut < 0) return '';
  var body = s.slice(0, cut).replace(/,\s*$/, '');
  for(var j = snap.length - 1; j >= 0; j--) body += snap[j] === '{' ? '}' : ']';
  return body;
}
function hint(status, msg){
  msg = msg || '';
  if(status === 404 || /not found|no longer available|not supported/i.test(msg)) return '\n모델 이름을 구글이 받지 않습니다 — 블로그 스튜디오 [엔진 설정]에서 「사용 가능한 모델 불러오기」로 바꿔 주세요.';
  if(/credit|prepay|billing/i.test(msg)) return '\n구글 제미나이 크레딧이 떨어졌습니다 (ai.studio/projects 에서 결제 수단·크레딧 확인).';
  if(status === 429 || /quota|exceeded/i.test(msg)) return '\n잠시 요청이 몰렸습니다. 1~2분 뒤에 다시 해 주세요.';
  return '';
}
async function aiText(prompt){
  var e = textEngine(); if(!e) throw new Error('AI 열쇠가 없습니다. 왼쪽 🔑 열쇠에서 제미나이 열쇠를 넣어 주세요.');
  var s = settings(), keys = keysOf(e), last;
  for(var i = 0; i < keys.length; i++){
    try{
      if(e === 'claude'){
        var r = await fetch('https://api.anthropic.com/v1/messages', { method:'POST', headers:{ 'content-type':'application/json', 'x-api-key':keys[i], 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
          body: JSON.stringify({ model:s.claudeModel || 'claude-sonnet-4-5', max_tokens:P.len === 'xl' ? 32000 : 16000, messages:[{ role:'user', content: prompt + '\n\nJSON 한 덩어리만 출력하세요. 설명이나 코드블록 표시는 붙이지 마세요.' }] }) });
        var d = await r.json().catch(function(){ return {}; });
        if(!r.ok) throw new Error('클로드 오류 ' + r.status + ': ' + ((d.error && d.error.message) || '').slice(0, 200) + (r.status === 404 ? '\n모델 이름을 확인해 주세요 (왼쪽 🔑 열쇠 → 클로드 모델)' : ''));
        return (d.content || []).map(function(c){ return c.text || ''; }).join('');
      }
      if(e === 'openai'){
        var oBody = { model:s.openaiModel || 'gpt-4.1-mini', messages:[{ role:'user', content:prompt }], response_format:{ type:'json_object' }, max_completion_tokens:P.len === 'xl' ? 32000 : 16000 };
        var r2 = await fetch('https://api.openai.com/v1/chat/completions', { method:'POST', headers:{ 'content-type':'application/json', 'authorization':'Bearer ' + keys[i] }, body: JSON.stringify(oBody) });
        var d2 = await r2.json().catch(function(){ return {}; });
        if(!r2.ok && r2.status === 400 && /max_completion_tokens/.test((d2.error && d2.error.message) || '')){   /* 옛 모델은 max_tokens */
          delete oBody.max_completion_tokens; oBody.max_tokens = 16000;
          r2 = await fetch('https://api.openai.com/v1/chat/completions', { method:'POST', headers:{ 'content-type':'application/json', 'authorization':'Bearer ' + keys[i] }, body: JSON.stringify(oBody) });
          d2 = await r2.json().catch(function(){ return {}; });
        }
        if(!r2.ok) throw new Error('챗GPT 오류 ' + r2.status + ': ' + ((d2.error && d2.error.message) || '').slice(0, 200));
        return ((((d2.choices || [])[0] || {}).message) || {}).content || '';
      }
      var r3 = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(s.geminiModel || 'gemini-3.6-flash') + ':generateContent?key=' + encodeURIComponent(keys[i]), {
        method:'POST', headers:{ 'content-type':'application/json' },
        /* 제미나이 3 계열은 생각(thinking) 토큰도 한도에 들어간다 — 넉넉히 (쓴 만큼만 과금) */
        body: JSON.stringify({ contents:[{ role:'user', parts:[{ text:prompt }] }], generationConfig:{ temperature:0.7, maxOutputTokens:32768, responseMimeType:'application/json' } }) });
      var d3 = await r3.json().catch(function(){ return {}; });
      if(!r3.ok){ var em = (d3.error && d3.error.message) || ''; throw new Error('제미나이 오류 ' + r3.status + ': ' + em.slice(0, 200) + hint(r3.status, em)); }
      var txt = ((((d3.candidates || [])[0] || {}).content || {}).parts || []).filter(function(p){ return !p.thought; }).map(function(p){ return p.text || ''; }).join('');
      if(!txt) throw new Error('제미나이가 빈 응답을 보냈습니다.');
      return txt;
    }catch(err){ last = err; if(!/401|403|429|quota|invalid/i.test(err.message)) throw err; }
  }
  throw last;
}

async function clipAutoRun(useAi){
  var miss = missingReq();
  if(miss.length && !confirm('표시·광고 명시사항 빈칸이 ' + miss.length + '개 있습니다 (' + miss.map(function(k){ return REQ_N[k]; }).join(', ') + ').\n인터넷 광고에는 이 칸들이 들어가야 합니다. 그래도 영상을 만들까요?')) return;
  AUTO = true; STOP = false;
  var say = function(t){ var o = $('#svAutoOut'); if(o) o.innerHTML = '<div class="sv-ok">⏳ ' + esc(t) + '</div>'; };
  try{
    syncSrc();
    if(useAi && clipEngine() && !P.aiDone) await aiClips(say);
    if(!(P.segs || []).length){ defaultSegs(); }
    syncScenes(); await clipThumbs();
    if(voiceReady()){
      var need = P.scenes.filter(function(s){ return s.say && !hasAudio(s); });
      for(var i = 0; i < need.length; i++){ if(STOP) throw new Error('멈췄습니다'); say('목소리 만드는 중… ' + (i + 1) + ' / ' + need.length); await oneVoice(need[i]); }
    } else say(micOn() ? '녹음 안 한 줄은 소리 없이 만듭니다' : '목소리 열쇠가 없어 소리 없이 만듭니다 — 3단계에서 목소리를 고르면 소리가 들어갑니다');
    AUTO = false; P.step = 'video'; touch(true); render();
    await sleep(80); await encodePhoto();
  }catch(e){ var o = $('#svAutoOut'); if(o) o.innerHTML = '<div class="sv-err">' + esc(e.message || String(e)) + '</div>'; else toast(e.message || String(e), true); }
  finally{ AUTO = false; }
}

<script>
(function(){
  'use strict';
  if(window.__sjbOn) return; window.__sjbOn = true;
  //  화면 오른쪽 위에 떠 있는 사용자 막대(#_sda_b — 이름·허브·로그아웃)와 겹치는 머리줄은 그 폭만큼 비켜 선다
  function fit(){
    var bar = document.getElementById('_sda_b'), root = document.documentElement;
    var rs = document.querySelectorAll('.sjb-reserve');
    if(!bar || getComputedStyle(bar).display === 'none'){ Array.prototype.forEach.call(rs, function(e){ e.classList.remove('sjb-under'); }); return; }
    var b = bar.getBoundingClientRect();
    root.style.setProperty('--sjb-barw', Math.ceil(b.width) + 'px');
    Array.prototype.forEach.call(rs, function(e){
      var r = e.getBoundingClientRect();
      //  막대가 이 줄 위쪽에 걸치면 비킨다 (스크롤해서 내려간 뒤에도 처음 자리 기준)
      var top = r.top + (window.scrollY || 0);
      //  위아래로 걸치고, 좌우로도 걸칠 때만 (5120 넓은 화면에서 가운데 띠는 막대와 안 겹친다)
      e.classList.toggle('sjb-under', top < b.bottom + 2 && b.left < r.right - 4);
    });
  }
  //  공통 배율 = 🔍 화면 배율 설정(sd_ui_scale, 기본 115%) — 화면마다 본문 배율이 달라도 머리줄은 이 배율
  function scale(){
    var v = 1.15; try{ var x = parseFloat(localStorage.getItem('sd_ui_scale')); if([1, 1.15, 1.3].indexOf(x) >= 0) v = x; }catch(e){}
    if(document.documentElement.style.getPropertyValue('--sjb-scale') !== String(v)) document.documentElement.style.setProperty('--sjb-scale', String(v));
  }
  scale();
  try{ new MutationObserver(function(){ scale(); setTimeout(fit, 50); }).observe(document.documentElement, { attributes:true, attributeFilter:['style'] }); }catch(e){}
  window.addEventListener('storage', function(e){ if(e.key === 'sd_ui_scale'){ scale(); fit(); } });
  var n = 0;
  (function t(){ fit(); if(n++ < 40) setTimeout(t, 500); })();
  window.addEventListener('resize', fit);
  try{ new MutationObserver(function(){ fit(); }).observe(document.body, { childList:true }); }catch(e){}
  window.sdBrand = { fit:fit, scale:scale };
})();
</script>

    load(draw);
  }
  //  ?_v= 로 다시 열렸으면 주소를 깨끗이
  try{ var q = new URLSearchParams(location.search); if(q.has('_v')){ q.delete('_v'); history.replaceState(history.state, '', location.pathname.replace(/^.*\//, '') + (q.toString() ? '?' + q.toString() : '') + location.hash); } }catch(e){}
