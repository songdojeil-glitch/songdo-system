<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SJDWS - 블로그 스튜디오</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#faf8f5; --panel:#ffffff; --line:#e7e0d7; --line2:#f0ebe4;
  --ink:#2c2724; --ink2:#6b625a; --ink3:#9a9088;
  --accent:#c1622f; --accent-soft:#fdf1e9; --accent-line:#efc9ae;
  --ok:#2f7d4f; --ok-soft:#eef7f1; --warn:#b0500f; --warn-soft:#fdf3e7;
  --danger:#b3342c;
  --r:10px; --sh:0 1px 2px rgba(44,39,36,.05), 0 4px 14px rgba(44,39,36,.05);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
  font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--accent)}

/* ---------- layout ---------- */
.app{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
/* ── SJDWS 공통 헤더·네비 ── */
body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.sjd-head{flex:0 0 auto;background:#fff;padding:12px 18px 10px;border-bottom:1px solid var(--line2)}
.sjd-head .bnd{font-size:12.5px;color:#666;margin:0 0 2px}
.sjd-head .bnd b{color:#1a2035;letter-spacing:.3px;font-weight:800}
.sjd-head .bnd span{font-size:10.5px;color:#999}
.sjd-head h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.02em}
.sjd-head h1 small{font-size:12.5px;color:#666;font-weight:400;margin-left:8px}
.sjd-nav{flex:0 0 auto;background:#f8f8f6;border-bottom:.5px solid #e0e0e0;
  padding:8px 16px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sjd-nav a{padding:5px 10px;border-radius:20px;font-size:11px;text-decoration:none;white-space:nowrap}
@media (max-width:760px){ .sjd-head{padding:10px 14px 8px} .sjd-head h1{font-size:16px} .sjd-head h1 small{display:none} }
header.top{display:flex;align-items:center;gap:14px;padding:0 18px;height:52px;flex:0 0 52px;
  background:var(--panel);border-bottom:1px solid var(--line);z-index:20}
.brand{display:flex;align-items:baseline;gap:9px;font-weight:800;font-size:15.5px;letter-spacing:-.02em}
.brand small{font-weight:500;font-size:11.5px;color:var(--ink3);letter-spacing:0}
.top .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--line);
  border-radius:999px;font-size:12.5px;color:var(--ink2);background:#fff;white-space:nowrap}
.chip:hover{border-color:var(--accent-line);color:var(--accent)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:#cfc7bd;flex:0 0 7px}
.chip.on .dot{background:var(--ok)}
.chip.off .dot{background:#d6a0a0}
.chip.accent{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:600}

.main{flex:1;display:flex;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;background:var(--panel)}
#colCat{flex:0 0 196px;border-right:1px solid var(--line)}
#colTopic{flex:0 0 320px;border-right:1px solid var(--line)}
#colWork{flex:1;background:var(--bg);min-width:0}
.colhead{flex:0 0 auto;padding:12px 14px 10px;border-bottom:1px solid var(--line2)}
.colhead h2{margin:0;font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.06em}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{width:9px}
.scroll::-webkit-scrollbar-thumb{background:#ddd5cb;border-radius:9px;border:3px solid var(--panel)}
#colWork .scroll::-webkit-scrollbar-thumb{border-color:var(--bg)}

/* ---------- categories ---------- */
.cat{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;padding:9px 12px;
  border-left:3px solid transparent;border-bottom:1px solid var(--line2)}
.cat:hover{background:#fcfaf7}
.cat.sel{background:var(--accent-soft);border-left-color:var(--accent)}
.cat .ic{font-size:14px;line-height:1.35;flex:0 0 auto}
.cat > span:last-child{min-width:0}
.cat .nm{display:block;font-weight:600;font-size:13px;letter-spacing:-.01em}
.cat.sel .nm{color:var(--accent)}
.cat .ds{display:block;font-size:11px;color:var(--ink3);margin-top:1px;line-height:1.45}

/* ---------- topics ---------- */
.searchbox{position:relative}
.searchbox input{width:100%;padding:8px 11px 8px 30px;border:1px solid var(--line);border-radius:var(--r);
  background:#fdfcfa;outline:none}
.searchbox input:focus{border-color:var(--accent-line);background:#fff}
.searchbox .mag{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:13px}
.addbox{padding:11px 14px;border-bottom:1px solid var(--line2);background:#fcfaf7}
.addbox input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none;margin-bottom:6px}
.addbox input:focus{border-color:var(--accent-line)}
.addrow{display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 13px;border-radius:8px;
  border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.btn:hover{border-color:var(--accent-line);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#a9542a;color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 9px;font-size:11.5px;font-weight:500}
.btn.wide{width:100%}

.topic{display:flex;gap:10px;width:100%;text-align:left;padding:9px 13px;border-bottom:1px solid var(--line2);align-items:flex-start}
.topic:hover{background:#fcfaf7}
.topic.sel{background:var(--accent-soft)}
.topic .no{flex:0 0 20px;font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums;padding-top:2px;font-weight:600}
.topic.sel .no{color:var(--accent)}
.topic .tt{display:block;font-size:12.8px;line-height:1.5;letter-spacing:-.012em}
.topic.sel .tt{font-weight:600;color:var(--accent)}
.topic .kk{display:block;font-size:10.5px;color:var(--ink3);margin-top:2px;line-height:1.4}
.topic .star{flex:0 0 auto;color:var(--ink3);font-size:11px;opacity:0;padding-top:2px}
.topic:hover .star{opacity:.7}
.topic .star.on{opacity:1;color:var(--accent)}
.emptynote{padding:26px 16px;text-align:center;color:var(--ink3);font-size:12.5px;line-height:1.8}

/* ---------- work column ---------- */
.bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--panel);
  border-bottom:1px solid var(--line);flex-wrap:wrap;flex:0 0 auto}
.bar select{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12.5px;outline:none}
.bar select:focus{border-color:var(--accent-line)}
.bar .lbl{font-size:11.5px;color:var(--ink3);font-weight:600}
.picked{flex:0 0 auto;max-width:100%;padding:9px 16px;background:var(--accent-soft);border-bottom:1px solid var(--accent-line);
  font-size:13px;display:flex;align-items:center;gap:9px}
.picked b{font-weight:700;letter-spacing:-.015em}
.picked .tag{font-size:11px;color:var(--accent);background:#fff;border:1px solid var(--accent-line);
  padding:1px 7px;border-radius:999px;white-space:nowrap}

.wrap{max-width:840px;margin:0 auto;padding:20px 22px 90px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.card > h3{margin:0;padding:11px 15px;font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.05em;
  border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
.card > h3 .r{margin-left:auto;display:flex;gap:6px}
.card .body{padding:14px 15px}

.titleopts{display:grid;grid-template-columns:1fr;gap:0}
.titleopt{display:flex;gap:10px;align-items:flex-start;padding:9px 15px;border-bottom:1px solid var(--line2);text-align:left;width:100%}
.titleopt:last-child{border-bottom:none}
.titleopt:hover{background:#fcfaf7}
.titleopt.sel{background:var(--accent-soft)}
.titleopt .rd{flex:0 0 15px;height:15px;border:1.5px solid #cfc7bd;border-radius:50%;margin-top:3px;position:relative}
.titleopt.sel .rd{border-color:var(--accent)}
.titleopt.sel .rd:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.titleopt .tx{display:block;font-size:14px;font-weight:600;letter-spacing:-.02em;line-height:1.5}
.titleopt .ln{display:block;font-size:10.5px;color:var(--ink3);margin-top:2px}

/* article preview */
.article{padding:22px 26px;font-size:14.5px;line-height:1.95;letter-spacing:-.01em;outline:none}
.article:focus{background:#fffdfa}
.article h2{font-size:18px;font-weight:800;margin:30px 0 10px;letter-spacing:-.025em;line-height:1.45}
.article h2:first-child{margin-top:0}
.article h3{font-size:15.5px;font-weight:700;margin:22px 0 7px;letter-spacing:-.02em}
.article p{margin:0 0 15px}
.article ul,.article ol{margin:0 0 15px;padding-left:20px}
.article li{margin-bottom:5px}
.article blockquote{margin:18px 0;padding:12px 16px;background:var(--accent-soft);
  border-left:3px solid var(--accent);border-radius:0 8px 8px 0;font-weight:600;color:#8a441f}
.article table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13px}
.article th,.article td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.article th{background:#f7f3ee;font-weight:700}
.article .imgslot{margin:18px 0;border:1.5px dashed var(--accent-line);border-radius:10px;background:#fdfaf7;
  padding:14px;text-align:center;color:var(--ink3);font-size:12.5px}
.article .imgslot img{max-width:100%;border-radius:8px;display:block;margin:0 auto 8px}
.article .imgslot .cap{font-size:11.5px;color:var(--ink3)}

/* photos */
.photolist{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:11px}
.photo{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fdfcfa;display:flex;flex-direction:column}
.photo .ph{aspect-ratio:4/3;background:#f4efe9;display:flex;align-items:center;justify-content:center;
  color:var(--ink3);font-size:11.5px;text-align:center;padding:8px;position:relative;overflow:hidden}
.photo .ph img{width:100%;height:100%;object-fit:cover;display:block}
.photo .ph .badge{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;
  padding:2px 6px;border-radius:5px}
.photo .meta{padding:8px 9px;font-size:11.5px;color:var(--ink2);border-top:1px solid var(--line2)}
.photo .meta .cap{display:block;margin-bottom:6px;line-height:1.5;color:var(--ink2);
  min-height:2.2em;max-height:3.4em;overflow:hidden}
.photo .acts{display:flex;gap:5px}
.photo .acts .btn{flex:1;padding:4px 0;font-size:11px;justify-content:center}

/* facts */
.facts li{margin-bottom:6px;color:var(--warn)}
.facts{margin:0;padding-left:19px}

/* tags */
.tagbox{display:flex;flex-wrap:wrap;gap:6px}
.tagbox .tg{display:inline-flex;align-items:center;gap:5px;background:#f7f3ee;border:1px solid var(--line);
  border-radius:999px;padding:3px 9px;font-size:12px;color:var(--ink2)}
.tagbox .tg button{color:var(--ink3);font-size:13px;line-height:1}
.tagbox .tg button:hover{color:var(--danger)}

/* publish bar */
.pubbar{position:sticky;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);padding:11px 16px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;z-index:10}

/* modal */
.mask{position:fixed;inset:0;background:rgba(44,39,36,.42);display:flex;align-items:center;justify-content:center;
  z-index:100;padding:22px}
.modal{background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.22);width:100%;max-width:560px;
  max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal h3{margin:0;padding:15px 20px;font-size:15px;font-weight:700;border-bottom:1px solid var(--line2);
  display:flex;align-items:center}
.modal h3 button{margin-left:auto;color:var(--ink3);font-size:19px;line-height:1}
.modal .mbody{padding:18px 20px;overflow-y:auto}
.modal .mfoot{padding:12px 20px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;background:#fcfaf7}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.field .hint{font-size:11px;color:var(--ink3);font-weight:400;margin-top:4px;line-height:1.6}
.field input,.field select,.field textarea{width:100%;padding:8px 11px;border:1px solid var(--line);
  border-radius:8px;background:#fdfcfa;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent-line);background:#fff}
.field textarea{resize:vertical;min-height:72px;font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.radios{display:flex;gap:8px}
.radios label{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 11px;cursor:pointer;
  font-size:12.5px;font-weight:600;text-align:center;background:#fdfcfa}
.radios input{display:none}
.radios input:checked + span{color:var(--accent)}
.radios label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* notice */
.notice{padding:10px 14px;border-radius:9px;font-size:12.5px;line-height:1.7;margin-bottom:13px}
.notice.warn{background:var(--warn-soft);border:1px solid #f0d3af;color:#8a4a13}
.notice.ok{background:var(--ok-soft);border:1px solid #c6e2d1;color:#256341}
.notice b{font-weight:700}

/* toast + busy */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);background:#2c2724;color:#fff;
  padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.22s;z-index:200;max-width:80vw}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.bad{background:var(--danger)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.progress{padding:50px 20px;text-align:center;color:var(--ink2)}
.progress .big{font-size:15px;font-weight:700;margin-bottom:7px}
.progress .sm{font-size:12.5px;color:var(--ink3)}

.blank{padding:70px 26px;text-align:center;color:var(--ink3)}
.blank .ic{font-size:34px;margin-bottom:12px;opacity:.5}
.blank .t1{font-size:15px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.blank .t2{font-size:12.5px;line-height:1.9}

@media (max-width:1100px){
  #colCat{flex:0 0 150px} #colTopic{flex:0 0 250px}
}
</style>
</head>
<body>
<div id="_sda_cover" style="position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px"><div style="width:32px;height:32px;border:3px solid #e0e0e0;border-top-color:#c1622f;border-radius:50%;animation:_sda_spin .7s linear infinite"></div><div style="font-size:12px;color:#888">인증 확인 중...</div></div><style>@keyframes _sda_spin{to{transform:rotate(360deg)}}</style>

<div class="sjd-head">
  <p class="bnd"><b>SJDWS</b> <span>SongdoJeil Data &amp; Work System</span></p>
  <h1>블로그 스튜디오 <small>부동산 주제 160개 · AI 글 생성 · 네이버 바로 발행</small></h1>
</div>
<div class="sjd-nav">
  <a href="sd_hub.html" style="background:#1a1a1a;color:#fff">🏠 허브</a>
  <a href="sd_props.html" data-screen="sd_props" style="background:#e8f5e9;color:#1a7f3c;border:.5px solid #a5d6a7">🏢 매물</a>

  <a href="sd_contracts.html" data-screen="sd_contracts" style="background:#fce4ec;color:#c62828;border:.5px solid #f48fb1">📑 계약</a>
  <a href="sd_field.html" data-screen="sd_field" style="background:#e0f2f1;color:#00695c;border:0.5px solid #80cbc4">🥾 현장</a>
  <a href="sd_schedule.html" data-screen="sd_schedule" style="background:#fff3e0;color:#e65100;border:.5px solid #ffcc80">📅 일정</a>
  <a href="sd_marketing.html" data-screen="sd_marketing" style="background:#f3e5f5;color:#7b1fa2;border:.5px solid #ce93d8">📢 마케팅</a>
  <a href="sd_blog.html" data-screen="sd_blog" style="background:#c1622f;color:#fff;font-weight:600">✍️ 블로그</a>
  <a href="sd_sangga.html" data-screen="sd_sangga" style="background:#ff6f00;color:#fff">🏪 상가</a>
  <a href="sd_data.html" data-screen="sd_data" style="background:linear-gradient(135deg,#0d1f3c,#1a3a5c);color:#00d4ff;border:.5px solid #00d4ff44">📡 데이터</a>
</div>
<div class="app">
  <header class="top">
    <div class="brand">✍️ 블로그 스튜디오 <small>주제 160개 · AI 작성 · 사진 · 발행</small></div>
    <div class="spacer"></div>
    <button class="chip" id="chipFb"><span class="dot"></span><span id="fbTxt">Firebase 확인 중</span></button>
    <button class="chip" id="chipHelper"><span class="dot"></span><span id="helperTxt">도우미 확인 중</span></button>
    <button class="chip" id="chipAuthor">✍️ <span id="authorTxt">작성자 정보</span></button>
    <button class="chip" id="chipArchive">🗂 보관함 <span id="arcCnt"></span></button>
    <button class="chip accent" id="chipSettings"><span class="dot"></span><span id="engineTxt">엔진 설정</span></button>
  </header>

  <div class="main">
    <!-- 카테고리 -->
    <div class="col" id="colCat">
      <div class="colhead"><h2>카테고리</h2></div>
      <div class="scroll" id="catList"></div>
    </div>

    <!-- 주제 -->
    <div class="col" id="colTopic">
      <div class="colhead">
        <div class="searchbox"><span class="mag">🔍</span>
          <input id="search" placeholder="키워드로 160개 주제 검색 (예: 전세, DSR, 학군)">
        </div>
      </div>
      <div class="addbox">
        <input id="ownTopic" placeholder="✏️ 직접 주제 입력 — 원하는 제목을 쓰세요">
        <input id="ownKeys" placeholder="핵심 키워드 (쉼표로 구분, 선택)">
        <div class="addrow">
          <button class="btn sm" style="flex:1" id="btnUseOwn">이 주제로 쓰기</button>
          <button class="btn sm" style="flex:1" id="btnSaveOwn">내 주제에 저장</button>
        </div>
        <button class="btn sm wide" id="btnAiTopics" style="margin-top:6px">✨ AI로 관련 주제 10개 받기</button>
      </div>
      <div class="colhead" id="topicHead"><h2>주제</h2></div>
      <div class="scroll" id="topicList"></div>
    </div>

    <!-- 작업 -->
    <div class="col" id="colWork">
      <div class="bar">
        <span class="lbl">플랫폼</span>
        <select id="optPlatform">
          <option value="naver">네이버 블로그</option>
          <option value="tistory">티스토리 (구글 검색)</option>
          <option value="brand">브랜드·사무소 블로그</option>
        </select>
        <select id="optLength">
          <option value="2000">본문 2,000자</option>
          <option value="3000" selected>본문 3,000자</option>
          <option value="4000">본문 4,000자</option>
          <option value="5000">본문 5,000자</option>
        </select>

<script>
"use strict";
/* ============================================================
   송도제일 블로그 스튜디오
   - 글 생성: 제미나이 / 클로드 (브라우저에서 내 API 키로 직접 호출, 키는 이 브라우저에만 저장)
   - 사진: 내 사진 업로드 + AI 이미지 생성(제미나이)
   - 발행: 같은 폴더의 MR.K 네이버 발행 도우미(127.0.0.1:3777)로 전달
   ============================================================ */

/* ---------- 저장소 ---------- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('sdbs.'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){
    try{ localStorage.setItem('sdbs.'+k, JSON.stringify(v)); }
    catch(e){ toast('저장 공간이 가득 찼습니다. 보관함을 비워 주세요.', true); }
    if(FB_KEYS.indexOf(k) >= 0) fbPush(k, v);
  },
};

/* ── Firebase 동기화 ──────────────────────────────────────────────
   작성자 정보·내 주제·보관함은 다른 SJDWS 시스템과 같은 Firebase 에 저장한다.
   집 PC 에서 저장하면 사무실 PC 에도 그대로 보인다.
   API 키는 여기에 넣지 않는다 — 이 브라우저에만 남는다. */
const FB_KEYS = ['author', 'mine', 'archive'];
const FB_ROOT = 'sd_blog';
let fbReady = false;

function fbPush(k, v){
  if(!fbReady || !window._fbDb) return;
  try{ window._fbSet(window._fbRef(window._fbDb, FB_ROOT + '/' + k), v); }
  catch(e){ /* 저장 실패해도 localStorage 에는 남아 있다 */ }
}
/* Firebase 준비되면 모듈 스크립트가 부른다 */
window.blogFbPull = async function(){
  fbReady = true;
  if(!window._fbDb) return;
  try{
    const snap = await window._fbGet(window._fbChild(window._fbRef(window._fbDb), FB_ROOT));
    if(!snap.exists()) { FB_KEYS.forEach(k => fbPush(k, state[k])); return; }   // 최초 1회 올려둔다
    const d = snap.val() || {};
    if(d.author) state.author = Object.assign({}, DEF_AUTHOR, d.author);
    if(Array.isArray(d.mine)) state.mine = d.mine;
    if(Array.isArray(d.archive)) state.archive = d.archive;
    FB_KEYS.forEach(k => { try{ localStorage.setItem('sdbs.'+k, JSON.stringify(state[k])); }catch(e){} });
    $('#authorTxt').textContent = state.author.name || '작성자 정보';
    $('#arcCnt').textContent = state.archive.length ? '· ' + state.archive.length : '';
    renderCats(); renderTopics();
    const b = $('#fbTxt'); if(b){ b.textContent = 'Firebase 연결됨'; $('#chipFb').className = 'chip on'; }
  }catch(e){
    const b = $('#fbTxt'); if(b){ b.textContent = 'Firebase 오프라인'; $('#chipFb').className = 'chip off'; }
  }
};

const DEF_AUTHOR = {
  name:'문형은', title:'공인중개사', office:'송도제일공인중개사사무소',
  area:'인천 송도국제도시', years:'21', phone:'032-851-6688',
  addr:'인천 연수구 해돋이로 168 혜인프라자 1층 103호',
  blog:'', extra:'한국공인중개사협회 연수구지부 임원 · 전세사기 예방 강사 · 부동산 가격검증위원',
  sign:'궁금한 점은 댓글이나 사무소로 편하게 물어보세요.',
};
const DEF_SETTINGS = {
  engine:'gemini',
  geminiKeys:'', geminiModel:'gemini-2.5-flash', geminiImageModel:'gemini-2.5-flash-image',
  claudeKeys:'', claudeModel:'claude-sonnet-4-5',
  naverCategory:'', visibility:'public', withMap:true,
};

const state = {
  author: Object.assign({}, DEF_AUTHOR, LS.get('author', {})),
  settings: Object.assign({}, DEF_SETTINGS, LS.get('settings', {})),
  mine: LS.get('mine', []),            // 내가 추가한 주제 [{t,k}]
  archive: LS.get('archive', []),      // 보관함
  cat: 'apt',
  aiTopics: null,                      // AI가 방금 제안한 주제들
  search: '',
  picked: null,                        // {t, k, cat}
  post: null,                          // {titles, title, meta, blocks, tags, checkFacts}
  images: {},                          // slotIndex -> dataUrl
  imgSrc: {},                          // slotIndex -> 'up' | 'ai'
  busy: false,
  helper: { on:false, loggedIn:false, ver:'' },
};

/* ---------- 공통 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastTimer;
function toast(msg, bad){
  const el = $('#toast'); el.textContent = msg; el.className = 'show' + (bad?' bad':'');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=> el.className = '', bad ? 5200 : 2600);
}
/* 도우미가 이 페이지를 띄웠으면 같은 주소(상대경로), 아니면 절대주소로 (그 경우 보안상 막힐 수 있음) */
const LOCAL = /^https?:\/\/(127\.0\.0\.1|localhost)(:\d+)?$/.test(location.origin);
const HELPER = LOCAL ? '' : 'http://127.0.0.1:3777';

/* ============================================================
   1) 카테고리 · 주제
   ============================================================ */
function allCats(){
  const mine = { id:'mine', name:'내 주제', desc:'직접 추가한 주제', icon:'⭐', topics: state.mine };
  return [mine].concat(CATS);
}
function renderCats(){
  $('#catList').innerHTML = allCats().map(c => `
    <button class="cat ${state.cat===c.id?'sel':''}" data-cat="${c.id}">
      <span class="ic">${c.icon}</span>
      <span><span class="nm">${esc(c.name)}</span><span class="ds">${c.topics.length}개 · ${esc(c.desc)}</span></span>
    </button>`).join('');
  $('#catList').querySelectorAll('.cat').forEach(b => b.onclick = ()=>{
    state.cat = b.dataset.cat; state.aiTopics = null; state.search = ''; $('#search').value = '';
    renderCats(); renderTopics();
  });
}
function currentTopics(){
  if(state.search){
    const q = state.search.toLowerCase();
    const out = [];
    allCats().forEach(c => {
      const catHit = c.name.toLowerCase().includes(q);   // 카테고리 이름이 맞으면 그 안의 주제 전부
      c.topics.forEach(t => {
        if(catHit || (t.t + ' ' + (t.k||'')).toLowerCase().includes(q)) out.push(Object.assign({ cat:c.name }, t));
      });
    });
    return out;
  }
  if(state.aiTopics) return state.aiTopics;
  const c = allCats().find(x => x.id === state.cat);
  return c ? c.topics.map(t => Object.assign({ cat:c.name }, t)) : [];
}
function renderTopics(){
  const list = currentTopics();
  const head = state.search ? `검색 결과 <b style="color:var(--accent)">${list.length}</b>개`
    : state.aiTopics ? `✨ AI 제안 주제 ${list.length}개`
    : `${esc((allCats().find(c=>c.id===state.cat)||{}).name||'')} · 주제 ${list.length}`;
  $('#topicHead').innerHTML = `<h2 style="letter-spacing:0">${head}</h2>`;

  if(!list.length){
    $('#topicList').innerHTML = state.cat === 'mine'
      ? `<div class="emptynote">아직 저장한 주제가 없습니다.<br>위 칸에 주제를 적고<br><b>[내 주제에 저장]</b>을 눌러 보세요.</div>`
      : `<div class="emptynote">찾는 주제가 없습니다.<br>위에 직접 입력하거나<br><b>[AI로 관련 주제 10개]</b>를 눌러 보세요.</div>`;
    return;
  }
  $('#topicList').innerHTML = list.map((t, i) => {
    const sel = state.picked && state.picked.t === t.t;
    const mineIdx = state.mine.findIndex(m => m.t === t.t);
    return `<button class="topic ${sel?'sel':''}" data-i="${i}">
      <span class="no">${String(i+1).padStart(2,'0')}</span>
      <span style="flex:1;min-width:0">
        <span class="tt">${esc(t.t)}</span>
        <span class="kk">${esc(t.k || t.cat || '')}</span>
      </span>
      <span class="star ${mineIdx>=0?'on':''}" data-star="${i}" title="내 주제에 저장">${mineIdx>=0?'★':'☆'}</span>
    </button>`;
  }).join('');

  $('#topicList').querySelectorAll('.topic').forEach(b => {
    b.onclick = (e)=>{
      const t = list[+b.dataset.i];
      if(e.target.dataset.star !== undefined){ toggleMine(t); e.stopPropagation(); return; }
      pick(t);
    };
  });
}
function toggleMine(t){
  const i = state.mine.findIndex(m => m.t === t.t);
  if(i >= 0) state.mine.splice(i, 1);
  else state.mine.unshift({ t:t.t, k:t.k || '' });
  LS.set('mine', state.mine); renderCats(); renderTopics();
  toast(i >= 0 ? '내 주제에서 뺐습니다' : '내 주제에 저장했습니다');
}
function pick(t){
  state.picked = { t:t.t, k:t.k || '', cat:t.cat || '' };
  renderTopics(); renderPicked();
}
function renderPicked(){
  const p = state.picked;
  $('#pickedBar').innerHTML = p
    ? `<div class="picked"><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
         선택한 주제 &nbsp;<b>${esc(p.t)}</b></span>
       ${p.k?`<span class="tag">${esc(p.k)}</span>`:''}</div>`
    : '';
}

/* ============================================================
   2) AI 호출 — 제미나이 / 클로드
   ============================================================ */
function keysOf(engine){
  const raw = engine === 'claude' ? state.settings.claudeKeys : state.settings.geminiKeys;
  return String(raw || '').split(/[\n,]/).map(s => s.trim()).filter(Boolean);
}
function engineLabel(){
  const e = state.settings.engine;
  const n = keysOf(e).length;
  return (e === 'claude' ? '클로드로 씀' : '제미나이로 씀') + ' · 키 ' + n + '개';
}
function refreshEngineChip(){
  const n = keysOf(state.settings.engine).length;
  $('#engineTxt').textContent = engineLabel();
  $('#chipSettings').className = 'chip accent ' + (n ? 'on' : 'off');
}

async function callAI(prompt, { json = false, maxTokens = 8192 } = {}){
  const engine = state.settings.engine;
  const keys = keysOf(engine);
  if(!keys.length) throw new Error((engine==='claude'?'클로드':'제미나이') + ' API 키가 없습니다. 오른쪽 위 [엔진 설정]에서 키를 넣어 주세요.');
  let lastErr;
  for(const key of keys){
    try{
      return engine === 'claude'
        ? await callClaude(key, prompt, json, maxTokens)
        : await callGemini(key, prompt, json, maxTokens);
    }catch(e){
      lastErr = e;
      /* 키 문제·한도 초과면 다음 키로 넘어간다 */
      if(!/401|403|429|한도|quota|invalid/i.test(e.message)) throw e;
    }
  }
  throw lastErr;
}
async function callGemini(key, prompt, json, maxTokens){
  const model = state.settings.geminiModel || 'gemini-2.5-flash';
  const body = {
    contents: [{ role:'user', parts:[{ text: prompt }] }],
    generationConfig: { temperature: 0.85, maxOutputTokens: maxTokens },
  };
  if(json) body.generationConfig.responseMimeType = 'application/json';
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,
    { method:'POST', headers:{ 'content-type':'application/json' }, body: JSON.stringify(body) });
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error('제미나이 오류 ' + r.status + ': ' + ((d.error && d.error.message) || '').slice(0, 200));
  const parts = (((d.candidates||[])[0]||{}).content||{}).parts || [];
  const txt = parts.map(p => p.text || '').join('').trim();
  if(!txt) throw new Error('제미나이가 빈 응답을 보냈습니다. 잠시 후 다시 해 주세요.');

async function callClaude(key, prompt, json, maxTokens){
  const model = state.settings.claudeModel || 'claude-sonnet-4-5';
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{ 'content-type':'application/json', 'x-api-key': key,
      'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
    body: JSON.stringify({ model, max_tokens: Math.min(maxTokens, 16000),
      messages:[{ role:'user', content: prompt + (json ? '\n\nJSON 한 덩어리만 출력하세요. 설명이나 코드블록 표시는 붙이지 마세요.' : '') }] }),
  });
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error('클로드 오류 ' + r.status + ': ' + ((d.error && d.error.message) || '').slice(0, 200));
  const txt = (d.content || []).map(c => c.text || '').join('').trim();
  if(!txt) throw new Error('클로드가 빈 응답을 보냈습니다.');

}
function parseJSON(txt){
  let s = String(txt).trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
  try{ return JSON.parse(s); }catch(e){}
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if(a >= 0 && b > a){ try{ return JSON.parse(s.slice(a, b+1)); }catch(e){} }
  throw new Error('AI 응답을 읽지 못했습니다. 한 번 더 [생성하기]를 눌러 주세요.');
}

async function genImage(prompt){
  const keys = keysOf('gemini');
  if(!keys.length) throw new Error('AI 사진은 제미나이 키가 필요합니다. [엔진 설정]에서 제미나이 키를 넣어 주세요.');
  const model = state.settings.geminiImageModel || 'gemini-2.5-flash-image';
  const full = prompt + ', photorealistic, natural daylight, clean composition, korean urban residential context, no text, no watermark, no people faces';
  let lastErr;
  for(const key of keys){
    try{
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`,
        { method:'POST', headers:{ 'content-type':'application/json' },
          body: JSON.stringify({ contents:[{ role:'user', parts:[{ text: full }] }] }) });
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error('이미지 오류 ' + r.status + ': ' + ((d.error && d.error.message)||'').slice(0,180));
      const parts = (((d.candidates||[])[0]||{}).content||{}).parts || [];
      const img = parts.find(p => p.inlineData || p.inline_data);
      if(!img) throw new Error('이미지가 오지 않았습니다. 모델 이름을 확인해 주세요.');
      const inl = img.inlineData || img.inline_data;
      return 'data:' + (inl.mimeType || inl.mime_type || 'image/png') + ';base64,' + (inl.data);
    }catch(e){ lastErr = e; if(!/401|403|429|quota/i.test(e.message)) throw e; }
  }
  throw lastErr;
}

/* 네이버 에디터에 붙여넣을 HTML — 인라인 스타일로 서식을 지킨다 */
function naverHTML(blocks){
  const gap = '<p>&nbsp;</p>';
  return blocks.map(b => {
    switch(b.t){
      case 'h2': return `<p><span style="font-size:19px;"><b>${esc(b.text)}</b></span></p>`;
      case 'h3': return `<p><span style="font-size:16px;"><b>${esc(b.text)}</b></span></p>`;
      case 'ul': return (b.items||[]).map(x=>`<p>· ${mdb(x)}</p>`).join('');
      case 'ol': return (b.items||[]).map((x,i)=>`<p>${i+1}. ${mdb(x)}</p>`).join('');
      case 'quote': return `<p><b>${mdb(b.text)}</b></p>`;
      case 'table': return `<table border="1" style="border-collapse:collapse;width:100%;">
        <thead><tr>${(b.head||[]).map(h=>`<td style="padding:6px;"><b>${esc(h)}</b></td>`).join('')}</tr></thead>
        <tbody>${(b.rows||[]).map(r=>`<tr>${(r||[]).map(c=>`<td style="padding:6px;">${mdb(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      default: return `<p>${mdb(b.text||'')}</p>`;
    }
  }).join(gap);
}
function plainText(blocks){
  return blocks.map(b => {
    switch(b.t){
      case 'ul': case 'ol': return (b.items||[]).join('\n');
      case 'table': return [(b.head||[]).join(' | ')].concat((b.rows||[]).map(r=>(r||[]).join(' | '))).join('\n');
      default: return String(b.text || '').replace(/\*\*/g,'');
    }
  }).join('\n\n');
}
/* 발행용 segments — 사진 자리에서 끊는다 */
function buildSegments(){
  const segs = []; let buf = []; let n = -1;
  const flush = ()=>{ if(buf.length){ segs.push({ html: naverHTML(buf), text: plainText(buf) }); buf = []; } };
  state.post.blocks.forEach(b => {
    if(b.t === 'image'){
      n++;
      if(!state.images[n]) return;          // 사진을 안 넣은 자리는 건너뛴다
      flush(); segs.push({ image: n });
    } else buf.push(b);
  });
  flush();
  return segs;
}

/* 편집한 본문을 blocks로 되돌린다 (사진 자리는 그대로 둔다) */
function syncArticle(){
  const root = $('#article'); if(!root || !state.post) return;
  const out = []; let imgN = -1;
  const slots = imageSlots();
  root.childNodes.forEach(node => {
    if(node.nodeType !== 1){
      const t = (node.textContent||'').trim(); if(t) out.push({ t:'p', text:t });
      return;
    }
    const tag = node.tagName.toLowerCase();
    const txt = (node.innerText||'').trim();
    if(node.classList && node.classList.contains('imgslot')){
      imgN++; const orig = state.post.blocks[slots[imgN]] || {};
      out.push({ t:'image', prompt: orig.prompt || '', caption: orig.caption || '' });
      return;
    }
    if(!txt && tag !== 'table') return;
    if(tag === 'h2') out.push({ t:'h2', text:txt });
    else if(tag === 'h3') out.push({ t:'h3', text:txt });
    else if(tag === 'blockquote') out.push({ t:'quote', text:txt });
    else if(tag === 'ul' || tag === 'ol') out.push({ t:tag, items:[...node.querySelectorAll('li')].map(li=>li.innerText.trim()).filter(Boolean) });
    else if(tag === 'table'){
      const rows = [...node.querySelectorAll('tr')].map(tr => [...tr.children].map(td => td.innerText.trim()));
      if(rows.length) out.push({ t:'table', head: rows[0], rows: rows.slice(1) });
    }
    else out.push({ t:'p', text:txt });
  });
  if(out.length) state.post.blocks = out;
}

function renderTags(){
  const box = $('#tagBox'); if(!box) return;
  box.innerHTML = state.post.tags.map((t,i)=>`<span class="tg">#${esc(t)}<button data-i="${i}">×</button></span>`).join('')
    || '<span style="color:var(--ink3);font-size:12px">태그가 없습니다</span>';
  box.querySelectorAll('button').forEach(b => b.onclick = ()=>{ state.post.tags.splice(+b.dataset.i,1); renderTags(); });
}

  }).join('');

function refreshPreviewImages(){
  const a = $('#article'); if(!a || !state.post) return;
  const slots = [...a.querySelectorAll('.imgslot')];
  slots.forEach((el, n) => {
    const src = state.images[n];
    const cap = el.querySelector('.cap');
    el.innerHTML = (src ? `<img src="${src}">` : `📷 사진 ${n+1} 자리 — 아래 [사진] 칸에서 넣어 주세요`)
      + `<div class="cap">${cap ? cap.innerHTML : ''}</div>`;
  });
}
function uploadPhoto(n){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async ()=>{
    const f = inp.files[0]; if(!f) return;
    try{
      state.images[n] = await shrink(f, 1600);
      state.imgSrc[n] = 'up';
      renderPhotos(); refreshPreviewImages(); toast('사진을 넣었습니다');
    }catch(e){ toast('사진을 읽지 못했습니다: ' + e.message, true); }
  };
  inp.click();
}
function shrink(file, max){
  return new Promise((res, rej)=>{
    const fr = new FileReader();
    fr.onerror = ()=> rej(new Error('파일 읽기 실패'));
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> rej(new Error('이미지 형식이 아닙니다'));
      img.onload = ()=>{
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        const g = c.getContext('2d');
        g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height);
        g.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.88));      // 캔버스를 거치며 위치정보 등은 사라진다
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
async function aiPhoto(n, btn){
  const slots = imageSlots();
  const b = state.post.blocks[slots[n]];
  const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
  try{
    state.images[n] = await genImage(b.prompt || b.caption || state.post.title);
    state.imgSrc[n] = 'ai';
    renderPhotos(); refreshPreviewImages(); toast('AI 사진을 만들었습니다');
  }catch(e){ toast(e.message, true); btn.disabled = false; btn.innerHTML = old; }
}
async function fillAllAi(){
  const slots = imageSlots();
  const btn = $('#btnAllAi'); const old = btn.innerHTML;
  btn.disabled = true;
  for(let n = 0; n < slots.length; n++){
    if(state.images[n]) continue;
    btn.innerHTML = `<span class="spin"></span> ${n+1}/${slots.length}`;
    try{
      const b = state.post.blocks[slots[n]];
      state.images[n] = await genImage(b.prompt || b.caption || state.post.title);
      state.imgSrc[n] = 'ai';
      renderPhotos(); refreshPreviewImages();
    }catch(e){ toast(e.message, true); break; }
  }
  btn.disabled = false; btn.innerHTML = old;
}

  const text = plainText(state.post.blocks.filter(b => b.t !== 'image'));
  try{
    await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], { type:'text/html' }),
      'text/plain': new Blob([text], { type:'text/plain' }),
    })]);
    toast('본문을 복사했습니다. 에디터에 Ctrl+V 하세요. (사진은 직접 넣어 주세요)');
  }catch(e){
    try{ await navigator.clipboard.writeText(text); toast('글자만 복사했습니다'); }
    catch(_){ toast('복사에 실패했습니다', true); }

async function doPublish(){
  if(!state.helper.on){
    return toast('발행 도우미가 꺼져 있습니다. 폴더의 start.bat을 실행해 주세요.', true);
  }
  syncArticle();
  const slots = imageSlots();
  const filled = slots.filter((_, n) => state.images[n]).length;
  const msg = `「${state.post.title}」\n\n` +
    `사진 ${filled}/${slots.length}장 · 태그 ${state.post.tags.length}개 · ` +
    `${$('#pubVis').value === 'private' ? '비공개' : '전체공개'}\n\n` +
    `지금 네이버 블로그에 발행합니다. 크롬 창이 열리면 건드리지 마세요.\n계속할까요?`;
  if(!confirm(msg)) return;

  const btn = $('#btnPublish'); const old = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> 올리는 중…';
  try{
    if(!state.helper.loggedIn){
      btn.innerHTML = '<span class="spin"></span> 네이버 로그인 창…';
      const lr = await fetch(HELPER + '/login', { method:'POST' }).then(r=>r.json());
      if(!lr.ok) throw new Error(lr.error || '로그인에 실패했습니다.');
      await checkHelper();
      btn.innerHTML = '<span class="spin"></span> 올리는 중…';
    }
    const a = state.author;
    const payload = {
      title: state.post.title,
      segments: buildSegments(),
      images: state.images,
      tags: state.post.tags,
      category: $('#pubCat').value.trim(),
      visibility: $('#pubVis').value,
    };
    if($('#pubMap').checked && a.addr) payload.place = { query: a.addr, name: a.office };

    const r = await fetch(HELPER + '/publish', {
      method:'POST', headers:{ 'content-type':'application/json' }, body: JSON.stringify(payload) });
    const d = await r.json();
    if(d.error) throw new Error(d.error + (d.step ? ' (' + d.step + ' 단계)' : ''));
    saveArchive(true, d.url);
    $('#work').insertAdjacentHTML('afterbegin',
      `<div class="notice ok"><b>발행했습니다.</b> ${d.url?`<a href="${esc(d.url)}" target="_blank" rel="noopener">발행된 글 보기 ↗</a>`:''}
       ${d.tags?` · 태그 ${esc(d.tags)}`:''}</div>`);
    $('#workScroll').scrollTop = 0;
    toast('네이버에 발행했습니다');
  }catch(e){
    toast('발행 실패: ' + e.message, true);
  }finally{ btn.disabled = false; btn.innerHTML = old; }
}

/* ---------- 보관함 ---------- */
function saveArchive(silent, url){
  syncArticle();
  const rec = { id: Date.now(), title: state.post.title, meta: state.post.meta,
    blocks: state.post.blocks, tags: state.post.tags, checkFacts: state.post.checkFacts,
    titles: state.post.titles, url: url || '', at: new Date().toISOString() };
  state.archive.unshift(rec);
  if(state.archive.length > 60) state.archive.length = 60;   // 저장 공간 보호 (사진은 저장하지 않음)
  LS.set('archive', state.archive);
  $('#arcCnt').textContent = state.archive.length ? '· ' + state.archive.length : '';
  if(!silent) toast('보관함에 저장했습니다 (사진은 저장되지 않습니다)');
}

    const r0 = $('#modalHost').querySelector('input[name=eng]:checked'); if(r0) s.engine = r0.value;
    LS.set('settings', s);
    const pack = { _:'송도제일 블로그 스튜디오 설정', at:new Date().toISOString(),
      author: state.author, settings: s, mine: state.mine };
    const url = URL.createObjectURL(new Blob([JSON.stringify(pack, null, 1)], { type:'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = '블로그스튜디오_설정.json'; a.click();
    setTimeout(()=> URL.revokeObjectURL(url), 3000);
    toast('설정 파일을 내려받았습니다');
  };
  $('#modalHost').querySelector('[data-import]').onclick = ()=>{
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = ()=>{
      const f = inp.files[0]; if(!f) return;
      const fr = new FileReader();
      fr.onload = ()=>{
        try{
          const p = JSON.parse(fr.result);
          if(p.author) state.author = Object.assign({}, DEF_AUTHOR, p.author);
          if(p.settings) state.settings = Object.assign({}, DEF_SETTINGS, p.settings);
          if(Array.isArray(p.mine)) state.mine = p.mine;
          LS.set('author', state.author); LS.set('settings', state.settings); LS.set('mine', state.mine);
          $('#authorTxt').textContent = state.author.name || '작성자 정보';
          refreshEngineChip(); renderCats(); renderTopics();
          close(); toast('설정을 가져왔습니다');
        }catch(e){ toast('설정 파일을 읽지 못했습니다', true); }
      };
      fr.readAsText(f);
    };
    inp.click();
  };
  $('#modalHost').querySelector('[data-save]').onclick = ()=>{
    $('#modalHost').querySelectorAll('[data-k]').forEach(i => s[i.dataset.k] = i.value.trim());
    const r = $('#modalHost').querySelector('input[name=eng]:checked'); if(r) s.engine = r.value;
    LS.set('settings', s); refreshEngineChip(); close(); toast('설정을 저장했습니다');
  };
}
function openArchive(){
  const list = state.archive;
  const close = modal('보관함', list.length ? `
    <div style="font-size:12px;color:var(--ink3);margin-bottom:10px">최근 ${list.length}개 · 사진은 저장되지 않습니다</div>
    ${list.map(r=>`<div style="border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px">
      <div style="font-weight:700;font-size:13.5px;letter-spacing:-.02em">${esc(r.title)}</div>
      <div style="font-size:11.5px;color:var(--ink3);margin:3px 0 7px">${new Date(r.at).toLocaleString('ko-KR')}
        ${r.url?` · <a href="${esc(r.url)}" target="_blank" rel="noopener">발행된 글 ↗</a>`:''}</div>
      <button class="btn sm" data-open="${r.id}">불러오기</button>
      <button class="btn sm" data-del="${r.id}">삭제</button>
    </div>`).join('')}
  ` : `<div class="emptynote">아직 저장된 글이 없습니다.</div>`,
  list.length ? `<button class="btn" data-clear>전체 비우기</button>` : '');
  $('#modalHost').querySelectorAll('[data-open]').forEach(b => b.onclick = ()=>{
    const r = state.archive.find(x => x.id === +b.dataset.open);
    state.post = Object.assign({}, r); state.images = {}; state.imgSrc = {};
    close(); renderPost(); toast('불러왔습니다. 사진은 다시 넣어 주세요.');
  });
  $('#modalHost').querySelectorAll('[data-del]').forEach(b => b.onclick = ()=>{
    state.archive = state.archive.filter(x => x.id !== +b.dataset.del);
    LS.set('archive', state.archive); $('#arcCnt').textContent = state.archive.length ? '· '+state.archive.length : '';
    close(); openArchive();
  });
  const c = $('#modalHost').querySelector('[data-clear]');
  if(c) c.onclick = ()=>{ if(confirm('보관함을 모두 비울까요?')){ state.archive = []; LS.set('archive', []);
    $('#arcCnt').textContent = ''; close(); } };
}

/* ============================================================
   7) 시작
   ============================================================ */
function init(){
  renderCats(); renderTopics(); renderPicked(); renderPost();
  refreshEngineChip();
  $('#authorTxt').textContent = state.author.name || '작성자 정보';
  $('#arcCnt').textContent = state.archive.length ? '· ' + state.archive.length : '';

  $('#chipAuthor').onclick = openAuthor;
  $('#chipSettings').onclick = openSettings;
  $('#chipArchive').onclick = openArchive;
  $('#chipHelper').onclick = ()=>{
    checkHelper().then(()=> toast(state.helper.on
      ? '도우미 켜짐 (v' + state.helper.ver + ')' + (state.helper.loggedIn ? ' · 네이버 로그인됨' : ' · 네이버 로그인이 필요합니다')
      : '도우미가 꺼져 있습니다. 폴더의 start.bat을 실행해 주세요.', !state.helper.on));
  };
  $('#btnGen').onclick = generate;
  $('#btnAiTopics').onclick = aiTopics;
  $('#search').oninput = e => { state.search = e.target.value.trim(); state.aiTopics = null; renderTopics(); };
  $('#btnUseOwn').onclick = ()=>{
    const t = $('#ownTopic').value.trim(); if(!t) return toast('주제를 입력해 주세요.', true);
    pick({ t, k: $('#ownKeys').value.trim(), cat:'직접 입력' }); toast('주제를 정했습니다. [생성하기]를 누르세요.');
  };
  $('#btnSaveOwn').onclick = ()=>{
    const t = $('#ownTopic').value.trim(); if(!t) return toast('주제를 입력해 주세요.', true);
    if(state.mine.some(m => m.t === t)) return toast('이미 저장된 주제입니다.');
    state.mine.unshift({ t, k: $('#ownKeys').value.trim() }); LS.set('mine', state.mine);
    $('#ownTopic').value = ''; $('#ownKeys').value = '';
    state.cat = 'mine'; state.aiTopics = null; renderCats(); renderTopics(); toast('내 주제에 저장했습니다');
  };
  $('#ownTopic').onkeydown = e => { if(e.key === 'Enter') $('#btnUseOwn').click(); };

  $('#chipFb').onclick = ()=>{
    if(window.blogFbPull) window.blogFbPull().then(()=> toast(fbReady && window._fbDb ? '최신 내용을 불러왔습니다' : 'Firebase에 연결되지 않았습니다', !(fbReady && window._fbDb)));
  };
  checkHelper(); setInterval(checkHelper, 20000);
  /* Firebase 모듈이 아예 못 올라오는 경우(네트워크 차단 등) 대비 */
  setTimeout(()=>{ if(!fbReady){ const t = $('#fbTxt'); if(t){ t.textContent = 'Firebase 오프라인'; $('#chipFb').className = 'chip off'; } } }, 6000);

  /* 처음 켠 분께는 설정부터 */
  if(!keysOf('gemini').length && !keysOf('claude').length) setTimeout(openSettings, 700);
}
init();
</script>

  function injectBar(p){if(document.getElementById("_sda_b"))return;var bar=document.createElement("div");bar.id="_sda_b";bar.style.cssText="position:fixed;top:0;right:0;z-index:9800;display:flex;align-items:center;gap:8px;padding:4px 12px;background:rgba(10,13,20,.93);border-bottom-left-radius:10px;border:1px solid rgba(255,255,255,.08)";var rc=ROLE_COL[p.role]||"#8b95b0";var nm=document.createElement("span");nm.style.cssText="font-size:11px;color:#8b95b0";nm.textContent=(p.name||p.email||"");var bd=document.createElement("span");bd.style.cssText="font-size:10px;font-weight:700;padding:1px 7px;border-radius:8px;background:"+rc+"22;color:"+rc+";border:1px solid "+rc+"44";bd.textContent=(ROLE_LBL[p.role]||p.role);var hub=document.createElement("a");hub.href="sd_hub.html";hub.textContent="허브";hub.style.cssText="color:#4f8ef7;font-size:11px;text-decoration:none;padding:2px 4px";var out=document.createElement("button");out.textContent="로그아웃";out.style.cssText="background:transparent;border:none;color:#556688;font-size:11px;cursor:pointer;padding:2px 4px";out.onclick=function(){try{localStorage.removeItem("sd_auth_session");}catch(e){}window.location.href="sd_hub.html";};bar.appendChild(nm);if(p.role==='master')bar.appendChild(bd);bar.appendChild(hub);bar.appendChild(out);document.body.appendChild(bar);}
  function enterPage(p){window._authProfile=p;window._authPerms=p.permissions||{};hideCover();injectBar(p);}
  var _session=null;
  try{var _s=localStorage.getItem("sd_auth_session");if(_s){var _d=JSON.parse(_s);if(_d&&_d.ts&&(Date.now()-_d.ts)<SESSION_MS&&_d.role){_session=_d;}}}catch(e){}
  if(_session){var _scr=((_session.permissions||{}).screens)||{};if(_scr["sd_blog"]===false){hideCover();alert("접근 권한이 없습니다.");window.location.href="sd_hub.html";}else{enterPage(_session);}}else{hideCover();window.location.href="sd_hub.html";}
})();
