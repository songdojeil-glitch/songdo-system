<style>
:root{
  --bg:#faf8f5; --panel:#ffffff; --line:#e7e0d7; --line2:#f0ebe4;
  --ink:#2c2724; --ink2:#6b625a; --ink3:#9a9088;
  --accent:#c1622f; --accent-soft:#fdf1e9; --accent-line:#efc9ae;
  --ok:#2f7d4f; --ok-soft:#eef7f1; --warn:#b0500f; --warn-soft:#fdf3e7;
  --danger:#b3342c;
  --r:10px; --sh:0 1px 2px rgba(44,39,36,.05), 0 4px 14px rgba(44,39,36,.05);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
  font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--accent)}

/* ---------- layout ---------- */
.app{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
/* ── SJRWS 공통 헤더·네비 ── */
body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
html{--ui-scale:1}   /* 본문 배율 없음 — 공통 머리줄만 🔍 배율로 (sjb) */
.sjd-head{flex:0 0 auto;background:#fff;padding:12px 18px 10px;border-bottom:1px solid var(--line2)}
.sjd-head .bnd{font-size:12.5px;color:#666;margin:0 0 2px}
.sjd-head .bnd b{color:#1a2035;letter-spacing:.3px;font-weight:800}
.sjd-head .bnd span{font-size:10.5px;color:#999}
.sjd-head h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.02em}
.sjd-head h1 small{font-size:12.5px;color:#666;font-weight:400;margin-left:8px}
.sjd-nav{flex:0 0 auto;background:#f8f8f6;border-bottom:.5px solid #e0e0e0;
  padding:8px 16px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sjd-nav a{padding:5px 10px;border-radius:20px;font-size:11px;text-decoration:none;white-space:nowrap}
@media (max-width:760px){ .sjd-head{padding:10px 14px 8px} .sjd-head h1{font-size:16px} .sjd-head h1 small{display:none} }
header.top{display:flex;align-items:center;gap:14px;padding:0 18px;height:52px;flex:0 0 52px;
  background:var(--panel);border-bottom:1px solid var(--line);z-index:20}
.brand{display:flex;align-items:baseline;gap:9px;font-weight:800;font-size:15.5px;letter-spacing:-.02em}
.brand small{font-weight:500;font-size:11.5px;color:var(--ink3);letter-spacing:0}
.top .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--line);
  border-radius:999px;font-size:12.5px;color:var(--ink2);background:#fff;white-space:nowrap}
.chip:hover{border-color:var(--accent-line);color:var(--accent)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:#cfc7bd;flex:0 0 7px}
.chip.on .dot{background:var(--ok)}
.chip.off .dot{background:#d6a0a0}
.chip.accent{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:600}

.main{flex:1;display:flex;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;background:var(--panel)}
#colCat{flex:0 0 196px;border-right:1px solid var(--line)}
#colTopic{flex:0 0 320px;border-right:1px solid var(--line)}
#colWork{flex:1;background:var(--bg);min-width:0}
.colhead{flex:0 0 auto;padding:12px 14px 10px;border-bottom:1px solid var(--line2)}
.colhead h2{margin:0;font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.06em}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.scroll::-webkit-scrollbar{width:9px}
.scroll::-webkit-scrollbar-thumb{background:#ddd5cb;border-radius:9px;border:3px solid var(--panel)}
#colWork .scroll::-webkit-scrollbar-thumb{border-color:var(--bg)}

/* ---------- categories ---------- */
.cat{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;padding:9px 12px;
  border-left:3px solid transparent;border-bottom:1px solid var(--line2)}
.cat:hover{background:#fcfaf7}
.cat.sel{background:var(--accent-soft);border-left-color:var(--accent)}
.cat .ic{font-size:14px;line-height:1.35;flex:0 0 auto}
.cat > span:last-child{min-width:0}
.cat .nm{display:block;font-weight:600;font-size:13px;letter-spacing:-.01em}
.cat.sel .nm{color:var(--accent)}
.cat .ds{display:block;font-size:11px;color:var(--ink3);margin-top:1px;line-height:1.45}

/* ---------- topics ---------- */
.searchbox{position:relative}
.searchbox input{width:100%;padding:8px 11px 8px 30px;border:1px solid var(--line);border-radius:var(--r);
  background:#fdfcfa;outline:none}
.searchbox input:focus{border-color:var(--accent-line);background:#fff}
.searchbox .mag{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:13px}
.addbox{padding:11px 14px;border-bottom:1px solid var(--line2);background:#fcfaf7}
.addbox input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none;margin-bottom:6px}
.addbox input:focus{border-color:var(--accent-line)}
.addrow{display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 13px;border-radius:8px;
  border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.btn:hover{border-color:var(--accent-line);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#a9542a;color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 9px;font-size:11.5px;font-weight:500}
.btn.wide{width:100%}

.topic{display:flex;gap:10px;width:100%;text-align:left;padding:9px 13px;border-bottom:1px solid var(--line2);align-items:flex-start}
.topic:hover{background:#fcfaf7}
.topic.sel{background:var(--accent-soft)}
.topic .no{flex:0 0 20px;font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums;padding-top:2px;font-weight:600}
.topic.sel .no{color:var(--accent)}
.topic .tt{display:block;font-size:12.8px;line-height:1.5;letter-spacing:-.012em}
.topic.sel .tt{font-weight:600;color:var(--accent)}
.topic .kk{display:block;font-size:10.5px;color:var(--ink3);margin-top:2px;line-height:1.4}
.topic .star{flex:0 0 auto;color:var(--ink3);font-size:11px;opacity:0;padding-top:2px}
.topic:hover .star{opacity:.7}
.topic .star.on{opacity:1;color:var(--accent)}
.emptynote{padding:26px 16px;text-align:center;color:var(--ink3);font-size:12.5px;line-height:1.8}

/* ---------- work column ---------- */
.bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--panel);
  border-bottom:1px solid var(--line);flex-wrap:wrap;flex:0 0 auto}
.bar select{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12.5px;outline:none}
.bar select:focus{border-color:var(--accent-line)}
.bar .lbl{font-size:11.5px;color:var(--ink3);font-weight:600}
.picked{flex:0 0 auto;max-width:100%;padding:9px 16px;background:var(--accent-soft);border-bottom:1px solid var(--accent-line);
  font-size:13px;display:flex;align-items:center;gap:9px}
.picked b{font-weight:700;letter-spacing:-.015em}
.nwbox{padding:9px 16px 11px;background:#fbfaf6;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.nwadd{padding:10px 14px 12px;background:#f6f8fc;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:12px}
.nwadd .nwah{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--ink2)}
.nwadd label{font-size:11px;color:var(--ink3);font-weight:600;margin-top:2px}
.nwadd input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:12.5px;background:#fff}
.nwadd .nw2{display:flex;gap:6px}.nwadd .nw2>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.nwadd .nwbt{display:flex;gap:6px;justify-content:flex-end;margin-top:4px}
.nwadd .hint{font-size:11px;color:var(--ink3);line-height:1.5}
.nwadd .err{color:#b42318;font-size:11.5px}
.nwbox .nwsrc{color:var(--ink2)}.nwbox .nwsrc a{color:var(--accent);font-weight:700}
.nwbox .nwrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.nwbox .hint{font-size:11.5px;color:var(--ink3)}
.nwbox textarea,.nwbox input{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:12.5px;line-height:1.55;background:#fff;resize:vertical}
.picked .tag{font-size:11px;color:var(--accent);background:#fff;border:1px solid var(--accent-line);
  padding:1px 7px;border-radius:999px;white-space:nowrap}

.wrap{max-width:840px;margin:0 auto;padding:20px 22px 90px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.card > h3{margin:0;padding:11px 15px;font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.05em;
  border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px}
.card > h3 .r{margin-left:auto;display:flex;gap:6px}
.card .body{padding:14px 15px}

.titleopts{display:grid;grid-template-columns:1fr;gap:0}
.titleopt{display:flex;gap:10px;align-items:flex-start;padding:9px 15px;border-bottom:1px solid var(--line2);text-align:left;width:100%}
.titleopt:last-child{border-bottom:none}
.titleopt:hover{background:#fcfaf7}
.titleopt.sel{background:var(--accent-soft)}
.titleopt .rd{flex:0 0 15px;height:15px;border:1.5px solid #cfc7bd;border-radius:50%;margin-top:3px;position:relative}
.titleopt.sel .rd{border-color:var(--accent)}
.titleopt.sel .rd:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.titleopt .tx{display:block;font-size:14px;font-weight:600;letter-spacing:-.02em;line-height:1.5}
.titleopt .ln{display:block;font-size:10.5px;color:var(--ink3);margin-top:2px}

/* article preview */
.article{padding:22px 26px;font-size:14.5px;line-height:1.95;letter-spacing:-.01em;outline:none}
.article:focus{background:#fffdfa}
.article h2{font-size:18px;font-weight:800;margin:30px 0 10px;letter-spacing:-.025em;line-height:1.45}
.article h2:first-child{margin-top:0}
.article h3{font-size:15.5px;font-weight:700;margin:22px 0 7px;letter-spacing:-.02em}
.article p{margin:0 0 15px}
.article ul,.article ol{margin:0 0 15px;padding-left:20px}
.article li{margin-bottom:5px}
.article blockquote{margin:18px 0;padding:12px 16px;background:var(--accent-soft);
  border-left:3px solid var(--accent);border-radius:0 8px 8px 0;font-weight:600;color:#8a441f}
.article table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13px}
.article th,.article td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.article th{background:#f7f3ee;font-weight:700}
.article .imgslot{margin:18px 0;border:1.5px dashed var(--accent-line);border-radius:10px;background:#fdfaf7;
  padding:14px;text-align:center;color:var(--ink3);font-size:12.5px}
.article .imgslot img{max-width:100%;border-radius:8px;display:block;margin:0 auto 8px}
.article .imgslot .cap{font-size:11.5px;color:var(--ink3)}

/* photos */
.photolist{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:11px}
.imgbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:12px;color:var(--ink2)}
.imgbar select{padding:5px 8px;border:1px solid var(--line);border-radius:7px;font-size:12px;font-family:inherit;margin-left:4px}
.imgbar .hint{font-size:11.5px;color:var(--ink3)}
.photo .stysel{width:100%;padding:4px 6px;border:1px solid var(--line);border-radius:6px;font-size:11px;font-family:inherit;margin-bottom:5px;background:#fff}
.photo .pdesc{margin-bottom:6px}.photo .pdesc summary{cursor:pointer;font-size:11px;color:var(--ink3)}
.photo .pdesc textarea{width:100%;margin-top:4px;padding:5px 7px;border:1px solid var(--line);border-radius:6px;font-size:11px;font-family:inherit;resize:vertical}
.photo{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fdfcfa;display:flex;flex-direction:column}
.photo .ph{aspect-ratio:4/3;background:#f4efe9;display:flex;align-items:center;justify-content:center;
  color:var(--ink3);font-size:11.5px;text-align:center;padding:8px;position:relative;overflow:hidden}
.photo .ph img{width:100%;height:100%;object-fit:cover;display:block}
.photo .ph .badge{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;
  padding:2px 6px;border-radius:5px}
.photo .meta{padding:8px 9px;font-size:11.5px;color:var(--ink2);border-top:1px solid var(--line2)}
.photo .meta .cap{display:block;margin-bottom:6px;line-height:1.5;color:var(--ink2);
  min-height:2.2em;max-height:3.4em;overflow:hidden}
.photo .acts{display:flex;gap:5px;flex-wrap:wrap}
.photo .acts .btn{flex:1 1 44%;padding:4px 0;font-size:11px;justify-content:center}

/* facts */
.facts li{margin-bottom:6px;color:var(--warn)}
.facts{margin:0;padding-left:19px}

/* tags */
.tagbox{display:flex;flex-wrap:wrap;gap:6px}
.tagbox .tg{display:inline-flex;align-items:center;gap:5px;background:#f7f3ee;border:1px solid var(--line);
  border-radius:999px;padding:3px 9px;font-size:12px;color:var(--ink2)}
.tagbox .tg button{color:var(--ink3);font-size:13px;line-height:1}
.tagbox .tg button:hover{color:var(--danger)}

/* publish bar */
.pubbar{position:sticky;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);padding:11px 16px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;z-index:10}

/* modal */
.mask{position:fixed;inset:0;background:rgba(44,39,36,.42);display:flex;align-items:center;justify-content:center;
  z-index:100;padding:22px}
.modal{background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.22);width:100%;max-width:560px;
  max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal h3{margin:0;padding:15px 20px;font-size:15px;font-weight:700;border-bottom:1px solid var(--line2);
  display:flex;align-items:center}
.modal h3 button{margin-left:auto;color:var(--ink3);font-size:19px;line-height:1}
.modal .mbody{padding:18px 20px;overflow-y:auto}
.modal .mfoot{padding:12px 20px;border-top:1px solid var(--line2);display:flex;gap:8px;justify-content:flex-end;background:#fcfaf7}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:5px}
.field .hint{font-size:11px;color:var(--ink3);font-weight:400;margin-top:4px;line-height:1.6}
.field input,.field select,.field textarea{width:100%;padding:8px 11px;border:1px solid var(--line);
  border-radius:8px;background:#fdfcfa;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent-line);background:#fff}
.field textarea{resize:vertical;min-height:72px;font-family:ui-monospace,"SFMono-Regular",Menlo,monospace;font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.radios{display:flex;gap:8px}
.radios label{flex:1;border:1px solid var(--line);border-radius:9px;padding:9px 11px;cursor:pointer;
  font-size:12.5px;font-weight:600;text-align:center;background:#fdfcfa}
.radios input{display:none}
.radios input:checked + span{color:var(--accent)}
.radios label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* notice */
.notice{padding:10px 14px;border-radius:9px;font-size:12.5px;line-height:1.7;margin-bottom:13px}
.notice.warn{background:var(--warn-soft);border:1px solid #f0d3af;color:#8a4a13}
.notice.ok{background:var(--ok-soft);border:1px solid #c6e2d1;color:#256341}
.notice b{font-weight:700}

/* toast + busy */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);background:#2c2724;color:#fff;
  padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.22s;z-index:200;max-width:80vw}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.bad{background:var(--danger)}
.spin{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.progress{padding:50px 20px;text-align:center;color:var(--ink2)}
.progress .big{font-size:15px;font-weight:700;margin-bottom:7px}
.progress .sm{font-size:12.5px;color:var(--ink3)}

.blank{padding:70px 26px;text-align:center;color:var(--ink3)}
.blank .ic{font-size:34px;margin-bottom:12px;opacity:.5}
.blank .t1{font-size:15px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.blank .t2{font-size:12.5px;line-height:1.9}

@media (max-width:1100px){
  #colCat{flex:0 0 150px} #colTopic{flex:0 0 250px}
}
textarea.keymask{-webkit-text-security:disc;text-security:disc}
.keyeye{margin-left:8px;border:1px solid var(--line2,#e4e6e1);background:#fff;border-radius:6px;font-size:11px;padding:1px 7px;cursor:pointer;color:#666}
</style>

<script>
/* 제미나이 그림 모델 자동 찾기 (2026-10-05) — 설정한 그림 모델 이름을 구글이 모른다(404 not found)고 하면
   그 열쇠로 「쓸 수 있는 모델 목록」(ListModels)을 받아 그림 모델(이름에 image)을 골라 다시 그린다.
   고른 이름은 공통 설정(localStorage sdbs.settings.geminiImageModel)에 저장 — 블로그·비디오·마케팅·도구가 함께 쓴다 */
window.sdGemImg = window.sdGemImg || (function(){
  var P = {};
  function rank(id){ var v = /gemini-(\d+)(?:\.(\d+))?/i.exec(id), ver = v ? (+v[1]) * 100 + (+(v[2] || 0)) : 0; return ver * 10 + (/flash/i.test(id) ? 4 : 0) + (/preview|exp/i.test(id) ? 0 : 2); }
  function find(key){
    if(P[key]) return P[key];
    P[key] = fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=' + encodeURIComponent(key)).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){
      if(!r.ok) throw new Error('쓸 수 있는 모델 목록을 받지 못했습니다 ' + r.status + ': ' + String((d.error && d.error.message) || '').slice(0, 120));
      var ids = (d.models || []).filter(function(m){ return (m.supportedGenerationMethods || []).indexOf('generateContent') >= 0; }).map(function(m){ return String(m.name || '').replace(/^models\//, ''); })
        .filter(function(id){ return /gemini/i.test(id) && /image/i.test(id) && !/tts|embedding/i.test(id); });
      if(!ids.length) throw new Error('이 제미나이 열쇠로 쓸 수 있는 그림 모델이 없습니다 — Google AI Studio 에서 결제·사용 가능 모델을 확인해 주세요');
      ids.sort(function(a, b){ return rank(b) - rank(a); }); return ids[0];
    }); });
    P[key].catch(function(){ delete P[key]; });
    return P[key];
  }
  function missing(status, msg){ return status === 404 || /is not found|not supported for generateContent|no longer available|does not exist/i.test(msg || ''); }
  /* 저장 — 바뀌었으면 true */
  function remember(id){ try{ var s = JSON.parse(localStorage.getItem('sdbs.settings') || '{}') || {}; if(s.geminiImageModel === id) return false; s.geminiImageModel = id; localStorage.setItem('sdbs.settings', JSON.stringify(s)); return true; }catch(e){ return false; } }
  return { find:find, missing:missing, remember:remember, rank:rank };
})();
</script>
<script>
"use strict";
/* ============================================================
   송도제일 블로그 스튜디오
   - 글 생성: 제미나이 / 클로드 (브라우저에서 내 API 키로 직접 호출, 키는 이 브라우저에만 저장)
   - 사진: 내 사진 업로드 + AI 이미지 생성(제미나이)
   - 발행: 같은 폴더의 MR.K 네이버 발행 도우미(127.0.0.1:3777)로 전달
   ============================================================ */

/* ---------- 저장소 ---------- */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('sdbs.'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){
    try{ localStorage.setItem('sdbs.'+k, JSON.stringify(v)); }
    catch(e){ toast('저장 공간이 가득 찼습니다. 보관함을 비워 주세요.', true); }
    if(FB_KEYS.indexOf(k) >= 0) fbPush(k, v);
  },
};

/* ── Firebase 동기화 ──────────────────────────────────────────────
   작성자 정보·내 주제·보관함은 다른 SJRWS 시스템과 같은 Firebase 에 저장한다.
   집 PC 에서 저장하면 사무실 PC 에도 그대로 보인다.
   API 키는 여기에 넣지 않는다 — 이 브라우저에만 남는다. */
const FB_KEYS = ['author', 'mine', 'archive'];
const FB_ROOT = 'sd_blog';
let fbReady = false;

function fbPush(k, v){
  if(!fbReady || !window._fbDb) return;
  try{ window._fbSet(window._fbRef(window._fbDb, FB_ROOT + '/' + k), v); }
  catch(e){ /* 저장 실패해도 localStorage 에는 남아 있다 */ }
}
/* Firebase 준비되면 모듈 스크립트가 부른다 */
window.blogFbPull = async function(){
  fbReady = true;
  if(!window._fbDb) return;
  try{
    const snap = await window._fbGet(window._fbChild(window._fbRef(window._fbDb), FB_ROOT));
    if(!snap.exists()) { FB_KEYS.forEach(k => fbPush(k, state[k])); return; }   // 최초 1회 올려둔다
    const d = snap.val() || {};
    if(d.author) state.author = Object.assign({}, DEF_AUTHOR, d.author);
    if(Array.isArray(d.mine)) state.mine = d.mine;
    if(Array.isArray(d.archive)) state.archive = d.archive;
    FB_KEYS.forEach(k => { try{ localStorage.setItem('sdbs.'+k, JSON.stringify(state[k])); }catch(e){} });
    $('#authorTxt').textContent = state.author.name || '작성자 정보';
    $('#arcCnt').textContent = state.archive.length ? '· ' + state.archive.length : '';
    renderCats(); renderTopics();
    const b = $('#fbTxt'); if(b){ b.textContent = 'Firebase 연결됨'; $('#chipFb').className = 'chip on'; }
  }catch(e){
    const b = $('#fbTxt'); if(b){ b.textContent = 'Firebase 오프라인'; $('#chipFb').className = 'chip off'; }
  }
};

function migrateModels(st){
  let moved = [];
  ['geminiModel','geminiImageModel'].forEach(k=>{

    if(cur && RETIRED_GEMINI[cur]){ moved.push(cur + ' → ' + RETIRED_GEMINI[cur]); st[k] = RETIRED_GEMINI[cur]; }

}

function currentTopics(){
  if(state.search){
    const q = state.search.toLowerCase();
    const out = [];
    allCats().forEach(c => {
      const catHit = c.name.toLowerCase().includes(q);   // 카테고리 이름이 맞으면 그 안의 주제 전부
      c.topics.forEach(t => {
        if(catHit || (t.t + ' ' + (t.k||'')).toLowerCase().includes(q)) out.push(Object.assign({ cat:c.name }, t));
      });
    });
    return out;
  }
  if(state.aiTopics) return state.aiTopics;
  const c = allCats().find(x => x.id === state.cat);
  return c ? c.topics.map(t => Object.assign({ cat:c.name }, t)) : [];
}

  const list = currentTopics();

/* ── 📰 추천 뉴스 (2026-10-08) — 허브 「오늘의 뉴스」에서 ✍️ 로 보낸 기사 (Firebase sd/sd_blog_news/{id})
   허브는 날짜·제목·언론사·주소·분류만 보낸다 (기사 본문은 옮기지 않는다 — 저작권).
   여기서 글을 쓸 때 제미나이가 원문 주소를 직접 읽어(url_context) 「사실 메모」만 만들고,
   글은 그 사실을 바탕으로 공인중개사 관점의 해설로 새로 쓴다. 출처(언론사·날짜·주소)는 글 끝에 밝힌다 ── */
state.news = (function(){ try{ return JSON.parse(localStorage.getItem('sdbs.newsCache') || '[]') || []; }catch(e){ return []; } })();
const NEWS_PATH = 'sd/sd_blog_news';
function newsList(){
  return state.news.slice().sort((a, b) => ((a.status === 'used') - (b.status === 'used')) || String(b.date || '').localeCompare(String(a.date || '')) || (b.at || 0) - (a.at || 0));
}
async function newsLoad(tries){
  tries = tries || 0;
  if(!window._fbDb){ if(tries < 20) setTimeout(() => newsLoad(tries + 1), 500); return; }
  try{
    const snap = await window._fbGet(window._fbRef(window._fbDb, NEWS_PATH));
    const v = snap.exists() ? snap.val() || {} : {};
    state.news = Object.keys(v).map(k => Object.assign({ id:k }, v[k])).filter(x => x && x.t);
    try{ localStorage.setItem('sdbs.newsCache', JSON.stringify(state.news)); }catch(e){}
    renderCats(); if(state.cat === 'news') renderTopics();
    if(state.picked && state.picked.news){ const n = state.news.find(x => x.id === state.picked.news.id); if(n){ state.picked.news = n; } }
  }catch(e){ if(tries < 8) setTimeout(() => newsLoad(tries + 1), 1500); }
}
function newsSet(id, k, v){
  const n = state.news.find(x => x.id === id); if(n){ if(v == null) delete n[k]; else n[k] = v; }
  try{ localStorage.setItem('sdbs.newsCache', JSON.stringify(state.news)); }catch(e){}
  if(!window._fbDb) return Promise.resolve();
  return window._fbSet(window._fbRef(window._fbDb, NEWS_PATH + '/' + id + '/' + k), v == null ? null : v).catch(()=>{});
}
function newsDel(id){
  state.news = state.news.filter(x => x.id !== id);
  try{ localStorage.setItem('sdbs.newsCache', JSON.stringify(state.news)); }catch(e){}
  if(state.picked && state.picked.news && state.picked.news.id === id){ state.picked = null; renderPicked(); }
  renderCats(); renderTopics();
  if(window._fbDb) window._fbSet(window._fbRef(window._fbDb, NEWS_PATH + '/' + id), null).catch(()=>{});
}

function newsNormUrl(u){
  u = String(u || '').trim(); if(!u) return '';
  if(!/^https?:\/\//i.test(u)){ if(/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(u)) u = 'https://' + u; else return ''; }
  try{
    const x = new URL(u);
    ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','fbclid','gclid','ref'].forEach(k => x.searchParams.delete(k));
    if(/(^|\.)naver\.com$/.test(x.hostname)) ['sid','type','lfrom'].forEach(k => x.searchParams.delete(k));
    x.hash = ''; return x.toString();
  }catch(e){ return ''; }
}

function newsGuessPress(url){

    const x = new URL(url), h = x.hostname.replace(/^www\./, '');
    const m = /naver\.com$/.test(h) && (x.pathname.match(/\/article\/(?:\w+\/)?(\d{3})\/\d+/) || [null, x.searchParams.get('oid')]);

/* 제미나이가 원문을 직접 읽어 사실만 메모 — 기사 문장을 옮기지 않는다 */
async function newsFacts(n){
  const keys = keysOf('gemini');
  if(!keys.length) throw new Error('기사 원문 읽기는 제미나이 열쇠가 필요합니다 (오른쪽 위 [엔진 설정]). 열쇠가 없으면 기사를 직접 보고 아래 칸에 핵심을 적어 주세요.');
  const model = state.settings.geminiModel || DEF_SETTINGS.geminiModel;
  const prompt = `다음 뉴스 기사 주소를 직접 열어 읽고, 공인중개사가 블로그 해설 글을 쓰기 위한 「사실 메모」를 만들어 주세요.

기사 주소: ${n.url}
기사 제목: ${n.t}
언론사: ${n.press || ''}  · 날짜: ${n.date || ''}

[규칙 — 저작권]
- 기사 문장을 그대로 옮기지 마세요. 사실(누가·무엇을·언제·얼마·어디)만 짧은 항목으로 자기 말로 적습니다.
- 기사에 없는 내용·추측은 넣지 않습니다. 기자 의견·전망은 「기사 전망:」으로 따로 표시합니다.
- 기사를 열지 못했으면 다른 말 없이 READ_FAIL 한 줄만 쓰세요.

[형식 — 이대로, 한국어]
핵심: (한 줄)
사실:
- (수치·일정·발표 기관·지역 등 5~8개)
기사 전망: (있으면 한두 줄)
송도·연수구 관련: (기사에 나온 것만, 없으면 "기사에 없음")`;
  let last;
  for(const key of keys){
    try{
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`, {
        method:'POST', headers:{ 'content-type':'application/json' },
        body: JSON.stringify({ contents:[{ role:'user', parts:[{ text:prompt }] }], tools:[{ url_context:{} }], generationConfig:{ temperature:0.2, maxOutputTokens:8192 } }) });
      const d = await r.json().catch(()=>({}));
      if(!r.ok){ const em = (d.error && d.error.message) || ''; last = new Error('제미나이 오류 ' + r.status + ': ' + em.slice(0, 160)); if(/401|403|429|quota|API key/i.test(r.status + em)) continue; throw last; }
      const c = (d.candidates || [])[0] || {}, txt = ((c.content || {}).parts || []).filter(p => !p.thought).map(p => p.text || '').join('').trim();
      const meta = (c.urlContextMetadata || c.url_context_metadata || {}).urlMetadata || (c.urlContextMetadata || {}).url_metadata || [];
      const failed = meta.length && meta.every(m => !/SUCCESS/i.test(m.urlRetrievalStatus || m.url_retrieval_status || ''));
      if(!txt || /READ_FAIL/.test(txt) || failed) throw new Error('기사 원문을 읽지 못했습니다 (유료·로그인 기사이거나 사이트가 막았을 수 있습니다). 「원문 ↗」으로 기사를 보고 아래 칸에 핵심 사실을 직접 적어 주세요.');
      return txt;
    }catch(e){ last = e; if(!/401|403|429|quota/i.test(e.message)) throw e; }
  }
  throw last;
}

   2) AI 호출 — 제미나이 / 클로드

function keysOf(engine){
  const raw = engine === 'claude' ? state.settings.claudeKeys
            : engine === 'openai' ? state.settings.openaiKeys
            : engine === 'grok' ? state.settings.grokKeys
            : state.settings.geminiKeys;
  return String(raw || '').split(/[\n,]/).map(s => s.trim()).filter(Boolean);
}
function engineLabel(){
  const e = state.settings.engine;
  const n = keysOf(e).length;
  return (e === 'claude' ? '클로드로 씀' : e === 'openai' ? '챗GPT로 씀' : '제미나이로 씀') + ' · 키 ' + n + '개';
}
function refreshEngineChip(){
  const n = keysOf(state.settings.engine).length;
  $('#engineTxt').textContent = engineLabel();
  $('#chipSettings').className = 'chip accent ' + (n ? 'on' : 'off');
}

/* dataURL → { mime, b64 } — 사진을 AI 에 실어 보낼 때 쓴다 */
function dataUrlParts(u){
  const m = /^data:([^;]+);base64,(.+)$/.exec(String(u||''));
  return m ? { mime:m[1], b64:m[2] } : null;
}
async function callAI(prompt, { json = false, maxTokens = 8192, images = [] } = {}){
  const engine = state.settings.engine;
  const keys = keysOf(engine);
  if(!keys.length) throw new Error((engine==='claude'?'클로드':engine==='openai'?'챗GPT':'제미나이') + ' API 키가 없습니다. 오른쪽 위 [엔진 설정]에서 키를 넣어 주세요.');
  let lastErr;
  for(const key of keys){
    try{
      return engine === 'claude' ? await callClaude(key, prompt, json, maxTokens, images)
           : engine === 'openai' ? await callOpenAI(key, prompt, json, maxTokens, images)
           : await callGemini(key, prompt, json, maxTokens, images);
    }catch(e){
      lastErr = e;
      /* 키 문제·한도 초과면 다음 키로 넘어간다 */
      if(!/401|403|429|한도|quota|invalid/i.test(e.message)) throw e;
    }
  }
  throw lastErr;
}
function geminiBillHint(status, msg){
  if(status !== 429 && !/quota|credit|billing|exceeded/i.test(msg||'')) return '';
  if(/credit|prepay|billing/i.test(msg||''))
    return '\n\n구글 제미나이의 선불 크레딧이 다 떨어졌습니다. 프로그램 문제가 아닙니다.'
      + '\n· ai.studio/projects 에서 결제 수단을 등록하거나 크레딧을 채우면 다시 됩니다.'
      + '\n· 당장 글을 써야 하면 [엔진 설정]에서 엔진을 「클로드」나 「챗GPT」로 바꿔 주세요.';
  return '\n\n잠시 요청이 몰렸습니다. 1~2분 뒤에 다시 [생성하기]를 눌러 주세요.';
}
function geminiModelHint(status, msg){

  const m = /models\/([\w.-]+)/.exec(msg||'');

async function fetchGeminiModels(key){
  const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=' + encodeURIComponent(key));
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error('모델 목록을 받지 못했습니다 ' + r.status + ': ' + ((d.error && d.error.message)||'').slice(0,160));
  const all = (d.models||[]).map(m => ({
    id: String(m.name||'').replace(/^models\//,''),

  })).filter(m => m.id && m.methods.indexOf('generateContent') >= 0);
  return {
    text: all.filter(m => !/image|vision|embedding|aqa|tts/i.test(m.id)).map(m=>m.id),
    image: all.filter(m => /image/i.test(m.id)).map(m=>m.id),

async function callOpenAI(key, prompt, json, maxTokens, images){
  const model = state.settings.openaiModel || DEF_SETTINGS.openaiModel;
  let content = prompt;
  if((images||[]).length){
    content = [{ type:'text', text: prompt }];
    (images||[]).forEach(u => { if(dataUrlParts(u)) content.push({ type:'image_url', image_url:{ url:u } }); });
  }
  async function ask(tokenField){
    const body = { model, messages:[{ role:'user', content }] };
    body[tokenField] = Math.min(maxTokens, 16000);
    if(json) body.response_format = { type:'json_object' };
    const r = await fetch('https://api.openai.com/v1/chat/completions', {
      method:'POST', headers:{ 'content-type':'application/json', 'authorization':'Bearer ' + key },
      body: JSON.stringify(body) });
    const d = await r.json().catch(()=>({}));
    return { ok:r.ok, status:r.status, d };
  }
  /* 신형 모델은 max_completion_tokens, 구형은 max_tokens 를 쓴다 — 거부되면 바꿔서 한 번 더 */
  let res = await ask('max_completion_tokens');
  if(!res.ok && /max_completion_tokens|max_tokens|Unsupported parameter/i.test(((res.d.error||{}).message)||''))
    res = await ask('max_tokens');
  if(!res.ok){
    const em = ((res.d.error||{}).message) || '';
    let hint = '';
    if(res.status === 404 || /does not exist|model/i.test(em))
      hint = '\n\n모델 이름을 확인해 주세요. [엔진 설정]의 「사용 가능한 챗GPT 모델 불러오기」를 누르면 목록이 나옵니다.';
    if(res.status === 429 || /quota|billing/i.test(em))
      hint = '\n\n챗GPT 사용 한도이거나 결제가 필요합니다. platform.openai.com 에서 확인해 주세요.';
    throw new Error('챗GPT 오류 ' + res.status + ': ' + em.slice(0,200) + hint);
  }
  const txt = (((res.d.choices||[])[0]||{}).message||{}).content || '';
  if(!txt.trim()) throw new Error('챗GPT가 빈 응답을 보냈습니다. 잠시 후 다시 해 주세요.');
  return txt.trim();
}
async function fetchOpenAIModels(key){
  const r = await fetch('https://api.openai.com/v1/models', { headers:{ 'authorization':'Bearer ' + key } });
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error('모델 목록을 받지 못했습니다 ' + r.status + ': ' + (((d.error||{}).message)||'').slice(0,160));
  return (d.data||[]).map(m=>m.id).filter(id=>/^(gpt|o\d|chatgpt)/i.test(id) && !/audio|realtime|image|tts|whisper|embedding|moderation/i.test(id)).sort();
}
async function fetchClaudeModels(key){
  const r = await fetch('https://api.anthropic.com/v1/models?limit=100', { headers:{
    'x-api-key': key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' } });
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error('모델 목록을 받지 못했습니다 ' + r.status + ': ' + (((d.error||{}).message)||'').slice(0,160));

/* 설정 창의 「사용 가능한 모델 불러오기」 단추 공통 — 누르면 목록, 목록을 누르면 칸에 채움 */
function wireModelButton(host, o){

    /* 제미나이 3 계열은 생각(thinking)에 쓴 토큰도 이 한도에 들어간다 — 답이 중간에 끊기지 않게 여유를 둔다 (쓴 만큼만 과금) */

  if(json) body.generationConfig.responseMimeType = 'application/json';

  const parts = (((d.candidates||[])[0]||{}).content||{}).parts || [];
  const txt = parts.filter(p => !p.thought).map(p => p.text || '').join('').trim();
  if(!txt) throw new Error('제미나이가 빈 응답을 보냈습니다. 잠시 후 다시 해 주세요.');

function parseJSON(txt){
  let s = String(txt).trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
  try{ return JSON.parse(s); }catch(e){}
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if(a >= 0 && b > a){ try{ return JSON.parse(s.slice(a, b+1)); }catch(e){} }
  /* 응답이 길이 한도에 걸려 중간에 끊긴 경우 — 마지막으로 온전히 닫힌 곳까지만 살린다 */
  if(a >= 0){ const fixed = repairCutJSON(s.slice(a)); if(fixed){ try{ const o = JSON.parse(fixed); try{ Object.defineProperty(o, '_cut', { value:true }); }catch(_){} return o; }catch(e){} } }
  throw new Error('AI 응답을 읽지 못했습니다. 한 번 더 눌러 주세요.');
}
/* 끊긴 JSON 살리기 — 문자열 밖에서 } 나 ] 로 닫힌 마지막 자리까지 자르고, 남은 괄호를 닫는다 */
function repairCutJSON(s){
  let st = [], inStr = false, esc = false, cut = -1, snap = null;
  for(let i = 0; i < s.length; i++){
    const ch = s[i];
    if(inStr){ if(esc) esc = false; else if(ch === '\\') esc = true; else if(ch === '"') inStr = false; continue; }
    if(ch === '"') inStr = true;
    else if(ch === '{' || ch === '[') st.push(ch);
    else if(ch === '}' || ch === ']'){ st.pop(); cut = i + 1; snap = st.slice(); if(!st.length) return s.slice(0, cut); }
  }
  if(cut < 0) return '';
  let body = s.slice(0, cut).replace(/,\s*$/, '');
  for(let j = snap.length - 1; j >= 0; j--) body += snap[j] === '{' ? '}' : ']';
  return body;
}

async function genImageOpenAI(full){
  const keys = keysOf('openai'); if(!keys.length) throw new Error('OpenAI 키가 없습니다. [엔진 설정]에서 넣어 주세요.');

      body: JSON.stringify({ model:m, prompt:full, size:'1536x1024', n:1 }) });
    const d = await r.json().catch(()=>({}));
    if(r.ok && d.data && d.data[0]){ const b = d.data[0].b64_json; if(b) return await shrinkData('data:image/png;base64,' + b, 1600); if(d.data[0].url) return d.data[0].url; }
    const em = (d.error && d.error.message) || '';
    last = new Error(r.status === 401 ? 'OpenAI 키가 맞지 않습니다' : /verif/i.test(em) ? 'OpenAI 계정의 조직 인증(Verify Organization)이 필요합니다' : /billing|quota|credit/i.test(em) ? 'OpenAI 크레딧이 없습니다' : 'OpenAI 오류 ' + r.status + ': ' + em.slice(0, 160));

async function genImageGrok(full){

    const em = String((d.error && (d.error.message || d.error)) || d.error || '');

/* 큰 그림을 긴 변 max 의 JPEG 로 (발행 용량을 줄인다) */
function shrinkData(u, max){
  return new Promise(res => { const im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.9)); }; im.onerror = () => res(u); im.src = u; });
}

/* 단지 사전 — 데이터관리에서 만든 sd_apt.json 을 같이 쓴다.
   주소만 넣으면 세대수·준공·관리비가 재료에 저절로 붙는다. */
let APT = null, APTQ = null;
function aptLoad(){
  if(APT) return Promise.resolve(APT);
  if(APTQ) return APTQ;
  APTQ = fetch('sd_apt.json', { cache:'no-cache' })
    .then(r => r.ok ? r.json() : null)
    .then(j => (APT = j || { apt:{}, jidx:{}, nidx:{} }))
    .catch(()=> (APT = { apt:{}, jidx:{}, nidx:{} }));
  return APTQ;
}
function aptNorm(x){
  let t = String(x||'').replace(/\s+/g,'');
  while(/(아파트|단지)$/.test(t)) t = t.replace(/(아파트|단지)$/,'');
  return t;
}
/* 주소 한 줄에서 법정동·지번·단지명을 훑어 사전에서 찾는다 */
function aptFromAddr(addr){
  if(!APT) return null;
  const a = String(addr||'').trim();
  const jb = a.match(/(\S+동)\s+(\d+(?:-\d+)?)/);
  if(jb){
    const c = APT.jidx[jb[1] + '|' + jb[2]];
    if(c && APT.apt[c]) return APT.apt[c];
  }
  const keys = Object.keys(APT.nidx || {});
  const flat = aptNorm(a);
  let best = null;
  keys.forEach(k => { if(k && flat.indexOf(k) >= 0 && (!best || k.length > best.length)) best = k; });
  return best ? APT.apt[APT.nidx[best]] : null;
}
/* 단지 제원·관리비를 사람이 읽는 줄글로 — 그대로 재료가 된다 */
function aptFacts(o){
  if(!o) return '';
  const L = ['[단지 자료 — 공동주택관리정보시스템(K-apt)]'];
  L.push('단지명: ' + o.n);
  L.push('주소: ' + o.d + ' ' + ((o.j||[])[0] || ''));
  if(o.y) L.push('사용승인일: ' + String(o.y).slice(0,7).replace('-','.'));
  L.push('규모: ' + o.h.toLocaleString() + '세대' + (o.b ? ' / ' + o.b + '개동' : ''));
  if(o.heat) L.push('난방: ' + o.heat);
  if(o.cls)  L.push('분류: ' + o.cls);
  if(o.fee && o.k){
    const f = o.fee, ym = f.ym.slice(0,4) + '.' + f.ym.slice(4);
    const at = sq => Math.round(f.pub * sq * o.k / 100) * 100;
    const lt = sq => Math.round(f.ltr * sq * o.k / 100) * 100;
    L.push('관리비(' + ym + ' 기준, 관리비부과면적 ㎡당): 공용 ' + Math.round(f.pub).toLocaleString()
           + '원 / 장기수선충당금 ' + Math.round(f.ltr).toLocaleString() + '원');
    L.push('전용 59㎡ 기준 월 공용관리비 약 ' + at(59).toLocaleString()
           + '원 + 장기수선충당금 약 ' + lt(59).toLocaleString() + '원');
    L.push('전용 84㎡ 기준 월 공용관리비 약 ' + at(84).toLocaleString()
           + '원 + 장기수선충당금 약 ' + lt(84).toLocaleString() + '원');
    L.push('장기수선충당금 적립액: ' + (f.bal/1e8).toFixed(1) + '억원');
    L.push('※ 개별관리비(난방·전기·수도)는 쓰는 만큼이라 위 금액에 빠져 있음');
  }
  return L.join('\n');
}

    for(const it of its) if(it.kind === 'file'){ const f = it.getAsFile(); if(f) fs.push(f); }
    if(fs.length){ e.preventDefault(); scriptTakeFiles(fs); }

  function grab(){
    script.text = ta.value;

    script.dong = host.querySelector('#scriptDong').value.trim();
    script.ho   = host.querySelector('#scriptHo').value.trim();

        + miss.map(x=>'· '+x.n).join('\n')

    close(); generateFromScript();
  };
}

async function generateFromScript(){
  if(state.busy) return;
  state.busy = true; $('#btnGen').disabled = true;
  $('#pubbar').style.display = 'none';
  const n = script.imgs.length;
  $('#work').innerHTML = `<div class="card"><div class="progress">
      <div class="big"><span class="spin"></span> 넣어 주신 재료로 글을 쓰고 있습니다</div>
      <div class="sm">${esc((KIND_LABEL[script.kind]||['글'])[0])}${n ? ' · 사진 ' + n + '장 읽는 중' : ''}<br>
        보통 30~90초 걸립니다. 창을 닫지 마세요.</div></div></div>`;
  try{
    const raw = await callAI(scriptPrompt(), { json:true, maxTokens:16000, images: script.imgs });
    const d = parseJSON(raw);
    if(!d.blocks || !d.blocks.length) throw new Error('본문이 비어 있습니다. 한 번 더 눌러 주세요.');

    /* 넣은 사진을 본문 사진 자리에 그대로 앉힌다 */
    state.images = {}; state.imgSrc = {}; state.imgSty = {};
    let slot = 0;
    d.blocks.forEach(b => {
      if(b && b.t === 'image'){
        const want = Math.max(1, Math.min(n, parseInt(b.slot, 10) || (slot + 1))) - 1;
        if(script.imgs[want]){ state.images[slot] = script.imgs[want]; state.imgSrc[slot] = 'up'; }
        slot++;
      }
    });

    state.picked = { t: (d.titles||[])[0] || '대본으로 만든 글', k:'', cat:'script' };
    state.post = {
      titles: (d.titles||[]).filter(Boolean).slice(0, 8),
      title: (d.titles||[])[0] || '대본으로 만든 글',
      meta: d.meta || '',
      blocks: d.blocks,
      tags: (d.tags||[]).map(t => String(t).replace(/^#/, '').trim()).filter(Boolean).slice(0, 25),
      checkFacts: d.checkFacts || [],
      titleKinds: (d.titleKinds||[]).map(x=>String(x)),
      coreKeywords: (d.coreKeywords||[]).map(x=>String(x)).filter(Boolean).slice(0,5),
      longTail: (d.longTail||[]).map(x=>String(x)).filter(Boolean).slice(0,6),
      nextPosts: (d.nextPosts||[]).filter(x=>x&&x.t).slice(0,3),
      at: Date.now(),
    };
    renderPost(); refreshPreviewImages();
    toast(n ? '글이 나왔습니다. 넣어 주신 사진이 본문에 들어갔습니다.' : '글이 나왔습니다.');
  }catch(e){
    $('#work').innerHTML = `<div class="card"><div class="body">
      <div class="notice warn"><b>글을 만들지 못했습니다.</b><br>${esc(e.message)}</div>
      <button class="btn primary" onclick="openScript()">재료 다시 보기</button></div></div>`;
  }finally{
    state.busy = false; $('#btnGen').disabled = false;
  }
}

const mdb = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
function imageSlots(){
  const out = [];
  (state.post ? state.post.blocks : []).forEach((b, i) => { if(b.t === 'image') out.push(i); });
  return out;
}
/* 미리보기용 HTML */
function previewHTML(){
  const slots = imageSlots();
  return state.post.blocks.map((b, i) => {
    switch(b.t){
      case 'h2': return `<h2>${esc(b.text)}</h2>`;
      case 'h3': return `<h3>${esc(b.text)}</h3>`;
      case 'ul': return `<ul>${(b.items||[]).map(x=>`<li>${mdb(x)}</li>`).join('')}</ul>`;
      case 'ol': return `<ol>${(b.items||[]).map(x=>`<li>${mdb(x)}</li>`).join('')}</ol>`;
      case 'quote': return `<blockquote>${mdb(b.text)}</blockquote>`;
      case 'table': return `<table><thead><tr>${(b.head||[]).map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
        <tbody>${(b.rows||[]).map(r=>`<tr>${(r||[]).map(c=>`<td>${mdb(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      case 'image': {
        const n = slots.indexOf(i);
        const src = state.images[n];
        return `<div class="imgslot" contenteditable="false">${src?`<img src="${src}">`:`📷 사진 ${n+1} 자리 — 아래 [사진] 칸에서 넣어 주세요`}
          <div class="cap">${esc(b.caption||'')}</div></div>`;
      }
      default: return `<p>${mdb(b.text||'')}</p>`;
    }
  }).join('');
}
/* 네이버 에디터에 붙여넣을 HTML — 인라인 스타일로 서식을 지킨다 */
function naverHTML(blocks){
  const gap = '<p>&nbsp;</p>';
  return blocks.map(b => {
    switch(b.t){
      case 'h2': return `<p><span style="font-size:19px;"><b>${esc(b.text)}</b></span></p>`;
      case 'h3': return `<p><span style="font-size:16px;"><b>${esc(b.text)}</b></span></p>`;
      case 'ul': return (b.items||[]).map(x=>`<p>· ${mdb(x)}</p>`).join('');
      case 'ol': return (b.items||[]).map((x,i)=>`<p>${i+1}. ${mdb(x)}</p>`).join('');
      case 'quote': return `<p><b>${mdb(b.text)}</b></p>`;
      case 'table': return `<table border="1" style="border-collapse:collapse;width:100%;">
        <thead><tr>${(b.head||[]).map(h=>`<td style="padding:6px;"><b>${esc(h)}</b></td>`).join('')}</tr></thead>
        <tbody>${(b.rows||[]).map(r=>`<tr>${(r||[]).map(c=>`<td style="padding:6px;">${mdb(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
      default: return `<p>${mdb(b.text||'')}</p>`;
    }
  }).join(gap);
}
function plainText(blocks){
  return blocks.map(b => {
    switch(b.t){
      case 'ul': case 'ol': return (b.items||[]).join('\n');
      case 'table': return [(b.head||[]).join(' | ')].concat((b.rows||[]).map(r=>(r||[]).join(' | '))).join('\n');
      default: return String(b.text || '').replace(/\*\*/g,'');
    }
  }).join('\n\n');
}
/* 발행용 segments — 사진 자리에서 끊는다 */
function buildSegments(){
  const segs = []; let buf = []; let n = -1;
  const flush = ()=>{ if(buf.length){ segs.push({ html: naverHTML(buf), text: plainText(buf) }); buf = []; } };
  state.post.blocks.forEach(b => {
    if(b.t === 'image'){
      n++;
      if(!state.images[n]) return;          // 사진을 안 넣은 자리는 건너뛴다
      flush(); segs.push({ image: n });
    } else buf.push(b);
  });
  flush();
  return segs;
}

/* 편집한 본문을 blocks로 되돌린다 (사진 자리는 그대로 둔다) */
function syncArticle(){
  const root = $('#article'); if(!root || !state.post) return;
  const out = []; let imgN = -1;
  const slots = imageSlots();
  root.childNodes.forEach(node => {
    if(node.nodeType !== 1){
      const t = (node.textContent||'').trim(); if(t) out.push({ t:'p', text:t });
      return;
    }
    const tag = node.tagName.toLowerCase();
    const txt = (node.innerText||'').trim();
    if(node.classList && node.classList.contains('imgslot')){
      imgN++; const orig = state.post.blocks[slots[imgN]] || {};
      out.push({ t:'image', prompt: orig.prompt || '', caption: orig.caption || '' });
      return;
    }
    if(!txt && tag !== 'table') return;
    if(tag === 'h2') out.push({ t:'h2', text:txt });
    else if(tag === 'h3') out.push({ t:'h3', text:txt });
    else if(tag === 'blockquote') out.push({ t:'quote', text:txt });
    else if(tag === 'ul' || tag === 'ol') out.push({ t:tag, items:[...node.querySelectorAll('li')].map(li=>li.innerText.trim()).filter(Boolean) });
    else if(tag === 'table'){
      const rows = [...node.querySelectorAll('tr')].map(tr => [...tr.children].map(td => td.innerText.trim()));
      if(rows.length) out.push({ t:'table', head: rows[0], rows: rows.slice(1) });
    }
    else out.push({ t:'p', text:txt });
  });
  if(out.length) state.post.blocks = out;
}

/* 🃏 카드 사진 — AI 없이 그 칸 앞의 소제목과 사진 설명을 대표이미지 카드 화풍(bxDrawCard)으로 얹는다 */
function slotHeading(n){
  const bi = imageSlots()[n], bl = state.post.blocks;
  for(let i = bi - 1; i >= 0; i--){ if(bl[i] && (bl[i].t === 'h2' || bl[i].t === 'h3') && bl[i].text) return String(bl[i].text).replace(/\*\*/g, ''); }
  return state.post.title || '';

async function cardPhoto(n){
  if(typeof bxDrawCard !== 'function') throw new Error('카드 모듈을 읽지 못했습니다');
  const b = state.post.blocks[imageSlots()[n]], head = slotHeading(n);
  const title = n === 0 ? (state.post.title || head) : (head || b.caption || state.post.title || '');
  const eyebrow = n === 0 ? ((state.post.coreKeywords || [])[0] || '') : (b.caption && b.caption !== title ? String(b.caption).slice(0, 22) : (state.author.office || ''));
  const st = (typeof BX_STYLES !== 'undefined' && BX_STYLES.find(x => x.k === (typeof bxCardStyle !== 'undefined' ? bxCardStyle : 'black'))) || BX_STYLES[0];
  const bg = state.images[n] && state.imgSrc[n] !== 'card' ? await bxLoadImg(state.images[n]) : null;
  const cv = document.createElement('canvas'); bxDrawCard(cv, st, title, eyebrow, bg, await bxLoadImg(bxLogo()), 1080);
  state.images[n] = cv.toDataURL('image/jpeg', 0.9); state.imgSrc[n] = 'card';
  renderPhotos(); refreshPreviewImages();
}

function uploadPhoto(n){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async ()=>{
    const f = inp.files[0]; if(!f) return;
    try{
      state.images[n] = await shrink(f, 1600);
      state.imgSrc[n] = 'up';
      renderPhotos(); refreshPreviewImages(); toast('사진을 넣었습니다');
    }catch(e){ toast('사진을 읽지 못했습니다: ' + e.message, true); }
  };
  inp.click();
}
function shrink(file, max){
  return new Promise((res, rej)=>{
    const fr = new FileReader();
    fr.onerror = ()=> rej(new Error('파일 읽기 실패'));
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> rej(new Error('이미지 형식이 아닙니다'));
      img.onload = ()=>{
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        const g = c.getContext('2d');
        g.fillStyle = '#fff'; g.fillRect(0,0,c.width,c.height);
        g.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.88));      // 캔버스를 거치며 위치정보 등은 사라진다
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

  const tryBase = async base => {

    finally{ clearTimeout(tm); }

/* ---------- 🎬 비디오 스튜디오로 (sd_video.html) ----------
   블로그 안의 「🎬 영상 만들기」(블로그에 올릴 홍보 영상)와는 따로 — 이 글을 유튜브·쇼츠 영상의 원고로 넘긴다.
   비디오 스튜디오의 작업 저장소(IndexedDB sd_video/projects)에 새 작업을 바로 넣고(사진은 크기 때문에 localStorage 가 아니라 여기로),
   sdv.cur 를 그 작업으로 맞춘 뒤 새 탭으로 연다. 작업 모양은 sd_video 의 newProject() 와 같게 둔다. */
function blogTextOf(rec){
  return (rec.blocks || []).map(b => {
    if(!b) return '';
    if(Array.isArray(b.items)) return b.items.map(x => '· ' + x).join('\n');
    if(b.t === 'image' || b.t === 'map') return '';
    return String(b.text || '').trim();
  }).filter(Boolean).join('\n\n');
}
function blogToVideo(rec, pics){
  if(!rec) return toast('넘길 글이 없습니다', true);
  const src = blogTextOf(rec);
  if(src.replace(/\s+/g, '').length < 20) return toast('글이 너무 짧습니다', true);
  const w = window.open('', '_blank');   // 누른 순간에 창부터 연다 (팝업 막힘 방지)
  const id = 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), now = Date.now();
  const proj = { id, title: rec.title || '', src, fmt:'9:16', len:'short', scenes:[], step:'src', createdAt:now, updatedAt:now,
    from:'blog', fromTitle: rec.title || '', blogPics: (pics || []).slice(0, 30) };
  const go = ()=>{ try{ localStorage.setItem('sdv.cur', JSON.stringify(id)); }catch(e){}
    if(w && !w.closed) w.location.href = 'sd_video.html'; else location.href = 'sd_video.html'; };
  const fail = (e)=>{ if(w && !w.closed) w.close(); toast('비디오 스튜디오로 넘기지 못했습니다: ' + ((e && e.message) || e), true); };
  let rq; try{ rq = indexedDB.open('sd_video', 1); }catch(e){ return fail(e); }
  rq.onupgradeneeded = ()=>{ if(!rq.result.objectStoreNames.contains('projects')) rq.result.createObjectStore('projects', { keyPath:'id' }); };
  rq.onerror = ()=> fail(rq.error);
  rq.onsuccess = ()=>{
    try{
      const tx = rq.result.transaction('projects', 'readwrite'); tx.objectStore('projects').put(proj);
      tx.oncomplete = ()=>{ rq.result.close(); toast('🎬 비디오 스튜디오로 넘겼습니다' + (proj.blogPics.length ? ' (사진 ' + proj.blogPics.length + '장)' : '')); go(); };
      tx.onerror = ()=> fail(tx.error);
    }catch(e){ fail(e); }
  };
}

function saveArchive(silent, url){
  syncArticle();
  const rec = { id: Date.now(), title: state.post.title, meta: state.post.meta,
    blocks: state.post.blocks, tags: state.post.tags, checkFacts: state.post.checkFacts,
    titles: state.post.titles, url: url || '', at: new Date().toISOString() };
  state.archive.unshift(rec);
  if(state.archive.length > 60) state.archive.length = 60;   // 저장 공간 보호 (사진은 저장하지 않음)
  LS.set('archive', state.archive);
  $('#arcCnt').textContent = state.archive.length ? '· ' + state.archive.length : '';
  if(!silent) toast('보관함에 저장했습니다 (사진은 저장되지 않습니다)');
}

<script>
/* ============ 본문에서 글자 뽑기 ============ */
function bxText(p){
  return (p.blocks||[]).map(function(b){
    if(b.t==='ul'||b.t==='ol') return (b.items||[]).join('\n');
    if(b.t==='table') return [(b.head||[]).join(' ')].concat((b.rows||[]).map(function(r){return r.join(' ');})).join('\n');
    if(b.t==='image') return '';
    return b.text||'';
  }).join('\n');
}
function bxPlain(p){ return bxText(p).replace(/\*\*/g,''); }
function bxH2(p){ return (p.blocks||[]).filter(function(b){return b.t==='h2';}); }
function bxCount(hay, needle){
  if(!needle) return 0;
  return (String(hay).match(new RegExp(needle.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'))||[]).length;
}
/* ============ SEO · AEO · GEO 점검 ============ */
var BX_ORGS=['인터넷등기소','정부24','홈택스','위택스','국토교통부','국세청','대법원','한국부동산원','HUG','주택도시보증공사','LH','청약홈','부동산거래관리시스템'];
function bxSeoChecks(p){
  var txt=bxPlain(p), title=p.title||'', h2=bxH2(p), meta=p.meta||'';
  var core=(p.coreKeywords&&p.coreKeywords.length?p.coreKeywords:[ (state.picked&&state.picked.k||'').split(',')[0]||'' ]).filter(Boolean);
  var k0=core[0]||'';
  var firstP=((p.blocks||[]).find(function(b){return b.t==='p';})||{}).text||'';
  firstP=firstP.replace(/\*\*/g,'');
  var qH2=h2.filter(function(b){return /[?？]\s*$/.test(b.text||'');}).length;
  var faqIdx=(p.blocks||[]).findIndex(function(b){return b.t==='h2'&&/자주\s*묻는|FAQ/i.test(b.text||'');});
  var faqQ=faqIdx<0?0:(p.blocks||[]).slice(faqIdx+1).filter(function(b){return b.t==='h3';}).length;
  var defOk=/(란|이란|은)\s+[^.\n]{5,}(를)?\s*(말합니다|뜻합니다|의미합니다|입니다)/.test(txt);
  var timeOk=/(20\d\d년\s*\d{0,2}월?\s*기준|20\d\d년\s*기준|현행\s*기준)/.test(txt);
  var org=BX_ORGS.filter(function(o){return txt.indexOf(o)>=0;});
  var dens=k0?bxCount(txt,k0):0;
  var lt=(p.longTail||[]); var ltHit=lt.filter(function(x){return txt.indexOf(x)>=0;}).length;
  var quotes=(p.blocks||[]).filter(function(b){return b.t==='quote';}).length;
  var kPos=k0?title.indexOf(k0):-1;
  return [
    {k:'title', n:'제목 SEO', ok:title.length>=15&&title.length<=32&&(kPos>=0&&kPos<=12),
     v:title.length+'자'+(kPos>=0?' · 키워드 '+(kPos+1)+'번째 글자부터':' · 제목에 핵심 키워드 없음'),
     fix:'제목을 25~32자로 하고 핵심 키워드를 앞쪽에 두기'},
    {k:'lead', n:'첫 문단 결론 선행(AEO)', ok:firstP.length>=50&&firstP.length<=180,
     v:firstP.length+'자', fix:'첫 문단에서 결론을 60~150자로 먼저 말하기'},
    {k:'qh2', n:'질문형 소제목(AEO)', ok:h2.length>=4&&qH2>=2,
     v:'H2 '+h2.length+'개 · 질문형 '+qH2+'개', fix:'소제목 중 2개 이상을 손님이 묻는 질문 형태로 바꾸기'},
    {k:'faq', n:'FAQ 섹션(AEO)', ok:faqQ>=3, v:faqQ?('질문 '+faqQ+'개'):'없음',
     fix:'글 끝에 "자주 묻는 질문" 소제목과 질문 3개 넣기'},
    {k:'def', n:'핵심 용어 정의문(GEO)', ok:defOk, v:defOk?'있음':'없음',
     fix:'핵심 용어를 "○○이란 ~를 말합니다" 형태로 한 번 정의하기'},
    {k:'time', n:'기준 시점 표기', ok:timeOk, v:timeOk?'있음':'없음',
     fix:'수치·기한 옆에 "2026년 9월 기준"처럼 시점 밝히기'},
    {k:'org', n:'확인처·기관명(GEO)', ok:org.length>0, v:org.length?('있음: '+org.slice(0,2).join(', ')):'없음',
     fix:'확인할 수 있는 기관(인터넷등기소·홈택스 등)을 본문에 언급하기'},
    {k:'dens', n:'키워드 밀도', ok:dens>=3&&dens<=12, v:k0?(k0+' '+dens+'회 (3~10회 적정)'):'핵심 키워드 없음',
     fix:'핵심 키워드를 본문에 3~10회 자연스럽게 넣기'},

     fix:'메타설명을 70~150자로 맞추기'},
    {k:'quote', n:'AI 인용 문장 표시(GEO)', ok:quotes>=2&&quotes<=6, v:quotes+'개 (2~5개 적정)',
     fix:'핵심 문장 2~4개를 인용 블록으로 강조하기'},
  ];
}
/* ============ 발행 전 점검 ============ */
var BX_AD=['무조건','100%','절대','확정 수익','수익률 보장','최저가','반드시 오릅','무조건 오릅','원금 보장','완벽','최고의 투자'];
var BX_AITIC=['뿐만 아니라','또한,','살펴보겠습니다','알아보겠습니다','결론적으로','중요한 점은','~에 대해 알아','마치 ','다시 말해서','요약하자면'];
function bxPubChecks(p, targetLen){
  var txt=bxPlain(p), raw=bxText(p), title=p.title||'';
  var core=(p.coreKeywords||[]).filter(Boolean);
  var ad=BX_AD.filter(function(w){return txt.indexOf(w)>=0;});
  var ai=BX_AITIC.filter(function(w){return txt.indexOf(w)>=0;});
  var pii=[];
  if(/\d{6}\s*[-–]\s*[1-4]\d{6}/.test(txt)) pii.push('주민등록번호 형태');
  if(/\d{2,3}\s*[-–]\s*\d{2,6}\s*[-–]\s*\d{2,7}/.test(txt.replace(/01[016-9][-–]\d{3,4}[-–]\d{4}/g,''))) pii.push('계좌번호 형태');
  var star=(raw.match(/\*\*/g)||[]).length;
  var faq=/자주\s*묻는|FAQ/i.test(txt);
  var kw=core.map(function(k){return k+' '+bxCount(txt,k)+'회';}).join(' · ');
  var tInTitle=core.some(function(k){return title.indexOf(k)>=0;});
  return [
    {k:'len', n:'글자 수', ok:txt.length>=targetLen*0.95, v:txt.length.toLocaleString()+'자 (목표 '+targetLen.toLocaleString()+'자)',
     fix:'본문을 목표 글자 수까지 늘리기'},
    {k:'kw', n:'키워드 노출', ok:core.length>0, v:kw||'핵심 키워드 없음', fix:'핵심 키워드를 본문에 고르게 넣기'},
    {k:'tkw', n:'제목에 키워드', ok:tInTitle, v:tInTitle?'핵심 키워드가 제목에 있습니다':'제목에 핵심 키워드 없음',
     fix:'제목에 핵심 키워드 넣기'},
    {k:'ad', n:'광고 표현', ok:ad.length===0, v:ad.length?('발견: '+ad.join(', ')):'과장·확정 수익 표현 없음',
     fix:'단정적·과장 표현을 사실 서술로 바꾸기'},
    {k:'pii', n:'개인정보', ok:pii.length===0, v:pii.length?('의심: '+pii.join(', ')):'없음',
     fix:'주민등록번호·계좌번호로 보이는 숫자 빼기'},
    {k:'star', n:'별표 강조', ok:star===0, v:star?(Math.floor(star/2)+'곳 남아 있음'):'없음',
     fix:'네이버에서 깨지는 ** 표시 없애기'},
    {k:'ai', n:'사람 글 느낌', ok:ai.length===0, v:ai.length?('AI 티 표현: '+ai.slice(0,3).join(', ')):'어색한 표현 없음',
     fix:'AI가 자주 쓰는 상투적 표현을 사람 말투로 바꾸기'},
    {k:'faq', n:'AEO(FAQ)', ok:faq, v:faq?'자주 묻는 질문 섹션 있음':'없음', fix:'자주 묻는 질문 섹션 넣기'},

/* ============ 빠진 항목 자동 보강 ============ */
async function bxAutoFix(btn){

function bxLogo(){ try{ return LS.get('logo','')||(window.sdLogo?window.sdLogo.src('blog_card'):'')||''; }catch(e){ return ''; } }
function bxWrap(ctx, text, maxW){
  var words=String(text).split(/\s+/), lines=[], cur='';
  words.forEach(function(w){
    var t=cur?cur+' '+w:w;
    if(ctx.measureText(t).width>maxW&&cur){ lines.push(cur); cur=w; } else cur=t;
  });
  if(cur)lines.push(cur);
  return lines;
}
function bxDrawCard(cv, st, title, eyebrow, bgImg, logoImg, size){
  size=size||1080; cv.width=size; cv.height=size;
  var c=cv.getContext('2d'), S=size/1080;
  /* 바탕 */
  if(bgImg){
    var r=Math.max(size/bgImg.width,size/bgImg.height);
    c.drawImage(bgImg,(size-bgImg.width*r)/2,(size-bgImg.height*r)/2,bgImg.width*r,bgImg.height*r);
    c.fillStyle='rgba(0,0,0,.45)'; c.fillRect(0,0,size,size);
  } else if(String(st.bg).indexOf('grad:')===0){
    var cs=st.bg.slice(5).split(','), g=c.createLinearGradient(0,0,size,size);
    g.addColorStop(0,cs[0]); g.addColorStop(1,cs[1]); c.fillStyle=g; c.fillRect(0,0,size,size);
  } else { c.fillStyle=st.bg; c.fillRect(0,0,size,size); }
  var fg=bgImg?'#fff':st.fg, ac=bgImg?'#ffd400':st.ac;
  /* 스타일 장식 */
  if(st.frame){ c.strokeStyle=ac; c.lineWidth=4*S; c.strokeRect(46*S,46*S,size-92*S,size-92*S); }
  if(st.bars){ c.fillStyle='#000'; c.fillRect(0,0,size,120*S); c.fillRect(0,size-120*S,size,120*S); }
  if(st.tape){ c.save(); c.translate(size*0.5,70*S); c.rotate(-0.04); c.fillStyle='rgba(255,255,255,.75)';
               c.fillRect(-150*S,-26*S,300*S,52*S); c.restore(); }
  if(st.side){ c.fillStyle=ac; c.fillRect(70*S,300*S,10*S,size-560*S); }
  if(st.rule){ c.strokeStyle='#d8d5cd'; c.lineWidth=2*S;
               c.beginPath(); c.moveTo(80*S,size-230*S); c.lineTo(size-80*S,size-230*S); c.stroke(); }
  /* 눈썹 문구 */
  var padL=(st.side?110:80)*S;
  if(eyebrow){
    c.font='600 '+Math.round(34*S)+'px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
    c.fillStyle=ac; c.textBaseline='top';
    c.fillText(String(eyebrow).slice(0,22), padL, (st.bars?170:150)*S);
  }
  if(st.num){
    c.font='800 '+Math.round(96*S)+'px "Apple SD Gothic Neo",sans-serif';
    c.fillStyle=ac; c.globalAlpha=.25; c.fillText('01', padL, 150*S); c.globalAlpha=1;
  }
  /* 제목 */
  var fs=Math.round(84*S);
  c.font='800 '+fs+'px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  var maxW=size-padL-80*S, lines=bxWrap(c,title,maxW);
  while(lines.length>4&&fs>44*S){ fs-=Math.round(6*S);
    c.font='800 '+fs+'px "Apple SD Gothic Neo","Malgun Gothic",sans-serif'; lines=bxWrap(c,title,maxW); }
  var lh=fs*1.28, top=(size-lines.length*lh)/2+(st.bars?10*S:0);
  if(st.glow){ c.shadowColor=ac; c.shadowBlur=26*S; }
  c.fillStyle=fg; c.textBaseline='middle';
  lines.slice(0,5).forEach(function(ln,i){ c.fillText(ln, padL, top+lh*i+lh/2); });
  c.shadowBlur=0;
  /* 밑줄 강조 */
  if(st.k==='black'||st.k==='edit'){
    c.fillStyle=ac; c.fillRect(padL, top+lines.length*lh+22*S, 120*S, 8*S);
  }
  /* 로고 */
  if(logoImg){
    var lw=size*0.15, lh2=lw*(logoImg.height/logoImg.width);
    c.globalAlpha=.95; c.drawImage(logoImg, size-lw-52*S, size-lh2-52*S, lw, lh2); c.globalAlpha=1;
  }
}

function bxMarkdown(p){
  var L=['# '+(p.title||''),''];
  if(p.meta) L.push('> '+p.meta,'');
  var img=0;
  (p.blocks||[]).forEach(function(b){
    if(b.t==='h2') L.push('## '+b.text,'');
    else if(b.t==='h3') L.push('### '+b.text,'');
    else if(b.t==='p') L.push(b.text,'');
    else if(b.t==='ul') { (b.items||[]).forEach(function(i){L.push('- '+i);}); L.push(''); }
    else if(b.t==='ol') { (b.items||[]).forEach(function(i,n){L.push((n+1)+'. '+i);}); L.push(''); }
    else if(b.t==='quote') L.push('> '+b.text,'');
    else if(b.t==='table'){
      L.push('| '+(b.head||[]).join(' | ')+' |');
      L.push('|'+(b.head||[]).map(function(){return '---';}).join('|')+'|');
      (b.rows||[]).forEach(function(r){ L.push('| '+r.join(' | ')+' |'); });
      L.push('');
    }
    else if(b.t==='image'){ img++; L.push('![사진 '+img+'](사진'+img+'.jpg)', b.caption?'*'+b.caption+'*':'', ''); }
  });
  if(p.tags&&p.tags.length) L.push('', p.tags.map(function(t){return '#'+t;}).join(' '));
  return L.join('\n');
}

<script>
/* ═══════════════════════════════════════════════════════════════════
   🎬 영상 만들기 v2 (2026-10-06) — 블로그 글 중간에 넣을 짧은 소개 영상
   ko372 K-블로그 스튜디오의 영상 만들기를 참고해 SJRWS 에 맞게:
   · 목소리: 음성 없음 / 제미나이(키 그대로) / 일레븐랩스(내 목소리) / 내 음성 파일 — 미리듣기·말 속도
   · 장면 길이는 목소리 길이에 맞춘다. 나레이션 자막(작은 글씨)도 넣을 수 있다
   · 만들기: 프레임을 하나씩 그려 브라우저 안에서 바로 mp4 (WebCodecs + mp4-muxer) — 도우미 없이도 프레임 누락·음성 어긋남 없음,
     실제 길이보다 빨리 끝난다. 이 기능이 없는 브라우저만 예전처럼 실시간 녹화(MediaRecorder)
   · 영상 썸네일(첫 장면 + ▶) · 발행할 때 넣을 자리(글 앞·중간·끝) → 발행 도우미가 네이버 글에 동영상으로 올린다
     (payload.video = { data:mp4 base64, title, thumb } + segments 에 { video:true })
   · 🖼 글 사진으로 다시 채우기
   ═══════════════════════════════════════════════════════════════════ */
var VD = {

  '1:1' :{w:960,h:960,n:'정사각 1:1 · 인스타'}
};
var VD_STY = {

  dark: {n:'다크 시네마', bg:'#0c0c0e', fg:'#f4f4f2', ac:'#d8b04a', sub:'#a9a9a4', band:'rgba(0,0,0,.62)'},

};
var VD_VOICE = { none:'음성 없음 (자막만)', gemini:'제미나이 목소리 (키 그대로)', eleven:'일레븐랩스 (내 목소리)', fish:'Fish Audio (내 목소리)', file:'내 음성 파일 (녹음)' };
var VD_GV = [['Kore','여 · 단단하고 또렷함'],['Aoede','여 · 산뜻하고 부드러움'],['Leda','여 · 젊고 밝음'],['Despina','여 · 매끄럽고 차분함'],['Charon','남 · 차분한 설명'],['Orus','남 · 단단하고 믿음직함'],['Iapetus','남 · 맑고 또렷함'],['Algieba','남 · 부드럽고 따뜻함']];
var VD_POS = { off:'넣지 않음', top:'글 앞 (대표사진 아래)', middle:'글 중간', end:'글 끝 (서명 위)' };
var VD_TTS_MODELS = ['gemini-3.1-flash-tts-preview', 'gemini-2.5-flash-preview-tts', 'gemini-2.5-pro-preview-tts'];
function vdSave1(k, v){ VD[k] = v; LS.set('vd' + k.charAt(0).toUpperCase() + k.slice(1), v); }
function vdDirty(){ VD.blob = null; VD.thumb = ''; vdPaintSave(); vdPaintPubVid(); }
/* ---------- 대본 ---------- */
async function vdMakeScript(btn){
  var p = state.post; if(!p) return;
  var old = btn.textContent; btn.disabled = true; btn.textContent = '⏳ 뽑는 중...';
  try{
    var prompt = '아래 블로그 글에서 블로그 본문 중간에 넣을 30~60초 소개 영상 대본을 뽑으세요.\n\n[제목] ' + (p.title||'')
      + '\n[본문]\n' + bxPlain(p).slice(0, 5000)
      + '\n\n[지킬 것]\n- 장면 6~9개\n- 공인중개사가 직접 말하는 1인칭, 존댓말\n'
      + '- 첫 장면은 손님이 실제로 궁금해하는 질문으로 시작\n'
      + '- 자막(t)은 화면에 크게 박히는 한 줄. 세로줄 기호 | 로 두 줄로 나눈다. 한 줄 12자 이내\n'
      + '- 나레이션(n)은 소리 내어 읽으면 4~6초인 한 문장(25~45자). 자막을 그대로 반복하지 말 것. 이모지·괄호·영어 약어 금지\n'
      + '- 과장·확정 수익 표현 금지. 글에 없는 숫자·사실 금지\n- 마지막 장면은 「' + (state.author.office || '사무소') + '」 문의 유도\n\n'
      + 'JSON으로만 출력:\n{"title":"영상 제목 한 줄","sub":"부제 한 줄 (사무소명·이름)","scenes":[{"t":"자막|두번째 줄","n":"나레이션 한 문장"}]}';
    var d = parseJSON(await callAI(prompt, { json:true, maxTokens:3000 }));
    VD.title = d.title || p.title || '';
    VD.sub   = d.sub || ((state.author.office||'') + ' · ' + (state.author.name||''));
    var imgs = vdArticleImgs();
    VD.scenes = (d.scenes||[]).slice(0,9).map(function(s,i){
      return { t:String(s.t||''), n:String(s.n||''), img: imgs.length ? imgs[i % imgs.length] : null, au:null };
    });
    VD.postTitle = p.title || ''; vdDirty(); vdPaint();
  }catch(e){ toast('대본을 뽑지 못했습니다: ' + e.message, true); }
  btn.disabled = false; btn.textContent = old;
}
function vdArticleImgs(){ var sl = (typeof imageSlots === 'function' && state.post) ? imageSlots() : []; return sl.map(function(_, n){ return state.images[n]; }).filter(Boolean); }
function vdRefill(){
  var imgs = vdArticleImgs(); if(!imgs.length) return toast('글에 넣은 사진이 없습니다 — 아래 [사진] 칸에서 먼저 넣어 주세요', true);
  VD.scenes.forEach(function(s, i){ s.img = imgs[i % imgs.length]; }); vdDirty(); vdPaint(); toast('글 사진 ' + imgs.length + '장을 장면에 다시 배정했습니다');
}
function vdAddScene(){ VD.scenes.push({t:'자막을 적으세요|두 번째 줄', n:'', img:null, au:null}); vdDirty(); vdPaint(); }
function vdDelScene(i){ VD.scenes.splice(i,1); vdDirty(); vdPaint(); }
function vdMove(i,d){
  var j=i+d; if(j<0||j>=VD.scenes.length) return;
  var t=VD.scenes[i]; VD.scenes[i]=VD.scenes[j]; VD.scenes[j]=t; vdDirty(); vdPaint();
}
function vdSceneImg(i, input){
  var f=input.files&&input.files[0]; if(!f) return;
  var fr=new FileReader(); fr.onload=function(){ VD.scenes[i].img=String(fr.result); vdDirty(); vdPaint(); };
  fr.readAsDataURL(f);
}
function vdAudio(input){
  var f=input.files&&input.files[0]; if(!f) return;
  var fr=new FileReader();
  fr.onload=async function(){
    try{
      var ac=new (window.AudioContext||window.webkitAudioContext)();
      VD.audio=await ac.decodeAudioData(fr.result);
      VD.audioName=f.name; VD.audioDur=VD.audio.duration;
      ac.close(); vdSave1('voice', 'file'); vdDirty(); vdPaint();
      toast('음성 ' + Math.round(VD.audioDur) + '초를 넣었습니다. 장면 길이가 음성에 맞춰집니다.');
    }catch(e){ toast('이 음성 파일은 읽지 못했습니다. mp3·m4a·wav 를 써 주세요.', true); }
  };
  fr.readAsArrayBuffer(f);
}
/* ---------- 목소리 (장면마다 따로 만들어 길이를 맞춘다) ---------- */
function vdElOpt(){ try{ return JSON.parse(localStorage.getItem('sdv.opt') || '{}') || {}; }catch(e){ return {}; } }
function vdVoiceKey(){ return VD.voice === 'gemini' ? 'g:' + VD.gVoice + ':' + VD.speed : VD.voice === 'eleven' ? 'e:' + (vdElOpt().elVoice || '') + ':' + VD.speed : VD.voice === 'fish' ? 'f:' + (vdElOpt().fishRef || '') + ':' + (vdElOpt().fishModel || '') + ':' + VD.speed : ''; }
function vdTtsOn(){ return VD.voice === 'gemini' || VD.voice === 'eleven' || VD.voice === 'fish'; }
function vdHasAu(s){ return !!(s.au && s.au.text === s.n && s.au.key === vdVoiceKey()); }
async function vdPcmToBuf(b64, rate){
  var bin = atob(b64), n = bin.length >> 1, f = new Float32Array(n);
  for(var i = 0; i < n; i++){ var v = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8); if(v >= 32768) v -= 65536; f[i] = v / 32768; }
  var c = new OfflineAudioContext(1, Math.max(1, n), rate), b = c.createBuffer(1, Math.max(1, n), rate); b.copyToChannel(f, 0); return b;
}
async function vdTtsGemini(text){
  var keys = keysOf('gemini'); if(!keys.length) throw new Error('제미나이 키가 없습니다 — [엔진 설정]에서 넣어 주세요.');
  var pace = VD.speed <= 0.9 ? 'slowly and calmly' : VD.speed >= 1.1 ? 'briskly, a little faster than normal' : 'at a natural, steady pace';
  var last;
  for(var mi = 0; mi < VD_TTS_MODELS.length; mi++){
    var r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(VD_TTS_MODELS[mi]) + ':generateContent?key=' + encodeURIComponent(keys[0]), {
      method:'POST', headers:{ 'content-type':'application/json' },
      body: JSON.stringify({ contents:[{ role:'user', parts:[{ text:'Read the following Korean text aloud in a calm, trustworthy real-estate agent voice, ' + pace + '. Read only the Korean text:\n' + text }] }],
        generationConfig:{ responseModalities:['AUDIO'], speechConfig:{ voiceConfig:{ prebuiltVoiceConfig:{ voiceName:VD.gVoice } } } } }) });
    var d = await r.json().catch(function(){ return {}; });
    if(r.ok){
      var a = ((((d.candidates||[])[0]||{}).content||{}).parts||[]).find(function(p){ return p.inlineData || p.inline_data; });
      if(!a) throw new Error('목소리가 오지 않았습니다 — 문장을 조금 바꿔 보세요');
      var inl = a.inlineData || a.inline_data, rate = +((/rate=(\d+)/.exec(inl.mimeType || inl.mime_type || '') || [])[1] || 24000);
      return vdPcmToBuf(inl.data, rate);
    }
    var em = (d.error && d.error.message) || ''; last = new Error('목소리 오류 ' + r.status + ': ' + em.slice(0, 150));
    if(!(r.status === 404 || /not found|not supported/i.test(em))) break;
  }
  throw last;
}
async function vdTtsEleven(text){
  var keys = String(state.settings.elevenKeys || '').split(/[\n,]/).map(function(x){ return x.trim(); }).filter(Boolean), o = vdElOpt();
  if(!keys.length) throw new Error('일레븐랩스 키가 없습니다 — 비디오 스튜디오 🔑 열쇠에서 넣어 주세요 (같은 칸을 씁니다).');
  if(!o.elVoice) throw new Error('일레븐랩스 목소리를 비디오 스튜디오 「음성」 단계에서 먼저 골라 주세요 (같은 설정을 씁니다).');
  var r = await fetch('https://api.elevenlabs.io/v1/text-to-speech/' + encodeURIComponent(o.elVoice) + '?output_format=mp3_44100_128', {
    method:'POST', headers:{ 'content-type':'application/json', 'xi-api-key':keys[0] },
    body: JSON.stringify({ text:text, model_id:o.elModel || 'eleven_multilingual_v2', voice_settings:{ stability:+o.elStab || 0.5, similarity_boost:0.8, speed:Math.max(0.7, Math.min(1.2, VD.speed)) } }) });
  if(!r.ok){ var d = await r.json().catch(function(){ return {}; }), det = d.detail || {}; throw new Error('일레븐랩스 오류 ' + r.status + ': ' + String((typeof det === 'string' ? det : det.message) || '').slice(0, 150)); }
  var ab = await r.arrayBuffer(), c = new OfflineAudioContext(1, 1, 44100);

    b.title=SD_NAME+' · '+SD_FILE+'\n전체 프로그램 버전 보기';

  }

  function paint(){
    var b=document.getElementById('sd-ver-badge');
    if(!b) return;
    // 나보다 높은 버전이 하나라도 있으면 알려 준다
    var top=SD_VER;
    Object.keys(REG).forEach(function(k){
      if(verKey(REG[k].ver)>verKey(top)) top=REG[k].ver;
    });
    if(verKey(top)>verKey(SD_VER)){
      b.textContent='v'+SD_VER+' ⚠';
      b.style.background='rgba(198,40,40,.78)';
      b.title=SD_NAME+' · '+SD_FILE+'\n더 높은 버전('+top+')이 다른 프로그램에 올라가 있습니다.\n이 파일도 최신본으로 올렸는지 확인하세요.';
    }
  }

  window.sdVerPanel=function(){ openPanel(); };

  function openPanel(){
    var old=document.getElementById('sd-ver-ov'); if(old) old.remove();

    var top='';
    SD_ALL.forEach(function(p){ var e=REG[p[0]]; if(e&&verKey(e.ver)>verKey(top)) top=e.ver; });

    var rows=SD_ALL.map(function(p){
      var file=p[0], name=p[1], e=REG[file];
      var isMe = file===SD_FILE;
      if(!e){
        return '<tr><td style="color:#1a1a1a">'+esc(name)+(isMe?' <span style="font-size:10px;color:#1565c0">◀ 지금 화면</span>':'')+'</td>'
          +'<td style="color:#bbb;text-align:right;white-space:nowrap">확인 안 됨</td></tr>';
      }
      var old2 = top && verKey(e.ver)<verKey(top);
      return '<tr><td style="color:#1a1a1a">'+esc(name)+(isMe?' <span style="font-size:10px;color:#1565c0">◀ 지금 화면</span>':'')
        +'<div style="font-size:10px;color:#bbb">'+esc(file)+' · '+esc(e.at||'')+'</div></td>'
        +'<td style="text-align:right;white-space:nowrap;color:'+(old2?'#c62828':'#2e7d32')+';font-weight:'+(old2?'700':'500')+'">'
        +'v'+esc(e.ver)+(old2?'<div style="font-size:10px;font-weight:400">구버전일 수 있음</div>':'')+'</td></tr>';
    }).join('');

    var unseen=SD_ALL.filter(function(p){return !REG[p[0]];}).length;

    var ov=document.createElement('div');
    ov.id='sd-ver-ov';
    ov.innerHTML='<div class="vbox">'
      + '<div style="background:#1a2744;color:#fff;padding:13px 18px;display:flex;justify-content:space-between;align-items:center">'
      +   '<span style="font-size:14px;font-weight:700">🏷️ 프로그램 버전</span>'
      +   '<button onclick="document.getElementById(\'sd-ver-ov\').remove()" '
      +     'style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;'
      +     'padding:4px 10px;font-size:12px;cursor:pointer">✕ 닫기</button>'
      + '</div>'
      + '<div style="padding:14px 16px">'
      +   '<table>'+rows+'</table>'
      +   '<p style="font-size:11px;color:#888;line-height:1.7;margin:12px 0 0">'
      +     '각 프로그램을 한 번 열어야 그 버전이 여기에 기록됩니다. '
      +     (unseen? '아직 '+unseen+'개는 이 브라우저에서 연 적이 없어 «확인 안 됨»으로 나옵니다. ':'')
      +     '버전이 서로 다르면 올리다 빠뜨린 파일이 있는지 확인해 보세요.'
      +   '</p>'
      + '</div></div>';
    document.body.appendChild(ov);
    ov.onclick=function(e){ if(e.target===ov) ov.remove(); };
  }

  function boot(){ mount(); report(); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ setTimeout(boot,600); });
  else setTimeout(boot,600);
})();
</script>


<!-- ═══════════════════════════════════════════════════════════
     자료 읽기 순서 맞추기 모듈  v1.2
     - 화면이 로그인보다 먼저 자료를 읽으러 가면 규칙에 막혀 빈 화면이 된다.
       (막힌 뒤 다시 시도하지 않는 화면이 있어 더 문제)
     - 그래서 로그인이 끝날 때까지 파이어베이스 손잡이를 잠깐 감춰 둔다.
       화면은 손잡이가 생길 때까지 기다리므로, 저절로 순서가 맞는다.
     - window.storage 는 감추는 대신 '로그인 후에 실행'되도록 감싼다.
     - 8초가 지나면 무슨 일이 있어도 열어 준다 (영원히 멈추지 않게)
     ═══════════════════════════════════════════════════════ -->
<script>
(function(){
  'use strict';
  var GATED=['_fbDb','_fbGet','_fbRef','_fbChild','_fbSet','_fbRemove','_fbOn','_fbStorage','_fbPush','_fbUpdate'];
  var HELD={}, opened=false, waiters=[];

  window.sdAuth = window.sdAuth || {};
  window.sdAuth.gate = '대기';

  GATED.forEach(function(k){
    try{
      if(k in window && window[k]!==undefined) HELD[k]=window[k];
      Object.defineProperty(window, k, {
        configurable:true,
        get:function(){ return opened ? HELD[k] : undefined; },
        set:function(v){ HELD[k]=v; }
      });
    }catch(e){}
  });

  function openGate(why){
    if(opened) return;
    opened=true;
    window.sdAuth.gate='열림 ('+why+')';
    GATED.forEach(function(k){
      try{ Object.defineProperty(window,k,{configurable:true,writable:true,value:HELD[k]}); }
      catch(e){ try{ window[k]=HELD[k]; }catch(e2){} }
    });
    var w=waiters; waiters=[];
    w.forEach(function(fn){ try{ fn(); }catch(e){} });
    setTimeout(retryLoaders, 60);
  }

  // 로그인 전에 이미 '자료 읽기'를 시도했다가 빈손으로 끝난 화면을 다시 불러온다.
  // (화면에 따라 한 번만 읽고 마는 구조가 있어, 그대로 두면 빈 화면이 된다)
  function retryLoaders(){
    try{
      var G = window.G || {};
      // 데이터 화면
      if(typeof window.fbAutoLoadOnce === 'function'
         && !(G.saleData && G.saleData.length) && !(G.rentData && G.rentData.length)){
        window._fbAutoOnce = false;
        window.fbAutoLoadOnce();
      }
      // 매물 화면
      if(typeof window.loadNaverFromFirebase === 'function' && !(G.naverData && G.naverData.length)){
        window.loadNaverFromFirebase();
      }
      // 블로그 화면
      if(typeof window.blogFbPull === 'function') window.blogFbPull();
    }catch(e){}
  }
  window.sdAuthDone = function(){ openGate('로그인'); };
  window.sdAuthWait = function(){
    if(opened) return Promise.resolve();
    return new Promise(function(res){ waiters.push(res); });
  };
  setTimeout(function(){ openGate('시간초과'); }, 8000);   // 안전장치

  // ── window.storage 는 감추지 않고 '기다렸다 실행'하도록 감싼다
  var wrapped=false;
  function wrapStorage(){
    if(wrapped) return;
    var s=window.storage;
    if(!s || typeof s.get!=='function') return;
    wrapped=true;
    var og=s.get.bind(s), os=(typeof s.set==='function')?s.set.bind(s):null;
    s.get=function(){ var a=arguments; return window.sdAuthWait().then(function(){ return og.apply(null,a); }); };
    if(os) s.set=function(){ var a=arguments; return window.sdAuthWait().then(function(){ return os.apply(null,a); }); };
  }
  var n=0;
  var iv=setInterval(function(){ wrapStorage(); if(wrapped || ++n>80) clearInterval(iv); }, 100);
  wrapStorage();
})();
</script>

<script type="module">
  // 모듈 방식으로 만든 파이어베이스 앱에도 같은 로그인을 이어 준다
  try{
    const { getApps } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    const { getAuth, signInAnonymously, onAuthStateChanged } =
      await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
    window.sdAuth = window.sdAuth || {};
    let n = 0;
    const tick = () => {
      const apps = getApps();
      if(!apps.length){
        if(n++ < 40) return setTimeout(tick, 250);
        window.sdAuth.module = '파이어베이스 앱 없음';
        return;
      }
      const auth = getAuth(apps[0]);
      let settled = false;
      window.sdAuth.module = '확인 중…';
      onAuthStateChanged(auth, async u => {
        if(u){
          settled = true;
          window.sdAuth.module = u.isAnonymous
            ? '로그인됨 (익명) ' + u.uid.slice(0,8)
            : '로그인됨 (구글 ' + (u.email || u.uid.slice(0,8)) + ')';
          if(window.sdAuthDone) window.sdAuthDone();
          return;
        }
        if(settled){ window.sdAuth.module = '로그아웃 상태'; return; }
        settled = true;
        try{ await signInAnonymously(auth); }
        catch(e){
          window.sdAuth.module = '익명 로그인 실패: ' + (e && e.code || e && e.message || e);
          if(window.sdAuthDone) window.sdAuthDone();
          console.warn('[SJRWS] 익명 로그인(모듈) 실패 — 콘솔에서 익명 인증을 켜 주세요.', e);
        }
      });
    };
    tick();
  }catch(e){
    window.sdAuth = window.sdAuth || {};
    window.sdAuth.module = '실패: ' + (e && e.message || e);
  }
</script>
<script>
(function(){
  'use strict';
  if(window.__sjbOn) return; window.__sjbOn = true;
  //  화면 오른쪽 위에 떠 있는 사용자 막대(#_sda_b — 이름·허브·로그아웃)와 겹치는 머리줄은 그 폭만큼 비켜 선다
  function fit(){
    var bar = document.getElementById('_sda_b'), root = document.documentElement;
    var rs = document.querySelectorAll('.sjb-reserve');
    if(!bar || getComputedStyle(bar).display === 'none'){ Array.prototype.forEach.call(rs, function(e){ e.classList.remove('sjb-under'); }); return; }
    var b = bar.getBoundingClientRect();
    root.style.setProperty('--sjb-barw', Math.ceil(b.width) + 'px');
    Array.prototype.forEach.call(rs, function(e){
      var r = e.getBoundingClientRect();
      //  막대가 이 줄 위쪽에 걸치면 비킨다 (스크롤해서 내려간 뒤에도 처음 자리 기준)
      var top = r.top + (window.scrollY || 0);
      //  위아래로 걸치고, 좌우로도 걸칠 때만 (5120 넓은 화면에서 가운데 띠는 막대와 안 겹친다)
      e.classList.toggle('sjb-under', top < b.bottom + 2 && b.left < r.right - 4);
    });
  }
  //  공통 배율 = 🔍 화면 배율 설정(sd_ui_scale, 기본 115%) — 화면마다 본문 배율이 달라도 머리줄은 이 배율
  function scale(){
    var v = 1.15; try{ var x = parseFloat(localStorage.getItem('sd_ui_scale')); if([1, 1.15, 1.3].indexOf(x) >= 0) v = x; }catch(e){}
    if(document.documentElement.style.getPropertyValue('--sjb-scale') !== String(v)) document.documentElement.style.setProperty('--sjb-scale', String(v));
  }
  scale();
  try{ new MutationObserver(function(){ scale(); setTimeout(fit, 50); }).observe(document.documentElement, { attributes:true, attributeFilter:['style'] }); }catch(e){}
  window.addEventListener('storage', function(e){ if(e.key === 'sd_ui_scale'){ scale(); fit(); } });
  var n = 0;
  (function t(){ fit(); if(n++ < 40) setTimeout(t, 500); })();
  window.addEventListener('resize', fit);
  try{ new MutationObserver(function(){ fit(); }).observe(document.body, { childList:true }); }catch(e){}
  window.sdBrand = { fit:fit, scale:scale };
})();
</script>
