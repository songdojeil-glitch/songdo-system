/* AI + 인터넷 조사 — 엔진마다 검색 도구를 붙인다 */
async function researchAI(prompt, files){
  var engine = state.settings.engine, keys = keysOf(engine), lastErr;
  if(!keys.length) throw new Error('API 키가 없습니다. [엔진 설정]에서 키를 넣어 주세요.');
  for(var i = 0; i < keys.length; i++){
    try{
      if(engine === 'claude') return await researchClaude(keys[i], prompt, files);
      if(engine === 'openai') return { text: await callOpenAI(keys[i], prompt + '\n\n(인터넷 검색 없이 아는 범위에서만 답하고, 확인 못 한 사실은 fact 를 비워 두세요.)', true, 8000, files.filter(function(f){ return /^data:image/.test(f.data); }).map(function(f){ return f.data; })), web:false, sources:[] };
      return await researchGemini(keys[i], prompt, files);
    }catch(e){ lastErr = e; if(!/401|403|429|한도|quota|invalid/i.test(e.message)) throw e; }
  }
  throw lastErr;
}
async function researchGemini(key, prompt, files){
  var model = state.settings.geminiModel || DEF_SETTINGS.geminiModel;
  var parts = [{ text: prompt }];
  files.forEach(function(f){ var p = dataUrlParts(f.data); if(p) parts.push({ inline_data:{ mime_type:p.mime, data:p.b64 } }); });
  var r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(key), {
    method:'POST', headers:{ 'content-type':'application/json' },
    /* 구글 검색 붙이기 — 이 모드에서는 JSON 강제(responseMimeType)를 같이 쓸 수 없어 글로 받아 읽는다 */
    body: JSON.stringify({ contents:[{ role:'user', parts:parts }], tools:[{ google_search:{} }], generationConfig:{ temperature:0.5, maxOutputTokens:32768 } }) });
  var d = await r.json().catch(function(){ return {}; });
  if(!r.ok){ var em = (d.error && d.error.message) || ''; throw new Error('제미나이 오류 ' + r.status + ': ' + em.slice(0, 200) + geminiModelHint(r.status, em) + geminiBillHint(r.status, em)); }
  /* 생각(thinking) 토큰도 한도에 들어가 8192 로는 글감 JSON 이 끊겼다 → 32768 (쓴 만큼만 과금) */
  var c = (d.candidates || [])[0] || {}, txt = ((c.content || {}).parts || []).filter(function(p){ return !p.thought; }).map(function(p){ return p.text || ''; }).join('').trim();
  if(!txt) throw new Error('제미나이가 빈 응답을 보냈습니다.');
  var gm = c.groundingMetadata || {}, src = (gm.groundingChunks || []).map(function(g){ return g.web ? { title:g.web.title || '', url:g.web.uri || '' } : null; }).filter(Boolean);
  return { text:txt, web:true, sources:src, cut: c.finishReason === 'MAX_TOKENS' };
}
async function researchClaude(key, prompt, files){
  var model = state.settings.claudeModel || 'claude-sonnet-4-5', content = [];
  files.forEach(function(f){ var p = dataUrlParts(f.data); if(!p) return;
    if(p.mime === 'application/pdf') content.push({ type:'document', source:{ type:'base64', media_type:p.mime, data:p.b64 } });
    else if(/^image\//.test(p.mime)) content.push({ type:'image', source:{ type:'base64', media_type:p.mime, data:p.b64 } }); });
  content.push({ type:'text', text: prompt + '\n\nJSON 한 덩어리만 출력하세요.' });
  var r = await fetch('https://api.anthropic.com/v1/messages', { method:'POST',
    headers:{ 'content-type':'application/json', 'x-api-key':key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
    body: JSON.stringify({ model:model, max_tokens:16000, tools:[{ type:'web_search_20250305', name:'web_search', max_uses:6 }], messages:[{ role:'user', content:content }] }) });
  var d = await r.json().catch(function(){ return {}; });
  if(!r.ok) throw new Error('클로드 오류 ' + r.status + ': ' + ((d.error && d.error.message) || '').slice(0, 200));
  var blocks = d.content || [], txt = blocks.filter(function(b){ return b.type === 'text'; }).map(function(b){ return b.text; }).join('\n').trim();
  var src = [];
  blocks.forEach(function(b){ if(b.type === 'web_search_tool_result' && Array.isArray(b.content)) b.content.forEach(function(x){ if(x.url) src.push({ title:x.title || '', url:x.url }); }); });
  if(!txt) throw new Error('클로드가 빈 응답을 보냈습니다.');
  return { text:txt, web:true, sources:src };
}
/* 검색량 — 앱스 스크립트 웹 앱(sd_kw_volume.gs) */
function kwConfigured(){ return !!(state.settings.kwUrl && state.settings.kwToken); }
async function kwVolumes(list){
  var u = String(state.settings.kwUrl || '').trim();
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)) throw new Error('검색량 주소가 앱스 스크립트 웹 앱 주소(https://script.google.com/…/exec)가 아닙니다.');
  var url = u + (u.indexOf('?') >= 0 ? '&' : '?') + 'k=' + encodeURIComponent(state.settings.kwToken) + '&rel=1&blog=1&q=' + encodeURIComponent(list.join(','));
  var r = await fetch(url, { cache:'no-store', redirect:'follow' });
  var d = await r.json().catch(function(){ return null; });
  if(!d) throw new Error('검색량 응답을 읽지 못했습니다 (' + r.status + ')');
  if(!d.ok) throw new Error(d.error || '검색량을 받지 못했습니다');
  return d;
}
/* 앱스 스크립트는 한 번에 40개까지 — 나눠서 받고 합친다 */
async function kwVolumesAll(list){
  var all = { list:[], related:[] }, rel = {};
  for(var i = 0; i < list.length; i += 40){
    var v = await kwVolumes(list.slice(i, i + 40));
    all.list = all.list.concat(v.list || []);
    (v.related || []).forEach(function(x){ if(!rel[x.kw] || rel[x.kw].total < x.total) rel[x.kw] = x; });
  }
  all.related = Object.keys(rel).map(function(k){ return rel[k]; }).sort(function(a, b){ return b.total - a.total; }).slice(0, 40);
  return all;
}
function krApplyVol(L, v){
  var by = {}; (v.list || []).forEach(function(o){ by[o.kw] = o; });
  L.rows.forEach(function(r){ var o = by[r.kw]; if(o){ r.pc = o.pc; r.mo = o.mo; r.total = o.total; r.comp = o.comp; r.blog = o.blog; r.none = o.none; } });
  L.related = v.related || []; L.vol = true; L.volErr = ''; L.volAt = Date.now();
}

  list.sort(function(a, b){ return (b.savedAt || 0) - (a.savedAt || 0); });

}
function krPlain(L){

  delete c.savedId; delete c.savedName; delete c.dirty;
  return c;
}
async function krSave(name){
  var L = KR.last; if(!L || !L.rows) return;
  var id = L.savedId || ('k' + Date.now().toString(36));
  var rec = { name:name, savedAt:Date.now(), area:(L.input && L.input.area) || '', n:L.rows.length, vol:!!L.vol, data:krPlain(L) };
  var where = 'cloud';
  if(kwFbOk()){
    try{ await window._fbSet(window._fbRef(window._fbDb, KW_FB + '/' + id), rec); }
    catch(e){ where = 'local'; }
  }else where = 'local';
  KR.saved = (KR.saved || LS.get('kwSaved', [])).filter(function(r){ return r.id !== id; });
  KR.saved.unshift(Object.assign({ id:id }, rec)); LS.set('kwSaved', KR.saved);
  L.savedId = id; L.savedName = name; L.dirty = false; LS.set('kwLast', L);
  toast(where === 'cloud' ? '💾 「' + name + '」 저장했습니다 — 다른 PC 에서도 불러올 수 있습니다' : '💾 저장했습니다 (Firebase 연결이 안 돼 이 브라우저에만)', where !== 'cloud');
}
async function krSavedDel(id){
  if(kwFbOk()){ try{ await window._fbSet(window._fbRef(window._fbDb, KW_FB + '/' + id), null); }catch(e){ return toast('지우지 못했습니다: ' + e.message, true); } }

  if(KR.last && KR.last.savedId === id){ delete KR.last.savedId; delete KR.last.savedName; LS.set('kwLast', KR.last); }
}
async function krSavedRename(id, name){
  if(kwFbOk()){ try{ await window._fbSet(window._fbRef(window._fbDb, KW_FB + '/' + id + '/name'), name); }catch(e){ return toast('이름을 바꾸지 못했습니다: ' + e.message, true); } }

  krSavedLoad().then(function(list){
    out.innerHTML = '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><b style="font-size:13px">📂 저장한 리서치 ' + list.length + '개</b>'

      + '<span style="flex:1"></span>' + (KR.last && KR.last.rows ? '<button class="btn sm" id="krBack">← 지금 결과로</button>' : '') + '</div>'

          var d = new Date(r.savedAt || 0), cur = KR.last && KR.last.savedId === r.id;

        }).join('') + '</div>'

async function krRun(){

  if(!inp.fields.length) return toast('살펴볼 분야를 하나 이상 고르세요', true);
  KR.busy = true; var btn = q('#krGo'); btn.disabled = true;
  var out = q('#krOut');
  out.innerHTML = '<div class="card"><div class="progress"><div class="big"><span class="spin"></span> 인터넷으로 조사하는 중</div><div class="sm">' + esc(inp.area) + ' · 보통 30~90초 걸립니다</div></div></div>';
  try{
    var ai = await researchAI(krPrompt(inp), KR.files);
    var d = parseJSON(ai.text), rows = [];
    if(d && d._cut) console.warn('[키워드 리서치] 응답이 길이 한도에서 끊겨 닫힌 곳까지만 살렸습니다');

    if(!rows.length) throw new Error('글감을 받지 못했습니다. 한 번 더 눌러 주세요.');
    var srcs = (d.sources || []).concat(ai.sources || []).filter(function(s){ return s && /^https?:\/\//.test(s.url || ''); });
    var seenU = {}; srcs = srcs.filter(function(s){ if(seenU[s.url]) return false; seenU[s.url] = 1; return true; }).slice(0, 15);

    if(kwConfigured()){
      out.querySelector('.sm').textContent = '네이버 검색량을 붙이는 중…';

function krHot(r){

/* 추천 키워드 — 네이버 연관 검색어 중 실제로 많이 찾는 것.
   「송도」처럼 가장 좁은 지역 이름이 든 것 → 「인천」처럼 넓은 지역 이름이 든 것 → 나머지(지역 키워드가 모자랄 때만) 순서 */
function krRecommend(L){
  var rel = (L.related || []).filter(function(x){ return x && x.total >= 30; });
  var stems = String((L.input && L.input.area) || '').split(/\s+/).map(function(w){ return w.replace(/(국제도시|광역시|특별시|시|군|구|동|읍|면)$/, ''); }).filter(function(w){ return w.length >= 2; });
  var narrow = stems.slice(-1), wide = stems.slice(0, -1);
  var tier = function(k){ k = k.replace(/\s+/g, ''); return narrow.some(function(w){ return k.indexOf(w) >= 0; }) ? 0 : wide.some(function(w){ return k.indexOf(w) >= 0; }) ? 1 : 2; };
  var list = rel.map(function(x, i){ return { x:x, i:i, t:tier(x.kw) }; })
    .sort(function(a, b){ return a.t - b.t || b.x.total - a.x.total; });
  var local = list.filter(function(o){ return o.t < 2; });
  return (local.length >= 6 ? local : list).slice(0, 12);

      + '출력 JSON: {"topics":[{"t":"제목","k":"키워드,키워드"}]} JSON만.';

/* ── 글 만들기 · 사진 · 발행 (한 편) ──────────────────────────────── */
function bpPrompt(row){
  var saved = state.picked;
  state.picked = { t:row.t, k:row.k || '', cat:'묶음 예약' };
  var p;
  try{ p = articlePrompt(); } finally{ state.picked = saved; }
  p = p.replace(/\[분량\] 본문 약 \d+자/, '[분량] 본문 약 ' + BP.opt.len + '자')
       .replace(/\[사진 자리\] \d+곳/, '[사진 자리] ' + BP.opt.photos + '곳');
  if(BP.opt.legal) p = p.replace('[반드시 지킬 것]', '[법령 확인]\n법령·세금·대출 규정이 나오면 ' + new Date().getFullYear() + '년 현재 시행 중인 기준인지 확인해서 쓰고, 근거 법령과 시행 시점을 밝힌다. '
    + '개정 예정이거나 국회 심의 중인 내용은 「예정·정부안」이라고 분명히 적고, 확실하지 않으면 단정하지 말고 checkFacts 에 넣는다.\n\n[반드시 지킬 것]');
  return p;
}
function bpMakePost(d, row){
  return { titles:(d.titles || []).filter(Boolean).slice(0, 8), title:(d.titles || [])[0] || row.t, meta:d.meta || '', blocks:d.blocks,
    tags:(d.tags || []).map(function(t){ return String(t).replace(/^#/, '').trim(); }).filter(Boolean).slice(0, 25), checkFacts:d.checkFacts || [],
    titleKinds:(d.titleKinds || []).map(String), coreKeywords:(d.coreKeywords || []).map(String).filter(Boolean).slice(0, 5),
    longTail:(d.longTail || []).map(String).filter(Boolean).slice(0, 6), nextPosts:(d.nextPosts || []).filter(function(x){ return x && x.t; }).slice(0, 3), at:Date.now(), topic:row.t };
}
function postSlots(post){ var o = []; (post.blocks || []).forEach(function(b, i){ if(b.t === 'image') o.push(i); }); return o; }
function segmentsOf(post, images){
  var segs = [], buf = [], n = -1;
  var flush = function(){ if(buf.length){ segs.push({ html:naverHTML(buf), text:plainText(buf) }); buf = []; } };
  post.blocks.forEach(function(b){
    if(b.t === 'image'){ n++; if(!images[n]) return; flush(); segs.push({ image:n }); }
    else buf.push(b);
  });
  flush(); return segs;
}
async function bpCard(title, bgUrl){
  var st = BX_STYLES.find(function(x){ return x.k === BP.opt.style; }) || BX_STYLES[0];
  var bg = bgUrl ? await bxLoadImg(bgUrl) : null, logo = BP.opt.logo ? await bxLoadImg(bxLogo()) : null;
  var cv = document.createElement('canvas'); bxDrawCard(cv, st, title, state.author.area || '', bg, logo, 1080);
  return cv.toDataURL('image/jpeg', 0.9);
}
/* 사진 채우기 — 1번은 대표 카드, 나머지는 AI 사진. 제미나이 키가 없으면 카드만(글자 카드) */
async function bpFillImages(post, images, ai, say, opt){
  opt = opt || {};
  var slots = postSlots(post), hasKey = keysOf('gemini').length > 0, rep = opt.rep || BP.opt.rep;
  for(var n = 0; n < slots.length; n++){
    if(images[n]) continue;
    if(BP.stop) return;
    var b = post.blocks[slots[n]];
    try{
      if(n === 0 && rep !== 'none' && opt.card !== false){
        say('대표 카드 만드는 중');
        var bg = null;
        if(rep === 'card' && BP.opt.repBg === 'ai' && hasKey){ try{ bg = await genImage(b.prompt || b.caption || post.title); }catch(e){ bg = null; } }
        images[0] = await bpCard(post.title, bg); if(bg) ai[0] = true;
      } else if(hasKey){
        say('사진 ' + (n + 1) + '/' + slots.length + ' 만드는 중');
        images[n] = await genImage(b.prompt || b.caption || post.title); ai[n] = true;
      }
    }catch(e){ say('사진 ' + (n + 1) + ' 실패 — 건너뜁니다 (' + e.message.slice(0, 60) + ')'); }
  }
}
function bpArchive(post, extra){
  var rec = Object.assign({ id:Date.now() + Math.floor(Math.random() * 1000), title:post.title, meta:post.meta, blocks:post.blocks, tags:post.tags, checkFacts:post.checkFacts,
    titles:post.titles, nextPosts:post.nextPosts || [], topic:post.topic || '', url:'', at:new Date().toISOString() }, extra || {});
  state.archive.unshift(rec);
  if(state.archive.length > 60) state.archive.length = 60;
  LS.set('archive', state.archive);
  var c = document.getElementById('arcCnt'); if(c) c.textContent = state.archive.length ? '· ' + state.archive.length : '';
  return rec;
}
function bpArchiveUpdate(rec, patch){
  var r = state.archive.find(function(x){ return x.id === rec.id; }); if(!r) return;
  Object.assign(r, patch); LS.set('archive', state.archive);
}
async function bpEnsureHelper(){
  await checkHelper();
  var h = state.helper;
  if(!h.on) throw new Error('발행 도우미에 연결되지 않습니다 — SJRWS 연결 다리와 발행 도우미(start.bat)가 켜져 있는지 확인해 주세요.');
  if(!verAtLeast(h.ver, '1.8.0')) throw new Error('발행 도우미 v' + (h.ver || '?') + ' 는 네이버 「예약 발행」을 지원하지 않습니다 — v1.8 이상으로 바꿔 주세요(그대로 두면 바로 발행돼 버립니다).');
  if(!h.loggedIn){
    var lr = await fetch(HELPER + '/login', { method:'POST' }).then(function(r){ return r.json(); });
    if(!lr.ok) throw new Error(lr.error || '네이버 로그인에 실패했습니다');
    await checkHelper();
  }
}
async function bpPublish(post, images, ai, when){
  var hm = String(when.time || '08:00').split(':');
  var payload = { title:post.title, segments:segmentsOf(post, images), images:images, aiImages:ai, tags:post.tags || [],
    category:(state.settings.naverCategory || '').trim(), visibility:state.settings.visibility === 'private' ? 'private' : 'public',
    schedule:{ date:when.date, hour:+hm[0], minute:+hm[1] } };
  if(state.settings.withMap && state.author.addr) payload.place = { query:state.author.addr, name:state.author.office };
  var r = await fetch(HELPER + '/publish', { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify(payload) });
  var d = await r.json().catch(function(){ return { error:'도우미 응답을 읽지 못했습니다 (' + r.status + ')' }; });
  if(d.error) throw new Error(d.error + (d.step ? ' (' + d.step + ' 단계)' : ''));
  if(!d.scheduled) throw new Error('도우미가 예약이 아니라 바로 발행했을 수 있습니다 — 블로그를 확인해 주세요' + (d.url ? ' (' + d.url + ')' : ''));
  return d;
}
function bpValidate(slots){
  var now = Date.now(), bad = [];
  slots.forEach(function(s, i){
    var d = parseYmd(s.date), hm = String(s.time || '').split(':');
    if(!d){ bad.push((i + 1) + '번 날짜 없음'); return; }
    d.setHours(+hm[0] || 0, +hm[1] || 0, 0, 0);
    if(d.getTime() < now + 20 * 60000) bad.push((i + 1) + '번 ' + s.date + ' ' + s.time + ' — 지금부터 20분 뒤 이후로 잡아 주세요');
  });
  return bad;
}
function bpProgress(items, title){
  q('#bpBody').innerHTML = '<div class="fl">' + esc(title) + '</div><ul class="bp-prog" id="bpProg">' + items.map(function(s, i){
    return '<li data-p="' + i + '"><span class="st wait">대기</span><span style="flex:1;min-width:0"><b>' + (i + 1) + '. ' + esc(s.cur ? '📌 ' + s.t : (s.t || '')) + '</b>'
      + '<div class="msg">' + (s.date ? '📅 ' + esc(s.date) + ' ' + esc(s.time) : '') + '</div></span></li>'; }).join('') + '</ul>'
    + '<div class="notice warn" style="margin-top:12px">다 끝날 때까지 이 창과 발행 도우미 크롬 창을 건드리지 마세요. 중간에 멈추려면 아래 [중지] — 지금 하던 글까지만 하고 멈춥니다.</div>';
  q('#bpFoot').innerHTML = '<span id="bpFill" style="font-size:12.5px;color:var(--ink2)"></span><span style="flex:1"></span><button class="btn" id="bpStop">중지</button>';
  q('#bpStop').onclick = function(){ BP.stop = true; this.disabled = true; this.textContent = '지금 글까지만 하고 멈춥니다…'; };
}
function bpMark(i, cls, st, msg){
  var li = q('[data-p="' + i + '"]'); if(!li) return;
  var a = li.querySelector('.st'); a.className = 'st ' + cls; a.textContent = st;
  if(msg != null){ var m = li.querySelector('.msg'); m.innerHTML = msg; }
}
async function bpRun(items, mode){
  BP.running = true; BP.stop = false;
  window.onbeforeunload = function(){ return '묶음 예약이 진행 중입니다'; };
  var done = 0, fail = 0, helperErr = '';
  try{
    if(BP.opt.publish || mode === 'old'){ try{ await bpEnsureHelper(); }catch(e){ helperErr = e.message; } }
    if(helperErr && mode === 'old') throw new Error(helperErr);
    for(var i = 0; i < items.length; i++){
      if(BP.stop){ bpMark(i, 'wait', '중지함', null); continue; }
      var s = items[i], post, images = {}, ai = {}, base = (s.date ? '📅 ' + s.date + ' ' + s.time + ' · ' : '');
      var say = (function(i, base){ return function(t){ bpMark(i, 'run', '진행 중', esc(base + t)); }; })(i, base);
      try{
        if(s.cur){
          syncArticle(); post = Object.assign({}, state.post); images = Object.assign({}, state.images);
          Object.keys(state.imgSrc || {}).forEach(function(k){ if(state.imgSrc[k] === 'ai') ai[k] = true; });
        } else if(s.rec){
          post = Object.assign({}, s.rec);
          if(s.fillImg) await bpFillImages(post, images, ai, say, { card:s.card });
        } else {
          say('글 쓰는 중');
          var d = parseJSON(await callAI(bpPrompt(s), { json:true, maxTokens:16000 }));
          if(!d.blocks || !d.blocks.length) throw new Error('본문이 비어 있습니다');
          post = bpMakePost(d, s);
          await bpFillImages(post, images, ai, say);
        }
        if(BP.stop && !s.cur && !s.rec){ /* 사진 도중 멈춤 — 글은 보관함에 둔다 */ }
        var rec = s.rec ? state.archive.find(function(r){ return r.id === s.rec.id; }) : bpArchive(post, { sched:s.date ? { date:s.date, time:s.time } : null, status:'만듦' });
        var nImg = Object.keys(images).length;
        if(BP.opt.publish || mode === 'old'){
          if(helperErr){ bpMark(i, 'err', '예약 못 함', esc(base + '글·사진은 보관함에 저장했습니다 — ' + helperErr)); fail++; continue; }
          say('네이버 예약 거는 중 (사진 ' + nImg + '장)');
          var r = await bpPublish(post, images, ai, s);
          if(rec) bpArchiveUpdate(rec, { status:'예약됨', sched:{ date:s.date, time:s.time }, url:r.url || rec.url || '' });
          bpMark(i, 'ok', '✅ 예약됨', esc(base + '사진 ' + nImg + '장 · 태그 ' + (post.tags || []).length + '개') + (r.url ? ' · <a href="' + esc(r.url) + '" target="_blank" rel="noopener">블로그</a>' : ''));
        } else {
          bpMark(i, 'ok', '✅ 보관함 저장', esc('사진 ' + nImg + '장 (사진은 보관함에 저장되지 않습니다 — 예약 없이 만든 글)'));
        }
        done++;
      }catch(e){
        fail++; bpMark(i, 'err', '❌ 실패', esc(base + e.message));
        if(/도우미|연결|로그인/.test(e.message) && (BP.opt.publish || mode === 'old')){ helperErr = e.message; }
      }
    }
  }catch(e){
    toast(e.message, true);
  }finally{
    BP.running = false; window.onbeforeunload = null;
    var f = q('#bpFoot');
    if(f) f.innerHTML = '<span style="font-size:13px"><b>끝났습니다</b> — 성공 ' + done + '편' + (fail ? ' · 실패 ' + fail + '편' : '') + '</span><span style="flex:1"></span>'
      + '<button class="btn" id="bpArc">🗂 보관함 보기</button><button class="btn primary" id="bpClose">닫기</button>';
    var a = q('#bpArc'); if(a) a.onclick = function(){ xmClose(); openArchive(); };
    var c = q('#bpClose'); if(c) c.onclick = xmClose;
    if(done){ BP.rows.forEach(function(r){ r.t = ''; r.k = ''; r.edited = false; });
      if(BP.src === 'queue'){ BP.queue = BP.queue.filter(function(x){ return !items.some(function(s){ return sameTopic(s.t, x.t); }); }); LS.set('bpQueue', BP.queue); } }
    toast('묶음 예약 끝 — 성공 ' + done + '편' + (fail ? ' · 실패 ' + fail + '편' : ''), !!fail && !done);
  }
}
async function bpStart(){
  bpRecalc();
  var items = bpSlots().filter(function(s){ return s.cur || (s.t || '').trim(); }).map(function(s){ return Object.assign({}, s, { t:(s.t || '').trim(), k:(s.k || '').trim() }); });
  if(!items.length) return toast('주제를 하나 이상 고르거나 적어 주세요', true);
  if(BP.opt.publish){ var bad = bpValidate(items); if(bad.length) return toast(bad[0], true); }
  var noKey = !keysOf('gemini').length && BP.opt.photos > 0;
  var msg = items.length + '편을 ' + (BP.opt.publish ? '만들고 네이버에 예약' : '만들어 보관함에 저장') + '합니다.\n\n'
    + items.map(function(s, i){ return (i + 1) + '. ' + (s.cur ? '📌 ' : '') + s.t + (BP.opt.publish ? '  — ' + s.date + ' ' + s.time : ''); }).join('\n')
    + (noKey ? '\n\n※ 제미나이 키가 없어 AI 사진은 만들지 못합니다(글자 카드만).' : '')
    + (BP.opt.publish ? '\n\n발행 도우미가 크롬을 열어 한 편씩 예약을 겁니다. 계속할까요?' : '\n\n계속할까요?');
  if(!confirm(msg)) return;
  bpProgress(items, BP.opt.publish ? '📅 만들고 예약하는 중' : '📝 만드는 중');
  await bpRun(items, 'new');
}

    BP.opt.start = keep.start; BP.opt.interval = keep.interval;
    var bad = bpValidate(items); if(bad.length) return toast(bad[0], true);
    if(!confirm(items.length + '편에 예약을 겁니다.\n\n' + items.map(function(s, i){ return (i + 1) + '. ' + s.t + '  — ' + s.date + ' ' + s.time; }).join('\n') + '\n\n계속할까요?')) return;
    bpProgress(items, '📦 보관함 글 예약 거는 중');
    await bpRun(items, 'old');
  };
}

/* ── 머리줄 단추 · 설정 칸 ───────────────────────────────────────── */
function mountButtons(){
  var vid = document.getElementById('chipVideo'); if(!vid || document.getElementById('chipKw')) return;
  var a = document.createElement('button'); a.className = 'chip'; a.id = 'chipKw'; a.textContent = '🔎 키워드 리서치'; a.onclick = openKwResearch;
  var b = document.createElement('button'); b.className = 'chip'; b.id = 'chipBatch'; b.textContent = '📅 묶음 예약'; b.onclick = openBatch;
  vid.parentNode.insertBefore(a, vid); vid.parentNode.insertBefore(b, vid);
}
mountButtons();
window.sdBlogKw = { open:openKwResearch, last:function(){ return KR.last; } };
window.sdBlogBatch = { open:openBatch, queue:function(){ return BP.queue; }, state:BP, segmentsOf:segmentsOf, prompt:bpPrompt, dateAt:bpDateAt };
})();
</script>
