<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SJDWS - 현장 업무실</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f7f8fa;color:#1a1a1a;min-height:100vh;zoom:var(--ui-scale,1.15)}
.hdr{background:#fff;border-bottom:0.5px solid #e0e0e0;padding:0 1rem;position:sticky;top:0;z-index:100}
.hdr-inner{max-width:1600px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 0}
.logo{font-size:14px;font-weight:700;color:#1a1a1a;white-space:nowrap}
.tab-bar{background:#fff;border-bottom:0.5px solid #e0e0e0;padding:0 1rem;position:sticky;top:0;z-index:99}
.tab-bar .tabs{max-width:1600px;margin:0 auto;display:flex;gap:2px;flex-wrap:wrap;width:100%}
.tnb{padding:8px 12px;font-size:13px;font-weight:400;color:#666;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tnb.on{color:#1a1a1a;font-weight:600;border-bottom-color:#1a1a1a}
.wrap{max-width:1100px;margin:0 auto;padding:1.25rem 1rem 4rem}
.tc{display:none}.tc.on{display:block}
.card{background:#fff;border:0.5px solid #e0e0e0;border-radius:14px;padding:1.15rem;margin-bottom:1rem}
.sec{font-size:13.5px;font-weight:600;color:#1a1a1a;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fi{width:100%;padding:9px 12px;border:0.5px solid #e0e0e0;border-radius:8px;font-size:14px;font-family:inherit;background:#fff;outline:none}
.fi:focus{border-color:#1a7f3c}
.fl{font-size:12px;color:#666;display:block;margin-bottom:5px}
.btn-p{background:#1a1a1a;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:13.5px;font-weight:500;cursor:pointer;font-family:inherit}
.btn-s{background:#fff;color:#1a1a1a;border:0.5px solid #e0e0e0;border-radius:8px;padding:8px 13px;font-size:12.5px;cursor:pointer;font-family:inherit}
.btn-s:hover{background:#f5f5f3}
.btn-d{background:#fff;color:#cc3333;border:0.5px solid #f5c6c6;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.grid{display:grid;gap:10px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.span2{grid-column:span 2}
.bdg{font-size:10.5px;padding:2px 7px;border-radius:6px;white-space:nowrap;font-weight:500}
.b-r{background:#eef2f8;color:#3b5f8a}
.b-c{background:#f6efe6;color:#8a5f2a}
/* 임장 목록 */
.fl-li{display:flex;align-items:center;gap:10px;padding:12px;border:0.5px solid #e8eae6;border-radius:11px;margin-bottom:8px;cursor:pointer;background:#fff}
.fl-li:hover{border-color:#bfd8c6;background:#fbfdfb}
.fl-li .m{flex:1;min-width:0}
.fl-li .t{font-size:14px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl-li .s{font-size:11.5px;color:#8b9199;display:block;margin-top:2px}
.fl-li .r{text-align:right;white-space:nowrap}
/* 점검 항목 */
.ck{border-bottom:0.5px solid #f2f4f1;padding:11px 0}
.ck:last-child{border-bottom:none}
.ck-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ck-l{font-size:13.5px;flex:1;min-width:120px;line-height:1.45}
.ck-l small{display:block;font-size:11px;color:#98a0a8;margin-top:2px;line-height:1.5}
.ck-b{display:flex;gap:4px;flex-shrink:0}
.ck-b button{padding:6px 11px;font-size:12px;border:0.5px solid #dfe3de;background:#fff;border-radius:7px;cursor:pointer;font-family:inherit;color:#7b858f;white-space:nowrap}
.ck-b button.on[data-v="good"]{background:#e8f5e9;border-color:#8bc79b;color:#20603c;font-weight:600}
.ck-b button.on[data-v="bad"]{background:#fdeeea;border-color:#eaa694;color:#a83b22;font-weight:600}
.ck-b button.on[data-v="na"]{background:#eef0ee;border-color:#c9cec8;color:#5b6169;font-weight:600}
.ck-m{margin-top:8px}
.ck-m input{width:100%;padding:7px 10px;border:0.5px solid #eaa694;border-radius:7px;font-size:13px;font-family:inherit;background:#fffaf8;outline:none}
/* 사진 */
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.ph{position:relative;border-radius:9px;overflow:hidden;border:0.5px solid #e0e0e0;background:#f4f5f2}
.ph img{width:100%;height:110px;object-fit:cover;display:block}
.ph .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:13px;line-height:1}
.ph input{width:100%;border:none;border-top:0.5px solid #e8eae6;padding:5px 7px;font-size:11px;font-family:inherit;outline:none}
/* 서류 */
.doc{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:0.5px solid #f2f4f1;flex-wrap:wrap}
.doc:last-child{border-bottom:none}
.doc .n{flex:1;min-width:130px;font-size:13.5px}
.doc .n small{display:block;font-size:11px;color:#98a0a8;margin-top:2px}
.note{font-size:11.5px;color:#8a6d3b;background:#fffdf5;border:0.5px solid #f0e2b6;border-radius:8px;padding:9px 12px;line-height:1.6}
.prog{height:9px;background:#eceeea;border-radius:6px;overflow:hidden;flex:1;min-width:120px}
.prog>i{display:block;height:100%;border-radius:6px;transition:width .25s}
.empty{text-align:center;padding:44px 20px;color:#8b9199}
@media(max-width:760px){
  body{zoom:1}
  .wrap{padding:0.9rem 0.7rem 4rem}
  .g4,.g3,.g2{grid-template-columns:1fr 1fr}
  .card{padding:0.95rem;border-radius:12px}
  .ck-b button{padding:12px 14px;font-size:13px}
  .ck-l{min-width:100%}
  .ph img{height:96px}
}
@media(max-width:430px){ .g4,.g3,.g2{grid-template-columns:1fr} .span2{grid-column:auto} }
</style>

<script>
/* ===== 분야 판정 (계약관리와 같은 기준) ===== */
var FD_COMM=['상가','사무실','토지','권리','생활숙박시설','지식산업센터','공장','창고'];
function fdSector(r){
  if(!r)return '주거';
  if(r.sector==='주거'||r.sector==='상업')return r.sector;
  return FD_COMM.indexOf(r.type)>=0?'상업':'주거';
}
function fdBdg(r){var s=fdSector(r);return '<span class="bdg '+(s==='상업'?'b-c':'b-r')+'">'+(s==='상업'?'상업용':'주거용')+'</span>';}

/* ===== 임장 점검 항목 ===== */
var FD_CHECKS={
'주거':[
 {k:'h1',l:'채광 · 향',h:'거실 기준 방위, 앞 동과의 거리, 실제 해 드는 시간'},

 {k:'h3',l:'누수 흔적',h:'천장 얼룩, 베란다 천장, 싱크대·세탁기 하부'},
 {k:'h4',l:'곰팡이 · 결로',h:'북쪽 벽, 창틀, 붙박이장 뒤, 다용도실'},
 {k:'h5',l:'수압 · 배수',h:'수도를 동시에 틀어 보고 배수 속도 확인'},
 {k:'h6',l:'난방 방식 · 보일러 연식',h:'개별/지역난방, 보일러 제조년도'},
 {k:'h7',l:'창호 상태',h:'이중창 여부, 샷시 노후, 틈새 바람'},
 {k:'h8',l:'환기 · 맞통풍',h:'앞뒤 창 배치, 화장실 환풍기'},
 {k:'h9',l:'주차',h:'세대당 대수, 기계식 여부, 지하 연결'},
 {k:'h10',l:'엘리베이터',h:'유무, 대수, 교체 이력'},
 {k:'h11',l:'관리 상태',h:'복도·계단·분리수거장·지하주차장 청결'},
 {k:'h12',l:'학교 거리 · 배정',h:'초·중 배정 학교와 도보 시간, 통학로 안전'},
 {k:'h13',l:'교통',h:'지하철·버스 정류장 도보 시간'},
 {k:'h14',l:'생활 편의',h:'마트·병원·공원 거리'},
 {k:'h15',l:'그 밖의 특이사항',h:'반려동물, 확장 여부, 옵션, 하자 보수 이력'}
],
'상업':[
 {k:'s1',l:'전면 길이 · 노출',h:'간판 걸 폭, 도로에서 보이는 정도'},
 {k:'s2',l:'유동 인구',h:'시간대별로 직접 세어 보기 (평일/주말)'},
 {k:'s3',l:'접근성',h:'코너 여부, 횡단보도·버스정류장 위치, 진입 동선'},
 {k:'s4',l:'주차',h:'전용·공용 대수, 인근 공영주차장, 발렛 가능 여부'},
 {k:'s5',l:'간판 위치 · 제한',h:'건물 규약, 옥외광고물 조례, 돌출간판 가능 여부'},
 {k:'s6',l:'전기 용량',h:'현재 계약 전력, 증설 가능 여부와 비용'},
 {k:'s7',l:'급배수 · 오수',h:'상하수 인입, 정화조 용량, 음식점 가능 여부'},
 {k:'s8',l:'화장실',h:'전용/공용, 위치, 남녀 구분'},
 {k:'s9',l:'층고 · 기둥',h:'천장 높이, 기둥 위치로 인한 사용 제약'},
 {k:'s10',l:'환기 · 배기 덕트',h:'덕트 설치 가능 경로, 옥상 배기 허용 여부'},
 {k:'s11',l:'냉난방 설비',h:'설치 여부, 노후도, 임대인 제공 범위'},
 {k:'s12',l:'업종 제한',h:'건축물 용도, 관리규약, 동종업종 입점 제한'},
 {k:'s13',l:'경쟁 점포',h:'반경 내 동일 업종 수와 거리'},
 {k:'s14',l:'건물 공실 현황',h:'전체 호실 대비 공실 수 — 상권 활력의 신호'},
 {k:'s15',l:'관리 상태 · 관리비',h:'공용부 청결, 엘리베이터, 관리비 수준과 산정 방식'}
]};
/* ===== 서류 ===== */
var FD_DOCS={
'주거':[
 {k:'d1',l:'등기사항증명서',h:'소유자, 근저당 채권최고액, 가압류·신탁 여부'},
 {k:'d2',l:'건축물대장',h:'용도, 위반건축물 표시, 면적'},
 {k:'d3',l:'관리비 내역',h:'최근 3개월, 미납 여부'},
 {k:'d4',l:'전입세대 확인서',h:'다가구·다세대는 선순위 보증금 파악에 필수'}
],
'상업':[
 {k:'e1',l:'등기사항증명서',h:'소유자, 근저당 채권최고액, 신탁 여부'},
 {k:'e2',l:'건축물대장',h:'용도(제1·2종 근린생활시설 등), 위반건축물 표시'},
 {k:'e3',l:'임대차 현황표',h:'건물 전체 임차인 현황과 선순위 관계'},
 {k:'e4',l:'관리비 · 공과금 내역',h:'산정 방식, 최근 6개월 실제 부과액'},
 {k:'e5',l:'업종 제한 확인 자료',h:'관리규약, 정화조 용량 확인서, 용도변경 가능 여부'}
]};

/* ===== 자료 ===== */
var FD=[],fdCur=null,_fdTimer=null;
async function fdFetch(){
  try{var r=await window.storage.get('sd_field');FD=r&&r.value?JSON.parse(r.value):[];}
  catch(e){FD=[];console.warn('[현장] 불러오기 실패',e);}
  if(!Array.isArray(FD))FD=[];
}
async function fdStore(){
  try{await window.storage.set('sd_field',JSON.stringify(FD));}
  catch(e){console.warn('[현장] 저장 실패',e);}
}
function fdSaveSoon(){
  if(_fdTimer)clearTimeout(_fdTimer);
  _fdTimer=setTimeout(function(){
    fdStore();
    var n=document.getElementById('fd-saved');
    if(n){n.textContent='자동 저장됨';setTimeout(function(){if(n)n.textContent='';},2000);}
  },700);
}
function fdTitle(r){return [r.bldg,r.dong,r.ho].filter(Boolean).join(' ')||'(이름 없는 임장)';}
function fdToday(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fdScore(r){
  var items=FD_CHECKS[fdSector(r)],ch=r.checks||{};
  var done=items.filter(function(i){return ch[i.k]&&ch[i.k].v;}).length;
  var bad=items.filter(function(i){return ch[i.k]&&ch[i.k].v==='bad';}).length;
  return {done:done,total:items.length,bad:bad,pct:Math.round(done/items.length*100)};
}
function fdClr(p){return p>=100?'#2e7d32':p>=50?'#f57f17':'#c62828';}

function fdNew(){
  var r={id:Date.now(),type:'아파트',sector:'',bldg:'',dong:'',ho:'',addr:'',
    visitDate:fdToday(),visitor:'',ownerName:'',ownerTel:'',
    checks:{},photos:[],docs:{},memo:'',status:'진행중',propId:'',createdAt:new Date().toISOString()};
  FD.unshift(r);fdCur=r;fdStore();sw(1);
}
function fdOpen(id){var r=FD.find(function(x){return x.id===id;});if(!r)return;fdCur=r;sw(1);}
function fdDelete(id){
  var r=FD.find(function(x){return x.id===id;});if(!r)return;
  if(!confirm('임장 기록 「'+fdTitle(r)+'」을 지웁니다.\n\n지워지는 것은 이 임장 기록과 여기 올린 사진·서류뿐입니다.\n매물관리에 등록된 매물 자료는 그대로 남습니다.\n\n진행할까요?'))return;
  FD=FD.filter(function(x){return x.id!==id;});
  if(fdCur&&fdCur.id===id)fdCur=null;
  fdStore();sw(0);
}
var FD_F=['type','bldg','dong','ho','addr','visitDate','visitor','ownerName','ownerTel','memo','status','sector'];
function fdCollect(){
  if(!fdCur)return;
  FD_F.forEach(function(k){var el=document.getElementById('fd-'+k);if(el)fdCur[k]=el.value;});
}
function fdSetCheck(k,v){
  if(!fdCur)return;
  if(!fdCur.checks)fdCur.checks={};

async function fdPhotoSel(input){

/* 매물 연결 */
var _fdProps=null;
async function fdLoadProps(){
  if(_fdProps)return _fdProps;
  try{var r=await window.storage.get('sd_props');_fdProps=r&&r.value?JSON.parse(r.value):[];}
  catch(e){_fdProps=[];}
  return _fdProps;

async function fdPickProp(){
  var ps=await fdLoadProps();
  if(!ps.length){alert('매물관리에서 불러올 매물이 없습니다.');return;}
  var q=prompt('연결할 매물의 단지·건물명을 입력하세요.\n(일부만 적어도 됩니다)','');
  if(q===null)return;
  q=q.trim();if(!q)return;
  var hit=ps.filter(function(p){return String(p.complexName||'').indexOf(q)>=0;}).slice(0,20);
  if(!hit.length){alert('「'+q+'」으로 찾은 매물이 없습니다.');return;}
  var msg=hit.map(function(p,i){return (i+1)+'. '+(p.complexName||'')+' '+(p.unitInfo||'')+' ('+(p.propertyType||'')+')';}).join('\n');
  var pick=prompt('연결할 매물 번호를 입력하세요.\n\n'+msg,'1');
  var n=parseInt(pick,10);
  if(!n||n<1||n>hit.length)return;
  fdCur.propId=String(hit[n-1].id);
  fdCur.propName=(hit[n-1].complexName||'')+' '+(hit[n-1].unitInfo||'');
  if(!fdCur.bldg)fdCur.bldg=hit[n-1].complexName||'';
  fdStore();fdPaint();
}

/* 임장 요약 복사 */
function fdCopySummary(){
  if(!fdCur)return;fdCollect();
  var r=fdCur,sec=fdSector(r),items=FD_CHECKS[sec],ch=r.checks||{};
  var L=[];
  L.push('[임장 기록] '+fdTitle(r)+' ('+(sec==='상업'?'상업용':'주거용')+')');
  if(r.addr)L.push('소재지 : '+r.addr);
  L.push('임장일 : '+(r.visitDate||'-')+(r.visitor?' / '+r.visitor:''));
  L.push('');
  var bad=items.filter(function(i){return ch[i.k]&&ch[i.k].v==='bad';});
  var good=items.filter(function(i){return ch[i.k]&&ch[i.k].v==='good';});
  if(bad.length){
    L.push('■ 확인이 필요한 점 ('+bad.length+')');
    bad.forEach(function(i){L.push(' - '+i.l+(ch[i.k].memo?' : '+ch[i.k].memo:''));});
    L.push('');
  }
  if(good.length){
    L.push('■ 양호 ('+good.length+')');
    L.push(' '+good.map(function(i){return i.l;}).join(', '));
    L.push('');
  }
  var docs=FD_DOCS[sec].filter(function(d){return (r.docs||{})[d.k]&&r.docs[d.k].have;});
  L.push('■ 확보한 서류 : '+(docs.length?docs.map(function(d){return d.l;}).join(', '):'없음'));
  if(r.photos&&r.photos.length)L.push('■ 현장 사진 : '+r.photos.length+'장');
  if(r.memo)L.push('\n■ 메모\n'+r.memo);
  L.push('\n※ 현장에서 확인한 내용이며, 권리관계는 서류로 다시 확인해야 합니다.');
  var ta=document.createElement('textarea');
  ta.value=L.join('\n');document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
  var b=document.getElementById('fd-copy-btn');
  if(b){var o=b.textContent;b.textContent='✅ 복사했습니다';setTimeout(function(){b.textContent=o;},1800);}
}

  window._authProfile=_s;window._authPerms=_s.permissions||{};
  if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",function(){injectBar(_s);});}else{injectBar(_s);}
})();
function sdPerm(k){try{var s=JSON.parse(localStorage.getItem('sd_auth_session')||'{}');if(!s.role)return true;if(s.role==='master'||s.role==='prime')return true;var p=s.permissions&&s.permissions[k];return p!==false;}catch(e){return true;}}
function sdGetScreens(){try{var s=JSON.parse(localStorage.getItem('sd_auth_session')||'{}');if(!s.role||s.role==='master'||s.role==='prime')return null;return(s.permissions&&s.permissions.screens)||{};}catch(e){return null;}}
function sdApplyPerms(){['del_bulk','dl_bulk','up_bulk','del_single'].forEach(function(pk){if(!sdPerm(pk))document.querySelectorAll('[data-perm="'+pk+'"]').forEach(function(el){el.style.display='none';});});var sc=sdGetScreens();if(!sc)return;document.querySelectorAll('a[data-screen]').forEach(function(el){if(sc[el.getAttribute('data-screen')]===false)el.style.display='none';});}
</script>

<script>

(function(){

<!-- ═══════════════════════════════════════════════════════════
     버전 표시 모듈  v1.0
     - 화면 왼쪽 아래에 이 파일의 버전을 작게 띄운다
     - 눌러 보면 9개 프로그램 전체의 버전을 한 번에 확인할 수 있다
       (각 프로그램이 열릴 때 자기 버전을 Firebase 에 적어 둔다)
     기존 코드를 고치지 않고 덧붙이는 방식
     ═══════════════════════════════════════════════════════ -->
<script>
(function(){
  'use strict';

  var SD_VER  = '2026.09.23-3';       // 배포 버전 — 파일을 고칠 때마다 올린다
  var SD_FILE = 'sd_field.html';      // 이 파일 이름
  var SD_NAME = '현장업무실';      // 사람이 부르는 이름

  // 전체 프로그램 목록 — 버전 비교용
  var SD_ALL = [
    ['sd_hub.html','허브'], ['sd_props.html','매물관리'], ['sd_custs.html','고객관리'],
    ['sd_contracts.html','계약관리'], ['sd_schedule.html','일정관리'], ['sd_field.html','현장업무실'],
    ['sd_marketing.html','마케팅'], ['sd_blog.html','블로그 스튜디오'],
    ['sd_sangga.html','상가관리'], ['sd_data.html','실거래가']
  ];

  window.SD_VERSION = SD_VER;
  window.SD_FILENAME = SD_FILE;

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function stamp(){
    var d=new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
      +' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }

  // 버전 문자열 비교 — '2026.09.21-2' > '2026.09.23-3'
  function verKey(v){
    var m=String(v||'').match(/(\d{4})\.(\d{2})\.(\d{2})-(\d+)/);
    return m ? (m[1]+m[2]+m[3]+String(m[4]).padStart(3,'0')) : '0';
  }

  // ── 내 버전을 기록해 둔다 ───────────────────────────────
  var REG={};
  async function report(){
    try{
      var r=await window.storage.get('sd_versions');
      REG = (r&&r.value) ? (JSON.parse(r.value)||{}) : {};
    }catch(e){ REG={}; }
    var mine=REG[SD_FILE];
    // 버전이 그대로면 굳이 다시 쓰지 않는다 (불필요한 저장 줄이기)
    if(!mine || mine.ver!==SD_VER){
      REG[SD_FILE]={ ver:SD_VER, name:SD_NAME, at:stamp(),
                     by:(window._authProfile||{}).name||'' };
      try{ await window.storage.set('sd_versions', JSON.stringify(REG)); }catch(e){}
    }
    paint();
  }

  // ── 왼쪽 아래 표시 ──────────────────────────────────────
  function mount(){
    if(document.getElementById('sd-ver-badge')) return;
    var st=document.createElement('style'); st.id='sd-ver-css';
    st.textContent='body{padding-bottom:34px}'
      +'#sd-ver-badge{position:fixed;left:10px;bottom:8px;z-index:9000;'
      +'background:rgba(26,39,68,.62);color:#fff;border:none;border-radius:8px;padding:3px 8px;'
      +'font-size:10px;letter-spacing:.2px;cursor:pointer;opacity:.38;transition:opacity .15s;'
      +'font-family:inherit;line-height:1.3;white-space:nowrap}'
      +'#sd-ver-badge:hover{opacity:1}'
      +'#sd-ver-ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10090;display:flex;'
      +'align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}'
      +'#sd-ver-ov .vbox{background:#fff;border-radius:14px;max-width:460px;width:100%;margin:auto;'
      +'overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.25)}'
      +'#sd-ver-ov table{width:100%;border-collapse:collapse;font-size:12.5px}'
      +'#sd-ver-ov td{padding:7px 6px;border-bottom:0.5px solid #f0f0f0}'
      +'@media(max-width:560px){#sd-ver-badge{font-size:10px;padding:3px 7px;left:6px;bottom:6px}}';
    document.head.appendChild(st);

    var b=document.createElement('button');
    b.id='sd-ver-badge';
    b.textContent='v'+SD_VER;
    b.title=SD_NAME+' · '+SD_FILE+'\n전체 프로그램 버전 보기';
    b.onclick=function(e){ e.stopPropagation(); openPanel(); };
    document.body.appendChild(b);
  }

  function paint(){
    var b=document.getElementById('sd-ver-badge');
    if(!b) return;
    // 나보다 높은 버전이 하나라도 있으면 알려 준다
    var top=SD_VER;
    Object.keys(REG).forEach(function(k){
      if(verKey(REG[k].ver)>verKey(top)) top=REG[k].ver;
    });
    if(verKey(top)>verKey(SD_VER)){
      b.textContent='v'+SD_VER+' ⚠';
      b.style.background='rgba(198,40,40,.78)';
      b.title=SD_NAME+' · '+SD_FILE+'\n더 높은 버전('+top+')이 다른 프로그램에 올라가 있습니다.\n이 파일도 최신본으로 올렸는지 확인하세요.';
    }
  }

  window.sdVerPanel=function(){ openPanel(); };

  function openPanel(){
    var old=document.getElementById('sd-ver-ov'); if(old) old.remove();

    var top='';
    SD_ALL.forEach(function(p){ var e=REG[p[0]]; if(e&&verKey(e.ver)>verKey(top)) top=e.ver; });

    var rows=SD_ALL.map(function(p){
      var file=p[0], name=p[1], e=REG[file];
      var isMe = file===SD_FILE;
      if(!e){
        return '<tr><td style="color:#1a1a1a">'+esc(name)+(isMe?' <span style="font-size:10px;color:#1565c0">◀ 지금 화면</span>':'')+'</td>'
          +'<td style="color:#bbb;text-align:right;white-space:nowrap">확인 안 됨</td></tr>';
      }
      var old2 = top && verKey(e.ver)<verKey(top);
      return '<tr><td style="color:#1a1a1a">'+esc(name)+(isMe?' <span style="font-size:10px;color:#1565c0">◀ 지금 화면</span>':'')
        +'<div style="font-size:10px;color:#bbb">'+esc(file)+' · '+esc(e.at||'')+'</div></td>'
        +'<td style="text-align:right;white-space:nowrap;color:'+(old2?'#c62828':'#2e7d32')+';font-weight:'+(old2?'700':'500')+'">'
        +'v'+esc(e.ver)+(old2?'<div style="font-size:10px;font-weight:400">구버전일 수 있음</div>':'')+'</td></tr>';
    }).join('');

    var unseen=SD_ALL.filter(function(p){return !REG[p[0]];}).length;

    var ov=document.createElement('div');
    ov.id='sd-ver-ov';
    ov.innerHTML='<div class="vbox">'
      + '<div style="background:#1a2744;color:#fff;padding:13px 18px;display:flex;justify-content:space-between;align-items:center">'
      +   '<span style="font-size:14px;font-weight:700">🏷️ 프로그램 버전</span>'
      +   '<button onclick="document.getElementById(\'sd-ver-ov\').remove()" '
      +     'style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;'
      +     'padding:4px 10px;font-size:12px;cursor:pointer">✕ 닫기</button>'
      + '</div>'
      + '<div style="padding:14px 16px">'
      +   '<table>'+rows+'</table>'
      +   '<p style="font-size:11px;color:#888;line-height:1.7;margin:12px 0 0">'
      +     '각 프로그램을 한 번 열어야 그 버전이 여기에 기록됩니다. '
      +     (unseen? '아직 '+unseen+'개는 이 브라우저에서 연 적이 없어 «확인 안 됨»으로 나옵니다. ':'')
      +     '버전이 서로 다르면 올리다 빠뜨린 파일이 있는지 확인해 보세요.'
      +   '</p>'
      + '</div></div>';
    document.body.appendChild(ov);
    ov.onclick=function(e){ if(e.target===ov) ov.remove(); };
  }

  function boot(){ mount(); report(); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ setTimeout(boot,600); });
  else setTimeout(boot,600);
})();
</script>


<!-- ═══════════════════════════════════════════════════════════
     자료 읽기 순서 맞추기 모듈  v1.2
     - 화면이 로그인보다 먼저 자료를 읽으러 가면 규칙에 막혀 빈 화면이 된다.
       (막힌 뒤 다시 시도하지 않는 화면이 있어 더 문제)
     - 그래서 로그인이 끝날 때까지 파이어베이스 손잡이를 잠깐 감춰 둔다.
       화면은 손잡이가 생길 때까지 기다리므로, 저절로 순서가 맞는다.
     - window.storage 는 감추는 대신 '로그인 후에 실행'되도록 감싼다.
     - 8초가 지나면 무슨 일이 있어도 열어 준다 (영원히 멈추지 않게)
     ═══════════════════════════════════════════════════════ -->
<script>
(function(){
  'use strict';
  var GATED=['_fbDb','_fbGet','_fbRef','_fbChild','_fbSet','_fbRemove','_fbOn','_fbStorage','_fbPush','_fbUpdate'];
  var HELD={}, opened=false, waiters=[];

  window.sdAuth = window.sdAuth || {};
  window.sdAuth.gate = '대기';

  GATED.forEach(function(k){
    try{
      if(k in window && window[k]!==undefined) HELD[k]=window[k];
      Object.defineProperty(window, k, {
        configurable:true,
        get:function(){ return opened ? HELD[k] : undefined; },
        set:function(v){ HELD[k]=v; }
      });
    }catch(e){}
  });

  function openGate(why){
    if(opened) return;
    opened=true;
    window.sdAuth.gate='열림 ('+why+')';
    GATED.forEach(function(k){
      try{ Object.defineProperty(window,k,{configurable:true,writable:true,value:HELD[k]}); }
      catch(e){ try{ window[k]=HELD[k]; }catch(e2){} }
    });
    var w=waiters; waiters=[];
    w.forEach(function(fn){ try{ fn(); }catch(e){} });
  }
  window.sdAuthDone = function(){ openGate('로그인'); };
  window.sdAuthWait = function(){
    if(opened) return Promise.resolve();
    return new Promise(function(res){ waiters.push(res); });
  };
  setTimeout(function(){ openGate('시간초과'); }, 8000);   // 안전장치

  // ── window.storage 는 감추지 않고 '기다렸다 실행'하도록 감싼다
  var wrapped=false;
  function wrapStorage(){
    if(wrapped) return;
    var s=window.storage;
    if(!s || typeof s.get!=='function') return;
    wrapped=true;
    var og=s.get.bind(s), os=(typeof s.set==='function')?s.set.bind(s):null;
    s.get=function(){ var a=arguments; return window.sdAuthWait().then(function(){ return og.apply(null,a); }); };
    if(os) s.set=function(){ var a=arguments; return window.sdAuthWait().then(function(){ return os.apply(null,a); }); };
  }
  var n=0;
  var iv=setInterval(function(){ wrapStorage(); if(wrapped || ++n>80) clearInterval(iv); }, 100);
  wrapStorage();
})();
</script>

<!-- ═══════════════════════════════════════════════════════════
     파이어베이스 로그인 이어받기 모듈  v1.1
     - 허브에서 구글로 로그인해 두면 다른 화면도 그 로그인을 그대로 이어받는다
       (같은 주소이므로 브라우저에 저장된 로그인이 살아난다)
     - 이어받을 로그인이 없을 때만 익명으로 들어간다 (자료가 안 열리는 일이 없게)
     - 로그아웃한 뒤에는 익명으로 되돌리지 않는다
     - 화면·기능은 하나도 바뀌지 않는다. 상태는 window.sdAuth 로 확인.
     ═══════════════════════════════════════════════════════ -->
<script>
(function(){
  'use strict';
  window.sdAuth = window.sdAuth || {};
  function mark(v){ window.sdAuth.compat = v; }

  function ready(){ return !!(window.firebase && firebase.apps && firebase.apps.length); }
  function loadSdk(){
    if(window.firebase && firebase.auth) return Promise.resolve(true);
    return new Promise(function(res){
      var s=document.createElement('script');
      s.src='https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js';
      s.onload=function(){ res(true); };
      s.onerror=function(){ mark('로그인 기능을 못 불러옴'); res(false); };
      document.head.appendChild(s);
    });
  }
  async function go(tries){
    tries = tries||0;
    if(!ready()){
      if(tries<40) return setTimeout(function(){ go(tries+1); }, 250);
      mark('파이어베이스 앱 없음'); return;
    }
    var ok = await loadSdk();
    if(!ok || !firebase.auth) return;

    var auth = firebase.auth(), settled = false;
    mark('확인 중…');
    // 저장된 로그인이 살아날 때까지 기다린 뒤에 판단한다.
    // (기다리지 않고 바로 익명으로 들어가면 구글 로그인을 밀어내 버린다)
    auth.onAuthStateChanged(async function(u){
      if(u){
        settled = true;
        mark(u.isAnonymous ? '로그인됨 (익명) '+u.uid.slice(0,8)
                           : '로그인됨 (구글 '+(u.email||u.uid.slice(0,8))+')');
        if(window.sdAuthDone) window.sdAuthDone();
        return;
      }
      if(settled){ mark('로그아웃 상태'); return; }   // 직접 로그아웃한 경우
      settled = true;
      try{
        await auth.signInAnonymously();
      }catch(e){
        mark('익명 로그인 실패: '+((e&&e.code)||(e&&e.message)||e));
        if(window.sdAuthDone) window.sdAuthDone();
        console.warn('[SJDWS] 익명 로그인 실패 — 파이어베이스 콘솔에서 익명 인증을 켜 주세요.', e);
      }
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', function(){ go(); });
  else go();
})();
</script>
</body>
